<circle cx="373.3" cy="92.9" r="4.2" class="p1"/>
<circle cx="431.6" cy="89.6" r="4.2" class="p1"/>
<path d="M 314.9,272.7 L 373.3,253.5 L 431.6,70.5" class="db2"/>
<circle cx="314.9" cy="272.7" r="4.2" class="p2"/>
<circle cx="373.3" cy="253.5" r="4.2" class="p2"/>
<circle cx="431.6" cy="70.5" r="4.2" class="p2"/>
<text x="398.0" y="342" class="sm" text-anchor="middle">n / k   (target images per feature dimension, log scale)</text>
<text transform="translate(22,177.0) rotate(-90)" class="sm" text-anchor="middle">seed-to-seed stability</text>
<path d="M 86,364 h 26" class="sb1"/><circle cx="99" cy="364" r="4" class="p1"/>
<text x="120" y="368" class="sm" text-anchor="start">LEEP, k = 64</text>
<path d="M 244,364 h 26" class="sb2"/><circle cx="257" cy="364" r="4" class="p2"/>
<text x="278" y="368" class="sm" text-anchor="start">H-score, k = 64</text>
<path d="M 402,364 h 26" class="db1"/><circle cx="415" cy="364" r="4" class="p1"/>
<text x="436" y="368" class="sm" text-anchor="start">LEEP, k = 256</text>
