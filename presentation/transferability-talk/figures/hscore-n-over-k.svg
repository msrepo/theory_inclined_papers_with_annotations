<path d="M 431.6,302 v 5" class="ax"/>
<text x="431.617384797368" y="321" class="tiny" text-anchor="middle">2</text>
<path d="M 508.8,302 v 5" class="ax"/>
<text x="508.7695481780817" y="321" class="tiny" text-anchor="middle">5</text>
<path d="M 567.1,302 v 5" class="ax"/>
<text x="567.1329067292043" y="321" class="tiny" text-anchor="middle">10</text>
<path d="M 659.6,302 v 5" class="ax"/>
<text x="659.6366414488773" y="321" class="tiny" text-anchor="middle">30</text>
<rect x="78" y="52" width="640" height="250" class="frame"/>
<path d="M 431.6,52 V 302" class="refd"/>
<text x="437.617384797368" y="66" class="sm" text-anchor="start">n / k ≈ 2</text>
<path d="M 121.0,52 V 302" class="ref"/>
<text x="127.01178721216347" y="66" class="sm" text-anchor="start">Breast, 5% subset, ResNet-18: n / k ≈ 0.05</text>
<text x="149.3429271766342" y="177.92592592592592" class="sm" text-anchor="start">cond(S_T) ≈</text>
<text x="149.3429271766342" y="192.92592592592592" class="sm" text-anchor="start">8e16 to 2e18</text>
<text x="548.3441018996134" y="122.37037037037038" class="sm" text-anchor="middle">cond(S_T) ≈ 2–36</text>
<path d="M 314.9,141.3 L 373.3,110.9 L 431.6,90.7 L 662.4,70.5" class="sb1"/>
<circle cx="314.9" cy="141.3" r="4.2" class="p1"/>
