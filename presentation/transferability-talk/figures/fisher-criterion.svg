<svg viewBox="0 0 890 386" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Fisher's criterion on two projected classes</title>
<desc>Left: two classes with a shared correlated spread and three candidate directions. Right: the same classes projected on each direction as two one-dimensional Gaussians. The Fisher direction separates them best, with J of 17.6 against 9.0 for the direction along the means and 2.6 for the long axis of the spread.</desc>
