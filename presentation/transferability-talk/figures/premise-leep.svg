<svg viewBox="0 0 890 166" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Premise of leep</title>
<desc>Premise loosened: source and target inputs may differ; the head's softmax stands in for z. Boxes: source data, target inputs, feature extractor, head, target labels; used ones are filled, unused ones dashed; a final box shows what the score reads.</desc>
<style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
  .hd{font-size:14.5px;font-weight:500;fill:#1a1a19} .v{font-size:13px;fill:#1a1a19}
  .b{font-weight:500} .sm{font-size:12px;fill:#57564f} .tiny{font-size:11px;fill:#57564f}
  .it{font-style:italic} .sb{font-size:72%}
  .bgcard{fill:#fbfaf6}
  .box{fill:#f1efe7;stroke:#8a8880;stroke-width:1.3}
  .slow{fill:#f7e7d8;stroke:#c8702f;stroke-width:1.5} .fast{fill:#dfeaf6;stroke:#2f6fb5;stroke-width:1.5}
  .need{fill:#dfeaf6;stroke:#2f6fb5;stroke-width:1.8} .free{fill:#f7e7d8;stroke:#c8702f;stroke-width:1.8}
  .e{stroke:#1a1a19;stroke-width:1.5;fill:none} .ah{fill:#1a1a19}
  .ax{stroke:#8a8880;stroke-width:0.9;fill:none} .gd{stroke:#e2e1da;stroke-width:0.7;fill:none}
  .frame{fill:none;stroke:#c9c7bf;stroke-width:1}
  .sb1{stroke:#2f6fb5;stroke-width:2.2;fill:none} .sb2{stroke:#c8702f;stroke-width:2.2;fill:none}
  .db1{stroke:#2f6fb5;stroke-width:2.2;fill:none;stroke-dasharray:6 4}
  .db2{stroke:#c8702f;stroke-width:2.2;fill:none;stroke-dasharray:6 4}
  .p1{fill:#2f6fb5;stroke:#fbfaf6;stroke-width:1.2} .p2{fill:#c8702f;stroke:#fbfaf6;stroke-width:1.2}
  .band{fill:#c8702f;opacity:.10} .ref{stroke:#8a8880;stroke-width:1.1;stroke-dasharray:3 3;fill:none}
  .refd{stroke:#1a1a19;stroke-width:1.3;stroke-dasharray:6 4;fill:none}
  .blue{fill:#2f6fb5} .orange{fill:#c8702f}
  .cen{stroke:#1a1a19;stroke-width:1.6}
  .off{fill:none;stroke:#b3b1a8;stroke-width:1.3;stroke-dasharray:5 4}
  @media (prefers-color-scheme: dark){
    .hd,.v{fill:#eceae3} .sm,.tiny{fill:#b6b4ab} .bgcard{fill:#161615}
    .box{fill:#25241f;stroke:#85837b}
    .slow{fill:#3a2a1c;stroke:#e09a5f} .fast{fill:#1d2f45;stroke:#7fb2e8}
    .need{fill:#1d2f45;stroke:#7fb2e8} .free{fill:#3a2a1c;stroke:#e09a5f}
    .e{stroke:#eceae3} .ah{fill:#eceae3}
    .ax{stroke:#85837b} .gd{stroke:#33312e} .frame{stroke:#4a4844}
    .sb1,.db1{stroke:#7fb2e8} .sb2,.db2{stroke:#e09a5f}
    .p1{fill:#7fb2e8;stroke:#161615} .p2{fill:#e09a5f;stroke:#161615}
    .band{fill:#e09a5f;opacity:.14} .ref{stroke:#85837b} .refd{stroke:#eceae3}
    .blue{fill:#7fb2e8} .orange{fill:#e09a5f} .off{stroke:#5d5b55} .cen{stroke:#eceae3}
  }
</style>
<defs><marker id="ah" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,4 L0,8 Z" class="ah"/></marker></defs>
<rect width="890" height="166" rx="6" class="bgcard"/>
<text x="14" y="24" class="hd" text-anchor="start"><tspan>Premise loosened: source and target inputs may differ; the head's softmax stands in for z</tspan></text>
<rect x="14" y="38" width="124" height="62" rx="8" class="off"/>
<text x="76.0" y="65.5" class="sm" text-anchor="middle"><tspan>Source data</tspan></text>
<text x="76.0" y="81.5" class="tiny" text-anchor="middle"><tspan>not needed</tspan></text>
<rect x="162" y="38" width="124" height="62" rx="8" class="need"/>
<text x="224.0" y="65.5" class="v b" text-anchor="middle"><tspan>Target inputs x</tspan></text>
<text x="224.0" y="81.5" class="sm" text-anchor="middle"><tspan>not the source's</tspan></text>
<rect x="310" y="38" width="124" height="62" rx="8" class="need"/>
<text x="372.0" y="65.5" class="v b" text-anchor="middle"><tspan>Extractor </tspan><tspan class="it">φ</tspan><tspan class="it sb" dy="4">m</tspan></text>
<text x="372.0" y="81.5" class="sm" text-anchor="middle"><tspan>frozen</tspan></text>
<rect x="458" y="38" width="124" height="62" rx="8" class="need"/>
<text x="520.0" y="65.5" class="v b" text-anchor="middle"><tspan>Head </tspan><tspan class="it">h</tspan><tspan class="it sb" dy="4">m</tspan></text>
<text x="520.0" y="81.5" class="sm" text-anchor="middle"><tspan>frozen; gives θ(x)</tspan></text>
<rect x="606" y="38" width="124" height="62" rx="8" class="need"/>
<text x="668.0" y="73.5" class="v b" text-anchor="middle"><tspan>Target labels y</tspan></text>
<rect x="754" y="38" width="124" height="62" rx="8" class="free"/>
<text x="816.0" y="57.5" class="v b" text-anchor="middle"><tspan>Reads</tspan></text>
<text x="816.0" y="73.5" class="sm" text-anchor="middle"><tspan>θ(x) as a dummy z</tspan></text>
<text x="816.0" y="89.5" class="sm" text-anchor="middle"><tspan>and the labels y</tspan></text>
<path d="M 289,69.0 H 305" class="e" marker-end="url(#ah)"/>
<path d="M 437,69.0 H 453" class="e" marker-end="url(#ah)"/>
<path d="M 538.0,103 V 120 H 798.0 V 105" class="e" marker-end="url(#ah)"/>
<path d="M 733,69.0 H 749" class="e" marker-end="url(#ah)"/>
<rect x="14" y="146" width="14" height="10" rx="2" class="need"/>
<text x="34" y="155" class="tiny" text-anchor="start">used</text>
<rect x="84" y="146" width="14" height="10" rx="2" class="off"/>
<text x="104" y="155" class="tiny" text-anchor="start">not used</text>
<rect x="170" y="146" width="14" height="10" rx="2" class="free"/>
<text x="190" y="155" class="tiny" text-anchor="start">what the score reads</text>
</svg>
