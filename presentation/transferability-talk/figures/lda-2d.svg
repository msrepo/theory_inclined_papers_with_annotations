<svg viewBox="0 0 890 326" xmlns="http://www.w3.org/2000/svg" role="img">
<title>LDA in two dimensions</title>
<desc>Two class means at minus 1.5 and plus 1.5 on the horizontal axis, each surrounded by tilted elliptical contours of the shared covariance. A dotted vertical line is the perpendicular bisector of the means; the LDA boundary, a dashed line, is tilted because of the inverse covariance, and the arrow w is normal to it.</desc>
<style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
  .hd{font-size:14.5px;font-weight:500;fill:#1a1a19} .v{font-size:13px;fill:#1a1a19}
  .b{font-weight:500} .sm{font-size:12px;fill:#57564f} .tiny{font-size:11px;fill:#57564f}
  .it{font-style:italic} .sb{font-size:72%}
  .bgcard{fill:#fbfaf6}
  .box{fill:#f1efe7;stroke:#8a8880;stroke-width:1.3}
  .slow{fill:#f7e7d8;stroke:#c8702f;stroke-width:1.5} .fast{fill:#dfeaf6;stroke:#2f6fb5;stroke-width:1.5}
  .need{fill:#dfeaf6;stroke:#2f6fb5;stroke-width:1.8} .free{fill:#f7e7d8;stroke:#c8702f;stroke-width:1.8}
  .e{stroke:#1a1a19;stroke-width:1.5;fill:none} .ah{fill:#1a1a19}
  .ax{stroke:#8a8880;stroke-width:0.9;fill:none} .gd{stroke:#e2e1da;stroke-width:0.7;fill:none}
  .frame{fill:none;stroke:#c9c7bf;stroke-width:1}
  .sb1{stroke:#2f6fb5;stroke-width:2.2;fill:none} .sb2{stroke:#c8702f;stroke-width:2.2;fill:none}
  .db1{stroke:#2f6fb5;stroke-width:2.2;fill:none;stroke-dasharray:6 4}
  .db2{stroke:#c8702f;stroke-width:2.2;fill:none;stroke-dasharray:6 4}
  .p1{fill:#2f6fb5;stroke:#fbfaf6;stroke-width:1.2} .p2{fill:#c8702f;stroke:#fbfaf6;stroke-width:1.2}
  .band{fill:#c8702f;opacity:.10} .ref{stroke:#8a8880;stroke-width:1.1;stroke-dasharray:3 3;fill:none}
  .refd{stroke:#1a1a19;stroke-width:1.3;stroke-dasharray:6 4;fill:none}
  .blue{fill:#2f6fb5} .orange{fill:#c8702f}
  .cen{stroke:#1a1a19;stroke-width:1.6}
  .off{fill:none;stroke:#b3b1a8;stroke-width:1.3;stroke-dasharray:5 4}
  @media (prefers-color-scheme: dark){
    .hd,.v{fill:#eceae3} .sm,.tiny{fill:#b6b4ab} .bgcard{fill:#161615}
    .box{fill:#25241f;stroke:#85837b}
    .slow{fill:#3a2a1c;stroke:#e09a5f} .fast{fill:#1d2f45;stroke:#7fb2e8}
    .need{fill:#1d2f45;stroke:#7fb2e8} .free{fill:#3a2a1c;stroke:#e09a5f}
    .e{stroke:#eceae3} .ah{fill:#eceae3}
    .ax{stroke:#85837b} .gd{stroke:#33312e} .frame{stroke:#4a4844}
    .sb1,.db1{stroke:#7fb2e8} .sb2,.db2{stroke:#e09a5f}
    .p1{fill:#7fb2e8;stroke:#161615} .p2{fill:#e09a5f;stroke:#161615}
    .band{fill:#e09a5f;opacity:.14} .ref{stroke:#85837b} .refd{stroke:#eceae3}
    .blue{fill:#7fb2e8} .orange{fill:#e09a5f} .off{stroke:#5d5b55} .cen{stroke:#eceae3}
  }
</style>
<defs><marker id="ah" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,4 L0,8 Z" class="ah"/></marker></defs>
<rect width="890" height="326" rx="6" class="bgcard"/>
<text x="14" y="24" class="hd" text-anchor="start">LDA in two dimensions: with one shared, correlated covariance Σ the boundary is still a straight line, tilted by Σ⁻¹</text>
<rect x="14" y="40" width="560" height="270" rx="6" class="frame"/>
<path d="M 24,168 H 564" class="ax"/><path d="M 300,48 V 302" class="ax"/>
<text x="92" y="183" class="tiny" text-anchor="middle">−4</text>
<text x="196" y="183" class="tiny" text-anchor="middle">−2</text>
<text x="404" y="183" class="tiny" text-anchor="middle">2</text>
<text x="508" y="183" class="tiny" text-anchor="middle">4</text>
<text x="294" y="276" class="tiny" text-anchor="end">−2</text>
<text x="294" y="224" class="tiny" text-anchor="end">−1</text>
<text x="294" y="120" class="tiny" text-anchor="end">1</text>
<text x="294" y="68" class="tiny" text-anchor="end">2</text>
<text x="562" y="162" class="sm" text-anchor="end"><tspan>feature x</tspan><tspan class="it sb" dy="4">1</tspan></text>
<text x="308" y="60" class="sm" text-anchor="start"><tspan>feature x</tspan><tspan class="it sb" dy="4">2</tspan></text>
<ellipse cx="222.0" cy="168.0" rx="50.8" ry="21.4" transform="rotate(-45 222.0 168.0)" class="sb1" fill="none" opacity="0.9"/>
<ellipse cx="222.0" cy="168.0" rx="101.7" ry="42.7" transform="rotate(-45 222.0 168.0)" class="sb1" fill="none" opacity="0.45"/>
<circle cx="222.0" cy="168.0" r="6" class="p1 cen"/>
<ellipse cx="378.0" cy="168.0" rx="50.8" ry="21.4" transform="rotate(-45 378.0 168.0)" class="sb2" fill="none" opacity="0.9"/>
<ellipse cx="378.0" cy="168.0" rx="101.7" ry="42.7" transform="rotate(-45 378.0 168.0)" class="sb2" fill="none" opacity="0.45"/>
<circle cx="378.0" cy="168.0" r="6" class="p2 cen"/>
<path d="M 300.0,48 V 302" class="ref"/>
<path d="M 377.5,57.2 L 222.5,278.8" class="refd"/>
<path d="M 300.0,168.0 L 240.4,126.3" class="e" marker-end="url(#ah)"/>
<text x="222.0" y="154.0" class="sm" text-anchor="middle">μ_A</text>
<text x="378.0" y="154.0" class="sm" text-anchor="middle">μ_B</text>
<text x="234.35991618621387" y="118.2519413303497" class="sm" text-anchor="end">w</text>
<text x="26" y="78" class="tiny" text-anchor="start">ellipses: 1σ and 2σ of the shared covariance</text>
<text x="306" y="296" class="tiny" text-anchor="start">perpendicular bisector (what Σ = I would give)</text>
<text x="590" y="66" class="v b" text-anchor="start">Boundary:  wᵀx = 0,   w = Σ⁻¹(μ_A − μ_B)</text>
<text x="590" y="92" class="sm" text-anchor="start">Σ = [[1, 0.7], [0.7, 1]],   μ_A − μ_B = (−3, 0)</text>
<text x="590" y="111" class="sm" text-anchor="start">Σ⁻¹(μ_A − μ_B) = (−5.88, 4.12)</text>
<text x="590" y="130" class="sm" text-anchor="start"></text>
<text x="590" y="149" class="sm" text-anchor="start">The classes are stretched along the diagonal, so</text>
<text x="590" y="168" class="sm" text-anchor="start">the most reliable separating direction is not the</text>
<text x="590" y="187" class="sm" text-anchor="start">line joining the means. Σ⁻¹ corrects for the spread:</text>
<text x="590" y="206" class="sm" text-anchor="start">it turns the boundary from the dotted vertical line</text>
<text x="590" y="225" class="sm" text-anchor="start">to the dashed tilted one.</text>
<text x="590" y="244" class="sm" text-anchor="start"></text>
<text x="590" y="263" class="sm" text-anchor="start">With Σ = I (SFDA after its Fisher projection)</text>
<text x="590" y="282" class="sm" text-anchor="start">w is parallel to μ_A − μ_B, and the boundary is the</text>
<text x="590" y="301" class="sm" text-anchor="start">exact perpendicular bisector.</text>
</svg>
