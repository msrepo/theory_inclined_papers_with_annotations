<svg viewBox="0 0 890 478" xmlns="http://www.w3.org/2000/svg" role="img">
<title>What the inverse covariance does in the H-score</title>
<desc>Two columns, each with the same centroid gap of 2 between two classes. Left: the gap lies along a quiet direction; right: along a noisy one. Top: raw features with the total-spread ellipse. Bottom: after dividing by the total spread, the ellipse is a unit circle and the gap is 1.79 versus 0.63, giving H of 0.80 versus 0.10.</desc>
