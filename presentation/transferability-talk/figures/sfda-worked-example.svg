<svg viewBox="0 0 890 316" xmlns="http://www.w3.org/2000/svg" role="img">
<title>SFDA worked example</title>
<desc>Two one-dimensional binary toy models. Each shows class A and mirrored class B before and after ConfMix, with the confidence of the class A samples. Both tie at minus 0.127 on the first pass; after ConfMix model X scores minus 0.273 and model Y minus 0.339, because its ambiguous sample crossed the decision boundary.</desc>
<style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
  .hd{font-size:14.5px;font-weight:500;fill:#1a1a19} .v{font-size:13px;fill:#1a1a19}
  .b{font-weight:500} .sm{font-size:12px;fill:#57564f} .tiny{font-size:11px;fill:#57564f}
  .it{font-style:italic} .sb{font-size:72%}
  .bgcard{fill:#fbfaf6}
  .box{fill:#f1efe7;stroke:#8a8880;stroke-width:1.3}
  .slow{fill:#f7e7d8;stroke:#c8702f;stroke-width:1.5} .fast{fill:#dfeaf6;stroke:#2f6fb5;stroke-width:1.5}
  .need{fill:#dfeaf6;stroke:#2f6fb5;stroke-width:1.8} .free{fill:#f7e7d8;stroke:#c8702f;stroke-width:1.8}
  .e{stroke:#1a1a19;stroke-width:1.5;fill:none} .ah{fill:#1a1a19}
  .ax{stroke:#8a8880;stroke-width:0.9;fill:none} .gd{stroke:#e2e1da;stroke-width:0.7;fill:none}
  .frame{fill:none;stroke:#c9c7bf;stroke-width:1}
  .sb1{stroke:#2f6fb5;stroke-width:2.2;fill:none} .sb2{stroke:#c8702f;stroke-width:2.2;fill:none}
  .db1{stroke:#2f6fb5;stroke-width:2.2;fill:none;stroke-dasharray:6 4}
  .db2{stroke:#c8702f;stroke-width:2.2;fill:none;stroke-dasharray:6 4}
  .p1{fill:#2f6fb5;stroke:#fbfaf6;stroke-width:1.2} .p2{fill:#c8702f;stroke:#fbfaf6;stroke-width:1.2}
  .band{fill:#c8702f;opacity:.10} .ref{stroke:#8a8880;stroke-width:1.1;stroke-dasharray:3 3;fill:none}
  .refd{stroke:#1a1a19;stroke-width:1.3;stroke-dasharray:6 4;fill:none}
  .blue{fill:#2f6fb5} .orange{fill:#c8702f}
  .cen{stroke:#1a1a19;stroke-width:1.6}
  .off{fill:none;stroke:#b3b1a8;stroke-width:1.3;stroke-dasharray:5 4}
  @media (prefers-color-scheme: dark){
    .hd,.v{fill:#eceae3} .sm,.tiny{fill:#b6b4ab} .bgcard{fill:#161615}
    .box{fill:#25241f;stroke:#85837b}
    .slow{fill:#3a2a1c;stroke:#e09a5f} .fast{fill:#1d2f45;stroke:#7fb2e8}
    .need{fill:#1d2f45;stroke:#7fb2e8} .free{fill:#3a2a1c;stroke:#e09a5f}
    .e{stroke:#eceae3} .ah{fill:#eceae3}
    .ax{stroke:#85837b} .gd{stroke:#33312e} .frame{stroke:#4a4844}
    .sb1,.db1{stroke:#7fb2e8} .sb2,.db2{stroke:#e09a5f}
    .p1{fill:#7fb2e8;stroke:#161615} .p2{fill:#e09a5f;stroke:#161615}
    .band{fill:#e09a5f;opacity:.14} .ref{stroke:#85837b} .refd{stroke:#eceae3}
    .blue{fill:#7fb2e8} .orange{fill:#e09a5f} .off{stroke:#5d5b55} .cen{stroke:#eceae3}
  }
</style>
<defs><marker id="ah" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,4 L0,8 Z" class="ah"/></marker></defs>
<rect width="890" height="316" rx="6" class="bgcard"/>
<text x="14" y="24" class="hd" text-anchor="start">SFDA worked example: ConfMix on a binary toy; the two models tie on the first pass</text>
<text x="224" y="50" class="v b" text-anchor="middle">Model X: four equally moderate samples</text>
<rect x="14" y="62" width="420" height="168" rx="6" class="frame"/>
<text x="18" y="126" class="tiny" text-anchor="start">before</text>
<text x="20" y="188" class="tiny" text-anchor="start">after</text>
<path d="M 26,112 H 422" class="ax"/>
<path d="M 26,196 H 422" class="ax"/>
<path d="M 224,90 V 222" class="ref"/>
<path d="M 179.0,112 L 189.7,196" class="ref"/>
<circle cx="179.0" cy="112" r="4" class="p1"/>
<circle cx="189.7" cy="196" r="4" class="p1"/>
<path d="M 269.0,112 L 258.3,196" class="ref"/>
<circle cx="269.0" cy="112" r="4" class="p2"/>
<circle cx="258.3" cy="196" r="4" class="p2"/>
<text x="179" y="83" class="tiny" text-anchor="middle">0.88</text>
<text x="189.72826298199058" y="214" class="tiny" text-anchor="middle">0.76</text>
<path d="M 179.0,106 L 189.7,190" class="ref"/>
<circle cx="179.0" cy="106" r="4" class="p1"/>
<circle cx="189.7" cy="190" r="4" class="p1"/>
<path d="M 269.0,106 L 258.3,190" class="ref"/>
<circle cx="269.0" cy="106" r="4" class="p2"/>
<circle cx="258.3" cy="190" r="4" class="p2"/>
<path d="M 179.0,100 L 189.7,184" class="ref"/>
<circle cx="179.0" cy="100" r="4" class="p1"/>
<circle cx="189.7" cy="184" r="4" class="p1"/>
<path d="M 269.0,100 L 258.3,184" class="ref"/>
<circle cx="269.0" cy="100" r="4" class="p2"/>
<circle cx="258.3" cy="184" r="4" class="p2"/>
<path d="M 179.0,94 L 189.7,178" class="ref"/>
<circle cx="179.0" cy="94" r="4" class="p1"/>
<circle cx="189.7" cy="178" r="4" class="p1"/>
<path d="M 269.0,94 L 258.3,178" class="ref"/>
<circle cx="269.0" cy="94" r="4" class="p2"/>
<circle cx="258.3" cy="178" r="4" class="p2"/>
<text x="224" y="248" class="hd" text-anchor="middle"><tspan>mean log p:  −0.127  →  −0.273</tspan></text>
<text x="666" y="50" class="v b" text-anchor="middle">Model Y: one very confident, one ambiguous</text>
<rect x="456" y="62" width="420" height="168" rx="6" class="frame"/>
<text x="460" y="126" class="tiny" text-anchor="start">before</text>
<text x="462" y="188" class="tiny" text-anchor="start">after</text>
<path d="M 468,112 H 864" class="ax"/>
<path d="M 468,196 H 864" class="ax"/>
<path d="M 666,90 V 222" class="ref"/>
<path d="M 508.5,112 L 508.5,196" class="ref"/>
<circle cx="508.5" cy="112" r="4" class="p1"/>
<circle cx="508.5" cy="196" r="4" class="p1"/>
<path d="M 823.5,112 L 823.5,196" class="ref"/>
<circle cx="823.5" cy="112" r="4" class="p2"/>
<circle cx="823.5" cy="196" r="4" class="p2"/>
<text x="508.5" y="101" class="tiny" text-anchor="middle">1.00</text>
<text x="508.5094757343375" y="214" class="tiny" text-anchor="middle">1.00</text>
<path d="M 621.0,112 L 626.9,196" class="ref"/>
<circle cx="621.0" cy="112" r="4" class="p1"/>
<circle cx="626.9" cy="196" r="4" class="p1"/>
<path d="M 711.0,112 L 705.1,196" class="ref"/>
<circle cx="711.0" cy="112" r="4" class="p2"/>
<circle cx="705.1" cy="196" r="4" class="p2"/>
<text x="621" y="95" class="tiny" text-anchor="middle">0.95</text>
<text x="626.8576777374183" y="214" class="tiny" text-anchor="middle">0.90</text>
<path d="M 654.8,112 L 679.6,196" class="ref"/>
<circle cx="654.8" cy="112" r="4" class="p1"/>
<circle cx="679.6" cy="196" r="4" class="p1"/>
<path d="M 677.2,112 L 652.4,196" class="ref"/>
<circle cx="677.2" cy="112" r="4" class="p2"/>
<circle cx="652.4" cy="196" r="4" class="p2"/>
<text x="654.75" y="101" class="tiny" text-anchor="middle">0.67</text>
<text x="679.6323115935729" y="214" class="tiny" text-anchor="middle">0.32</text>
<path d="M 621.0,106 L 626.9,190" class="ref"/>
<circle cx="621.0" cy="106" r="4" class="p1"/>
<circle cx="626.9" cy="190" r="4" class="p1"/>
<path d="M 711.0,106 L 705.1,190" class="ref"/>
<circle cx="711.0" cy="106" r="4" class="p2"/>
<circle cx="705.1" cy="190" r="4" class="p2"/>
<text x="666" y="248" class="hd" text-anchor="middle"><tspan>mean log p:  −0.127  →  −0.339</tspan></text>
<text x="14" y="282" class="sm" text-anchor="start">Blue: class A, orange: class B (its mirror image); numbers: the confidence p of the class-A samples before and after the move.</text>
<text x="14" y="300" class="sm" text-anchor="start">Both models score −0.127 on the first pass; Y's ambiguous sample (0.67) is dragged across the dashed boundary (0.32).</text>
</svg>
