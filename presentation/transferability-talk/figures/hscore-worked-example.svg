<svg viewBox="0 0 890 356" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The H-score worked example</title>
<desc>Two four-point datasets with the same centroid gap of 2. In A the classes split along x2, where the total spread is small, giving H of 0.80. In B they split along x1, where the spread is large, giving 0.10.</desc>
<style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
  .hd{font-size:14.5px;font-weight:500;fill:#1a1a19} .v{font-size:13px;fill:#1a1a19}
  .b{font-weight:500} .sm{font-size:12px;fill:#57564f} .tiny{font-size:11px;fill:#57564f}
  .it{font-style:italic} .sb{font-size:72%}
  .bgcard{fill:#fbfaf6}
  .box{fill:#f1efe7;stroke:#8a8880;stroke-width:1.3}
  .slow{fill:#f7e7d8;stroke:#c8702f;stroke-width:1.5} .fast{fill:#dfeaf6;stroke:#2f6fb5;stroke-width:1.5}
  .need{fill:#dfeaf6;stroke:#2f6fb5;stroke-width:1.8} .free{fill:#f7e7d8;stroke:#c8702f;stroke-width:1.8}
  .e{stroke:#1a1a19;stroke-width:1.5;fill:none} .ah{fill:#1a1a19}
  .ax{stroke:#8a8880;stroke-width:0.9;fill:none} .gd{stroke:#e2e1da;stroke-width:0.7;fill:none}
  .frame{fill:none;stroke:#c9c7bf;stroke-width:1}
  .sb1{stroke:#2f6fb5;stroke-width:2.2;fill:none} .sb2{stroke:#c8702f;stroke-width:2.2;fill:none}
  .db1{stroke:#2f6fb5;stroke-width:2.2;fill:none;stroke-dasharray:6 4}
  .db2{stroke:#c8702f;stroke-width:2.2;fill:none;stroke-dasharray:6 4}
  .p1{fill:#2f6fb5;stroke:#fbfaf6;stroke-width:1.2} .p2{fill:#c8702f;stroke:#fbfaf6;stroke-width:1.2}
  .band{fill:#c8702f;opacity:.10} .ref{stroke:#8a8880;stroke-width:1.1;stroke-dasharray:3 3;fill:none}
  .refd{stroke:#1a1a19;stroke-width:1.3;stroke-dasharray:6 4;fill:none}
  .blue{fill:#2f6fb5} .orange{fill:#c8702f}
  .cen{stroke:#1a1a19;stroke-width:1.6}
  .off{fill:none;stroke:#b3b1a8;stroke-width:1.3;stroke-dasharray:5 4}
  @media (prefers-color-scheme: dark){
    .hd,.v{fill:#eceae3} .sm,.tiny{fill:#b6b4ab} .bgcard{fill:#161615}
    .box{fill:#25241f;stroke:#85837b}
    .slow{fill:#3a2a1c;stroke:#e09a5f} .fast{fill:#1d2f45;stroke:#7fb2e8}
    .need{fill:#1d2f45;stroke:#7fb2e8} .free{fill:#3a2a1c;stroke:#e09a5f}
    .e{stroke:#eceae3} .ah{fill:#eceae3}
    .ax{stroke:#85837b} .gd{stroke:#33312e} .frame{stroke:#4a4844}
    .sb1,.db1{stroke:#7fb2e8} .sb2,.db2{stroke:#e09a5f}
    .p1{fill:#7fb2e8;stroke:#161615} .p2{fill:#e09a5f;stroke:#161615}
    .band{fill:#e09a5f;opacity:.14} .ref{stroke:#85837b} .refd{stroke:#eceae3}
    .blue{fill:#7fb2e8} .orange{fill:#e09a5f} .off{stroke:#5d5b55} .cen{stroke:#eceae3}
  }
</style>
<defs><marker id="ah" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,4 L0,8 Z" class="ah"/></marker></defs>
<rect width="890" height="356" rx="6" class="bgcard"/>
<text x="14" y="24" class="hd" text-anchor="start">H-score worked example: same centroid gap, different spread along it</text>
<text x="225" y="50" class="v b" text-anchor="middle">A: split along the quiet x₂</text>
<rect x="20" y="62" width="410" height="176" rx="6" class="frame"/>
<path d="M 35,150 H 415" class="ax"/><path d="M 225,68 V 232" class="ax"/>
<text x="417" y="164" class="tiny" text-anchor="end"><tspan class="it">x</tspan><tspan class="it sb" dy="4">1</tspan></text>
<text x="233" y="80" class="tiny" text-anchor="start"><tspan class="it">x</tspan><tspan class="it sb" dy="4">2</tspan></text>
<ellipse cx="225" cy="150" rx="102.0" ry="51.4" class="refd"/>
<path d="M 123.0,219.0 L 225.0,196.0" class="ref"/>
<path d="M 327.0,173.0 L 225.0,196.0" class="ref"/>
<path d="M 123.0,81.0 L 225.0,104.0" class="ref"/>
<path d="M 327.0,127.0 L 225.0,104.0" class="ref"/>
<circle cx="123.0" cy="219.0" r="4.5" class="p1"/>
<text x="115" y="234.0" class="tiny" text-anchor="end">(-3, -1.5)</text>
<circle cx="327.0" cy="173.0" r="4.5" class="p1"/>
<text x="335" y="188.0" class="tiny" text-anchor="start">(3, -0.5)</text>
<circle cx="123.0" cy="81.0" r="4.5" class="p2"/>
<text x="115" y="73.0" class="tiny" text-anchor="end">(-3, 1.5)</text>
<circle cx="327.0" cy="127.0" r="4.5" class="p2"/>
<text x="335" y="119.0" class="tiny" text-anchor="start">(3, 0.5)</text>
<circle cx="225.0" cy="196.0" r="6.5" class="p1 cen"/>
<circle cx="225.0" cy="104.0" r="6.5" class="p2 cen"/>
<path d="M 225.0,196.0 L 225.0,104.0" class="e"/>
<text x="237" y="144" class="sm" text-anchor="start">gap = 2</text>
<text x="225" y="262" class="sm" text-anchor="middle"><tspan class="it">Σ</tspan><tspan class="it sb" dy="4">B</tspan><tspan dy="-4"> = diag(0, 1)     ·     Σ = diag(9, 1.25)</tspan></text>
<text x="225" y="288" class="hd" text-anchor="middle">H = 0/9 + 1/1.25 = 0.80</text>
<text x="665" y="50" class="v b" text-anchor="middle">B: split along the noisy x₁</text>
<rect x="460" y="62" width="410" height="176" rx="6" class="frame"/>
<path d="M 475,150 H 855" class="ax"/><path d="M 665,68 V 232" class="ax"/>
<text x="857" y="164" class="tiny" text-anchor="end"><tspan class="it">x</tspan><tspan class="it sb" dy="4">1</tspan></text>
<text x="673" y="80" class="tiny" text-anchor="start"><tspan class="it">x</tspan><tspan class="it sb" dy="4">2</tspan></text>
<ellipse cx="665" cy="150" rx="107.5" ry="23.0" class="refd"/>
<path d="M 529.0,173.0 L 631.0,150.0" class="ref"/>
<path d="M 733.0,127.0 L 631.0,150.0" class="ref"/>
<path d="M 597.0,127.0 L 699.0,150.0" class="ref"/>
<path d="M 801.0,173.0 L 699.0,150.0" class="ref"/>
<circle cx="529.0" cy="173.0" r="4.5" class="p1"/>
<text x="521" y="188.0" class="tiny" text-anchor="end">(-4, -0.5)</text>
<circle cx="733.0" cy="127.0" r="4.5" class="p1"/>
<text x="741" y="119.0" class="tiny" text-anchor="start">(2, 0.5)</text>
<circle cx="597.0" cy="127.0" r="4.5" class="p2"/>
<text x="589" y="119.0" class="tiny" text-anchor="end">(-2, 0.5)</text>
<circle cx="801.0" cy="173.0" r="4.5" class="p2"/>
<text x="809" y="188.0" class="tiny" text-anchor="start">(4, -0.5)</text>
<circle cx="631.0" cy="150.0" r="6.5" class="p1 cen"/>
<circle cx="699.0" cy="150.0" r="6.5" class="p2 cen"/>
<path d="M 631.0,150.0 L 699.0,150.0" class="e"/>
<text x="665" y="188" class="sm" text-anchor="middle">gap = 2</text>
<text x="665" y="262" class="sm" text-anchor="middle"><tspan class="it">Σ</tspan><tspan class="it sb" dy="4">B</tspan><tspan dy="-4"> = diag(1, 0)     ·     Σ = diag(10, 0.25)</tspan></text>
<text x="665" y="288" class="hd" text-anchor="middle">H = 1/10 + 0/0.25 = 0.10</text>
<text x="14" y="322" class="sm" text-anchor="start">Large dots: class centroids; thin lines: each point to its centroid (the within-class scatter); dashed ellipse: one standard deviation of the</text>
<text x="14" y="340" class="sm" text-anchor="start">total spread Σ. The vertical scale is stretched so the small spread along x₂ is visible.</text>
</svg>
