<rect x="70" y="60" width="270" height="210" class="frame"/>
<path d="M 100.0,240.6 L 130.0,221.7 L 160.0,196.5 L 220.0,162.9 L 310.0,114.6" class="sb1"/>
<circle cx="100.0" cy="240.6" r="4.2" class="p1"/>
<text x="100.0" y="230.6" class="tiny" text-anchor="middle">0.14</text>
<circle cx="130.0" cy="221.7" r="4.2" class="p1"/>
<text x="130.0" y="211.7" class="tiny" text-anchor="middle">0.23</text>
<circle cx="160.0" cy="196.5" r="4.2" class="p1"/>
<text x="160.0" y="186.5" class="tiny" text-anchor="middle">0.35</text>
<circle cx="220.0" cy="162.9" r="4.2" class="p1"/>
<text x="220.0" y="152.89999999999998" class="tiny" text-anchor="middle">0.51</text>
<circle cx="310.0" cy="114.6" r="4.2" class="p1"/>
<text x="310.0" y="104.6" class="tiny" text-anchor="middle">0.74</text>
<text x="205.0" y="308" class="sm" text-anchor="middle">number of models ranked, n</text>
<text x="430" y="46" class="v b" text-anchor="start">Smallest |τ| that clears p &lt; 0.05</text>
<path d="M 430,270.0 H 700" class="gd"/><text x="423" y="274.0" class="tiny" text-anchor="end">0</text>
<path d="M 430,200.0 H 700" class="gd"/><text x="423" y="204.0" class="tiny" text-anchor="end">0.2</text>
<path d="M 430,130.0 H 700" class="gd"/><text x="423" y="133.99999999999997" class="tiny" text-anchor="end">0.4</text>
<path d="M 430,60.0 H 700" class="gd"/><text x="423" y="64.0" class="tiny" text-anchor="end">0.6</text>
<text x="475.0" y="287" class="tiny" text-anchor="middle">10</text>
<text x="520.0" y="287" class="tiny" text-anchor="middle">20</text>
<text x="655.0" y="287" class="tiny" text-anchor="middle">50</text>
<rect x="430" y="60" width="270" height="210" class="frame"/>
<path d="M 475.0,106.5 L 520.0,159.4 L 655.0,202.8" class="sb2"/>
<circle cx="475.0" cy="106.5" r="4.2" class="p2"/>
<text x="483.0" y="97.54999999999998" class="tiny" text-anchor="start">0.467</text>
<circle cx="520.0" cy="159.4" r="4.2" class="p2"/>
<text x="528.0" y="150.39999999999998" class="tiny" text-anchor="start">0.316</text>
<circle cx="655.0" cy="202.8" r="4.2" class="p2"/>
<text x="663.0" y="193.8" class="tiny" text-anchor="start">0.192</text>
<path d="M 430,175.5 H 700" class="refd"/>
<text x="438" y="192.5" class="sm" text-anchor="start">a reported τ = 0.270</text>
<text x="565.0" y="308" class="sm" text-anchor="middle">number of models ranked, n</text>
<text x="14" y="330" class="sm" text-anchor="start">At n = 10 the null standard deviation of τ is 0.248; the 42 cells of Table 2 were each computed from ten models.</text>
