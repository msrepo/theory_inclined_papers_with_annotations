<svg viewBox="0 0 890 316" xmlns="http://www.w3.org/2000/svg" role="img">
<title>From NCE to PAS</title>
<desc>Six circles in a row: NCE, LEEP, H-score, LogME, SFDA and PAS, joined by arrows labelled with what changes at each step. NCE reads two label lists. LEEP reads the source softmax. H-score, LogME and SFDA read frozen features, with target labels. PAS reads features and labelled source data but needs no target labels.</desc>
<style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
  .hd{font-size:14.5px;font-weight:500;fill:#1a1a19} .v{font-size:13px;fill:#1a1a19}
  .b{font-weight:500} .sm{font-size:12px;fill:#57564f} .tiny{font-size:11px;fill:#57564f}
  .it{font-style:italic} .sb{font-size:72%}
  .bgcard{fill:#fbfaf6}
  .box{fill:#f1efe7;stroke:#8a8880;stroke-width:1.3}
  .slow{fill:#f7e7d8;stroke:#c8702f;stroke-width:1.5} .fast{fill:#dfeaf6;stroke:#2f6fb5;stroke-width:1.5}
  .need{fill:#dfeaf6;stroke:#2f6fb5;stroke-width:1.8} .free{fill:#f7e7d8;stroke:#c8702f;stroke-width:1.8}
  .e{stroke:#1a1a19;stroke-width:1.5;fill:none} .ah{fill:#1a1a19}
  .ax{stroke:#8a8880;stroke-width:0.9;fill:none} .gd{stroke:#e2e1da;stroke-width:0.7;fill:none}
  .frame{fill:none;stroke:#c9c7bf;stroke-width:1}
  .sb1{stroke:#2f6fb5;stroke-width:2.2;fill:none} .sb2{stroke:#c8702f;stroke-width:2.2;fill:none}
  .db1{stroke:#2f6fb5;stroke-width:2.2;fill:none;stroke-dasharray:6 4}
  .db2{stroke:#c8702f;stroke-width:2.2;fill:none;stroke-dasharray:6 4}
  .p1{fill:#2f6fb5;stroke:#fbfaf6;stroke-width:1.2} .p2{fill:#c8702f;stroke:#fbfaf6;stroke-width:1.2}
  .band{fill:#c8702f;opacity:.10} .ref{stroke:#8a8880;stroke-width:1.1;stroke-dasharray:3 3;fill:none}
  .refd{stroke:#1a1a19;stroke-width:1.3;stroke-dasharray:6 4;fill:none}
  .blue{fill:#2f6fb5} .orange{fill:#c8702f}
  @media (prefers-color-scheme: dark){
    .hd,.v{fill:#eceae3} .sm,.tiny{fill:#b6b4ab} .bgcard{fill:#161615}
    .box{fill:#25241f;stroke:#85837b}
    .slow{fill:#3a2a1c;stroke:#e09a5f} .fast{fill:#1d2f45;stroke:#7fb2e8}
    .need{fill:#1d2f45;stroke:#7fb2e8} .free{fill:#3a2a1c;stroke:#e09a5f}
    .e{stroke:#eceae3} .ah{fill:#eceae3}
    .ax{stroke:#85837b} .gd{stroke:#33312e} .frame{stroke:#4a4844}
    .sb1,.db1{stroke:#7fb2e8} .sb2,.db2{stroke:#e09a5f}
    .p1{fill:#7fb2e8;stroke:#161615} .p2{fill:#e09a5f;stroke:#161615}
    .band{fill:#e09a5f;opacity:.14} .ref{stroke:#85837b} .refd{stroke:#eceae3}
    .blue{fill:#7fb2e8} .orange{fill:#e09a5f}
  }
</style>
<defs><marker id="ah" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,4 L0,8 Z" class="ah"/></marker></defs>
<rect width="890" height="316" rx="6" class="bgcard"/>
<text x="14" y="24" class="hd" text-anchor="start">From the tractable case to the label-free one: what changes at each step</text>
<circle cx="78" cy="138" r="33" class="need"/>
<text x="78" y="143" class="v b" text-anchor="middle">NCE</text>
<text x="78" y="191" class="sm" text-anchor="middle">Tran 2019</text>
<text x="78" y="215" class="tiny" text-anchor="middle">two label lists</text>
<text x="78" y="230" class="tiny" text-anchor="middle">no model at all</text>
<circle cx="226" cy="138" r="33" class="need"/>
<text x="226" y="143" class="v b" text-anchor="middle">LEEP</text>
<text x="226" y="191" class="sm" text-anchor="middle">Nguyen 2020</text>
<text x="226" y="215" class="tiny" text-anchor="middle">source softmax</text>
<text x="226" y="230" class="tiny" text-anchor="middle">+ target labels</text>
<path d="M 114,138 H 188" class="e" marker-end="url(#ah)"/>
<text x="152.0" y="70" class="tiny" text-anchor="middle">swap true source labels</text>
<text x="152.0" y="85" class="tiny" text-anchor="middle">for the model's</text>
<text x="152.0" y="100" class="tiny" text-anchor="middle">soft predictions</text>
<circle cx="374" cy="138" r="33" class="need"/>
<text x="374" y="143" class="v b" text-anchor="middle">H-score</text>
<text x="374" y="191" class="sm" text-anchor="middle">Bao 2019</text>
<text x="374" y="215" class="tiny" text-anchor="middle">features</text>
<text x="374" y="230" class="tiny" text-anchor="middle">+ target labels</text>
<path d="M 262,138 H 336" class="e" marker-end="url(#ah)"/>
<text x="300.0" y="70" class="tiny" text-anchor="middle">drop the source head;</text>
<text x="300.0" y="85" class="tiny" text-anchor="middle">optimise the head</text>
<text x="300.0" y="100" class="tiny" text-anchor="middle">away in closed form</text>
<circle cx="522" cy="138" r="33" class="need"/>
<text x="522" y="143" class="v b" text-anchor="middle">LogME</text>
<text x="522" y="191" class="sm" text-anchor="middle">You 2021</text>
<text x="522" y="215" class="tiny" text-anchor="middle">features</text>
<text x="522" y="230" class="tiny" text-anchor="middle">+ target labels</text>
<path d="M 410,138 H 484" class="e" marker-end="url(#ah)"/>
<text x="448.0" y="70" class="tiny" text-anchor="middle">integrate the head out</text>
<text x="448.0" y="85" class="tiny" text-anchor="middle">(evidence); add</text>
<text x="448.0" y="100" class="tiny" text-anchor="middle">regression</text>
<circle cx="670" cy="138" r="33" class="need"/>
<text x="670" y="143" class="v b" text-anchor="middle">SFDA</text>
<text x="670" y="191" class="sm" text-anchor="middle">Shao 2022</text>
<text x="670" y="215" class="tiny" text-anchor="middle">features</text>
<text x="670" y="230" class="tiny" text-anchor="middle">+ target labels</text>
<path d="M 558,138 H 632" class="e" marker-end="url(#ah)"/>
<text x="596.0" y="70" class="tiny" text-anchor="middle">imitate fine-tuning:</text>
<text x="596.0" y="85" class="tiny" text-anchor="middle">make the task</text>
<text x="596.0" y="100" class="tiny" text-anchor="middle">harder first</text>
<circle cx="818" cy="138" r="33" class="free"/>
<text x="818" y="143" class="v b" text-anchor="middle">PAS</text>
<text x="818" y="191" class="sm" text-anchor="middle">Diniz 2026</text>
<text x="818" y="215" class="tiny" text-anchor="middle">features + source data</text>
<text x="818" y="230" class="tiny" text-anchor="middle">no target labels</text>
<path d="M 706,138 H 780" class="e" marker-end="url(#ah)"/>
<text x="744.0" y="70" class="tiny" text-anchor="middle">drop the target labels;</text>
<text x="744.0" y="85" class="tiny" text-anchor="middle">use the source</text>
<text x="744.0" y="100" class="tiny" text-anchor="middle">partition instead</text>
<circle cx="470" cy="270" r="8" class="need"/><text x="484" y="274" class="sm" text-anchor="start">needs target labels</text><circle cx="640" cy="270" r="8" class="free"/><text x="654" y="274" class="sm" text-anchor="start">needs no target labels</text>
<text x="14" y="300" class="sm" text-anchor="start">A conceptual order, not a chronological one: NCE and H-score are both 2019, LEEP 2020, LogME 2021, SFDA 2022, PAS 2026.</text>
</svg>
