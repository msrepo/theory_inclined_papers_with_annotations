<svg viewBox="0 0 760 296" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The transferability estimation problem</title>
<desc>A pool of M pre-trained models and a target dataset feed two paths. The expensive path fine-tunes every model to get ground-truth performance T1 to TM. The cheap path scores each model in one forward pass to get estimates S1 to SM. The two rankings are compared with a weighted Kendall tau and the regret of the top pick.</desc>
<style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
  .hd{font-size:14.5px;font-weight:500;fill:#1a1a19} .v{font-size:13px;fill:#1a1a19}
  .b{font-weight:500} .sm{font-size:12px;fill:#57564f} .tiny{font-size:11px;fill:#57564f}
  .it{font-style:italic} .sb{font-size:72%}
  .bgcard{fill:#fbfaf6}
  .box{fill:#f1efe7;stroke:#8a8880;stroke-width:1.3}
  .slow{fill:#f7e7d8;stroke:#c8702f;stroke-width:1.5} .fast{fill:#dfeaf6;stroke:#2f6fb5;stroke-width:1.5}
  .need{fill:#dfeaf6;stroke:#2f6fb5;stroke-width:1.8} .free{fill:#f7e7d8;stroke:#c8702f;stroke-width:1.8}
  .e{stroke:#1a1a19;stroke-width:1.5;fill:none} .ah{fill:#1a1a19}
  .ax{stroke:#8a8880;stroke-width:0.9;fill:none} .gd{stroke:#e2e1da;stroke-width:0.7;fill:none}
  .frame{fill:none;stroke:#c9c7bf;stroke-width:1}
  .sb1{stroke:#2f6fb5;stroke-width:2.2;fill:none} .sb2{stroke:#c8702f;stroke-width:2.2;fill:none}
  .db1{stroke:#2f6fb5;stroke-width:2.2;fill:none;stroke-dasharray:6 4}
  .db2{stroke:#c8702f;stroke-width:2.2;fill:none;stroke-dasharray:6 4}
  .p1{fill:#2f6fb5;stroke:#fbfaf6;stroke-width:1.2} .p2{fill:#c8702f;stroke:#fbfaf6;stroke-width:1.2}
  .band{fill:#c8702f;opacity:.10} .ref{stroke:#8a8880;stroke-width:1.1;stroke-dasharray:3 3;fill:none}
  .refd{stroke:#1a1a19;stroke-width:1.3;stroke-dasharray:6 4;fill:none}
  .blue{fill:#2f6fb5} .orange{fill:#c8702f}
  @media (prefers-color-scheme: dark){
    .hd,.v{fill:#eceae3} .sm,.tiny{fill:#b6b4ab} .bgcard{fill:#161615}
    .box{fill:#25241f;stroke:#85837b}
    .slow{fill:#3a2a1c;stroke:#e09a5f} .fast{fill:#1d2f45;stroke:#7fb2e8}
    .need{fill:#1d2f45;stroke:#7fb2e8} .free{fill:#3a2a1c;stroke:#e09a5f}
    .e{stroke:#eceae3} .ah{fill:#eceae3}
    .ax{stroke:#85837b} .gd{stroke:#33312e} .frame{stroke:#4a4844}
    .sb1,.db1{stroke:#7fb2e8} .sb2,.db2{stroke:#e09a5f}
    .p1{fill:#7fb2e8;stroke:#161615} .p2{fill:#e09a5f;stroke:#161615}
    .band{fill:#e09a5f;opacity:.14} .ref{stroke:#85837b} .refd{stroke:#eceae3}
    .blue{fill:#7fb2e8} .orange{fill:#e09a5f}
  }
</style>
<defs><marker id="ah" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,4 L0,8 Z" class="ah"/></marker></defs>
<rect width="760" height="296" rx="6" class="bgcard"/>
<text x="14" y="24" class="hd" text-anchor="start">The problem in one picture: rank the pool without fine-tuning every model</text>
<rect x="32" y="40" width="170" height="74" rx="8" class="box"/>
<rect x="26" y="46" width="170" height="74" rx="8" class="box"/>
<rect x="20" y="58" width="170" height="74" rx="8" class="box"/>
<text x="105.0" y="82.5" class="v b" text-anchor="middle">M pre-trained models</text>
<text x="105.0" y="99.5" class="sm" text-anchor="middle"><tspan class="it">θ</tspan><tspan class="it sb" dy="4">m</tspan><tspan dy="-4"> = (</tspan><tspan class="it">φ</tspan><tspan class="it sb" dy="4">m</tspan><tspan dy="-4">, </tspan><tspan class="it">h</tspan><tspan class="it sb" dy="4">m</tspan><tspan dy="-4">)</tspan></text>
<text x="105.0" y="116.5" class="sm" text-anchor="middle">extractor + optional head</text>
<rect x="20" y="168" width="170" height="74" rx="8" class="box"/>
<text x="105.0" y="192.5" class="v b" text-anchor="middle">Target data</text>
<text x="105.0" y="209.5" class="sm" text-anchor="middle"><tspan>𝒟</tspan><tspan class="it sb" dy="4">T</tspan><tspan dy="-4">, n examples</tspan></text>
<text x="105.0" y="226.5" class="sm" text-anchor="middle">labelled or not</text>
<path d="M 204,62 V 238" class="e"/>
<path d="M 204,150 H 236 V 92 H 268" class="e" marker-end="url(#ah)"/>
<path d="M 204,150 H 236 V 208 H 268" class="e" marker-end="url(#ah)"/>
<rect x="270" y="52" width="214" height="80" rx="8" class="slow"/>
<text x="377.0" y="79.5" class="v b" text-anchor="middle">Fine-tune each model</text>
<text x="377.0" y="96.5" class="sm" text-anchor="middle">M training runs,</text>
<text x="377.0" y="113.5" class="sm" text-anchor="middle">hours to days apiece</text>
<rect x="270" y="168" width="214" height="80" rx="8" class="fast"/>
<text x="377.0" y="195.5" class="v b" text-anchor="middle"><tspan>Score </tspan><tspan class="it">S</tspan><tspan class="it sb" dy="4">m</tspan><tspan dy="-4"> = S(</tspan><tspan class="it">θ</tspan><tspan class="it sb" dy="4">m</tspan><tspan dy="-4">, </tspan><tspan>𝒟</tspan><tspan class="it sb" dy="4">T</tspan><tspan dy="-4">)</tspan></text>
<text x="377.0" y="212.5" class="sm" text-anchor="middle">one forward pass,</text>
<text x="377.0" y="229.5" class="sm" text-anchor="middle">no gradient descent</text>
<path d="M 484,92 H 540" class="e" marker-end="url(#ah)"/>
<path d="M 484,208 H 540" class="e" marker-end="url(#ah)"/>
<rect x="542" y="52" width="102" height="80" rx="8" class="slow"/>
<text x="593.0" y="88.0" class="v b" text-anchor="middle">ground truth</text>
<text x="593.0" y="105.0" class="sm" text-anchor="middle"><tspan class="it">T</tspan><tspan class="it sb" dy="4">1</tspan><tspan dy="-4"> … </tspan><tspan class="it">T</tspan><tspan class="it sb" dy="4">M</tspan></text>
<rect x="542" y="168" width="102" height="80" rx="8" class="fast"/>
<text x="593.0" y="204.0" class="v b" text-anchor="middle">estimate</text>
<text x="593.0" y="221.0" class="sm" text-anchor="middle"><tspan class="it">S</tspan><tspan class="it sb" dy="4">1</tspan><tspan dy="-4"> … </tspan><tspan class="it">S</tspan><tspan class="it sb" dy="4">M</tspan></text>
<path d="M 644,92 H 660 V 128 H 674" class="e" marker-end="url(#ah)"/>
<path d="M 644,208 H 660 V 172 H 674" class="e" marker-end="url(#ah)"/>
<rect x="676" y="105" width="76" height="90" rx="8" class="box"/>
<text x="714.0" y="145.5" class="v b" text-anchor="middle">compare</text>
<text x="714.0" y="163.5" class="sm" text-anchor="middle"><tspan class="it">τ</tspan><tspan class="it sb" dy="4">w</tspan><tspan dy="-4">, regret</tspan></text>
<text x="14" y="278" class="sm" text-anchor="start">Success means the cheap ranking (blue) reproduces the expensive one (orange).</text>
</svg>
