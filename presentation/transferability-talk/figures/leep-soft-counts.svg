<text x="157.0" y="341" class="tiny" text-anchor="middle">z2</text>
<text x="178.0" y="341" class="tiny" text-anchor="middle">z3</text>
<text x="393" y="56" class="v b" text-anchor="middle">NCE: hard count</text>
<text x="393" y="72" class="tiny" text-anchor="middle">whole count to the top class</text>
<text x="693" y="56" class="v b" text-anchor="middle">LEEP: soft count</text>
<text x="693" y="72" class="tiny" text-anchor="middle">count split by the softmax</text>
<text x="347.0" y="90" class="sm" text-anchor="middle"><tspan class="it">y</tspan><tspan class="it sb" dy="4">1</tspan></text>
