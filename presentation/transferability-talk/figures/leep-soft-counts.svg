<text x="536" y="150" class="tiny" text-anchor="middle">soften</text>
<text x="393" y="262" class="tiny" text-anchor="middle">each column sums to the number of examples with that y</text>
<text x="693" y="262" class="tiny" text-anchor="middle">same totals; counts are now fractional</text>
<text x="14" y="374" class="sm" text-anchor="start">Normalising each row of the soft table gives P(y | z): the fixed linear map from the source softmax to a target distribution.</text>
