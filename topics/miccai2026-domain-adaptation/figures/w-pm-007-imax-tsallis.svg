<svg viewBox="0 0 700 362" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Tsallis entropy weakens the pull toward a balanced marginal</title>
<desc>Two panels. Left: the gradient of the marginal-entropy term with respect to one class's mass, measured relative to a class at the uniform mass 1/K, plotted against that mass on a log axis for K = 8. The Shannon curve (alpha = 1, orange) rises without bound as the mass goes to zero, so rare classes are pushed up very hard; the alpha = 1.5 curve (grey) rises less, and the Tsallis alpha = 2 curve (blue) is a nearly flat line bounded by 2/K. Right: for a toy 8-class marginal with 50 to 1 imbalance (dashed), the marginal that minimises cross-entropy to the true marginal minus the entropy term, on a log axis. With Shannon entropy the optimum is flattened, tail-to-head ratio 0.23; with alpha = 2 it stays close to the truth, ratio 0.043 against the true 0.020.</desc>
