<text class="lab" x="448.0" y="233.0">Tsallis α = 2: 0.043</text>
<text class="lab" x="538.0" y="277.0" text-anchor="middle">class k, sorted head to tail</text>
<text class="big" x="414.0" y="58.0">Optimum π* of CE(π_true, π) − Hα(π)</text>
<text class="hd" x="26.0" y="24.0">Tsallis α &gt; 1 caps the push on rare classes, so the learnt marginal keeps its long tail</text>
<text class="lab" x="26.0" y="308.0">Shannon H(Y) = log K − KL(π ‖ u) pushes a class of mass π with force log(1/(Kπ)), unbounded as π → 0. Hα with α = 2 pushes</text>
<text class="lab" x="26.0" y="324.0">with 2(1/K − π), never more than 2/K. Toy: K = 8 classes, imbalance 50:1 (dashed), equal weight on both terms.</text>
<text class="lab" x="26.0" y="340.0">Hα is still maximised at the uniform marginal, so the pull toward balance is weakened, not removed.</text>
</svg>
