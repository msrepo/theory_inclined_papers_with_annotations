<svg viewBox="0 0 700 408" xmlns="http://www.w3.org/2000/svg" role="img">
<title>PromptGate gates by nearest text prototype on the sphere</title>
<desc>Two circular panels, one per client, show normalised image embeddings as points on a disc, with arrows for three text prototypes: two in-distribution classes and one OOD prompt. Because the pseudo-label is the argmax of cosine similarity, each prototype owns the angular sector nearest to it; the OOD sector is shaded orange, and images there are removed before active-learning acquisition. Client A has artefacts clustered to the left and client B has them at the bottom right. The client-specific private prompt tokens rotate the OOD prototype toward each site's artefacts, so the solid personalised boundaries enclose them. Dashed lines show where the boundaries would sit with only the federated shared prompts; with those, 4 and 4 artefacts would leak into the ID pool instead of 2 and 0. Leaked artefacts are ringed.</desc>
<style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
  .lab{font-size:11px;fill:#57564f} .hd{font-size:13px;font-weight:500;fill:#1a1a19}
  .sub{font-size:11.5px;fill:#57564f} .big{font-size:12.5px;font-weight:500;fill:#1a1a19}
  .t1{fill:#2f6fb5} .t2{fill:#c8702f}
  .c1{fill:#2f6fb5;stroke:none;opacity:0.5} .c2{fill:#c8702f;stroke:none;opacity:0.5}
  .f1{fill:#2f6fb5;stroke:none;opacity:0.1} .f2{fill:#c8702f;stroke:none;opacity:0.1} .fg{fill:#8a8880;stroke:none;opacity:0.35}
  .m1{fill:#2f6fb5;stroke:#fbfaf6;stroke-width:1.4} .m2{fill:#c8702f;stroke:#fbfaf6;stroke-width:1.4}
  .mg{fill:#c3c2b7;stroke:#fbfaf6;stroke-width:1.2}
  .arr{stroke:#8a8880;stroke-width:1;fill:none;opacity:0.75}
  .box{fill:none;stroke:#e2e1da;stroke-width:1}
  .ax{stroke:#c3c2b7;stroke-width:0.8;fill:none}
  .gd{stroke:#e2e1da;stroke-width:0.6;fill:none;stroke-dasharray:3 3}
  .l1{fill:none;stroke:#2f6fb5;stroke-width:2}
  .l2{fill:none;stroke:#c8702f;stroke-width:2}
  .lg{fill:none;stroke:#8a8880;stroke-width:1.5}
  .d1{fill:none;stroke:#2f6fb5;stroke-width:1.3;stroke-dasharray:4 3}
  .d2{fill:none;stroke:#c8702f;stroke-width:1.3;stroke-dasharray:4 3}
  .op{stroke:#1a1a19;stroke-width:1.2;stroke-dasharray:4 3;fill:none}
  .vec{stroke:#1a1a19;stroke-width:1.6;fill:none}
  .pt{fill:#1a1a19;stroke:#fbfaf6;stroke-width:1.2}
  @media (prefers-color-scheme: dark){
    .lab{fill:#b6b4ab} .hd{fill:#eceae3} .sub{fill:#b6b4ab} .big{fill:#eceae3}
    .t1{fill:#7fb2e8} .t2{fill:#e09a5f}
    .box{stroke:#33312e} .ax{stroke:#4a4844} .gd{stroke:#33312e}
    .c1{fill:#7fb2e8} .c2{fill:#e09a5f} .f1{fill:#7fb2e8} .f2{fill:#e09a5f} .fg{fill:#85837b}
    .m1{fill:#7fb2e8;stroke:#1c1b19} .m2{fill:#e09a5f;stroke:#1c1b19} .mg{fill:#6a6862;stroke:#1c1b19}
    .arr{stroke:#85837b} .l1{stroke:#7fb2e8} .l2{stroke:#e09a5f} .lg{stroke:#85837b}
    .d1{stroke:#7fb2e8} .d2{stroke:#e09a5f} .op{stroke:#eceae3}
    .vec{stroke:#eceae3} .pt{fill:#eceae3;stroke:#1c1b19}
  }
</style>
