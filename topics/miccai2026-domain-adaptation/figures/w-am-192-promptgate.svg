<text class="hd" x="26.0" y="24.0">PromptGate filters by angle: an image is dropped if its nearest text prototype is the OOD prompt</text>
<text class="sub" x="26.0" y="44.0">ŷ(x) = argmax over c of cos(z(x), t_c),  t_c = E_text([p_c shared ; p_c private], class name c);  orange sector = gated out</text>
<text class="lab" x="26.0" y="378.0">Only images outside the orange sector enter the active-learning pool. The private context tokens rotate t_OOD toward each site's own</text>
<text class="lab" x="26.0" y="394.0">artefacts without sharing images; leaked OOD images that get queried are the only supervision the OOD prompt receives.</text>
