<text class="lab" x="265.1" y="315.5" text-anchor="end">true OOD, s = 0.56 → 0.37</text>
<text class="lab" x="265.1" y="302.0" text-anchor="end">S_ID = .62, S_OOD = .91, H_hard = −1</text>
<text class="lab" x="431.5" y="340.0">true ID, s = 0.43 → 0.63</text>
<text class="lab" x="431.5" y="354.0">S_ID = .88, S_OOD = .55, H_hard = +1</text>
<text class="sub" x="26.0" y="280.0">Later samples are shifted by their nearest cached neighbours:  S_final = s + β(δ + H_hard),  β = 0.15</text>
<text class="lab" x="26.0" y="384.0">Only scores inside the band cost a physician query (budget B = ⌊ρT⌋); the labelled features join the ID / OOD caches.</text>
<text class="lab" x="26.0" y="400.0">No weights change: calibration is a 1-NN cosine vote from each cache added to the detector score.</text>
<text class="hd" x="26.0" y="26.0">CHILD spends its query budget in a one-sided band just above the Otsu split of past scores</text>
</svg>
