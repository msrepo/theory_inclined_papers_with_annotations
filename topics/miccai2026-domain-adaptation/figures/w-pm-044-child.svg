  .sub{font-size:11.5px;fill:#57564f} .big{font-size:12.5px;font-weight:500;fill:#1a1a19}
  .t1{fill:#2f6fb5} .t2{fill:#c8702f}
  .c1{fill:#2f6fb5;stroke:none;opacity:0.5} .c2{fill:#c8702f;stroke:none;opacity:0.5}
  .f1{fill:#2f6fb5;stroke:none;opacity:0.1} .f2{fill:#c8702f;stroke:none;opacity:0.1} .fg{fill:#8a8880;stroke:none;opacity:0.35}
  .m1{fill:#2f6fb5;stroke:#fbfaf6;stroke-width:1.4} .m2{fill:#c8702f;stroke:#fbfaf6;stroke-width:1.4}
