<svg viewBox="0 0 700 414" xmlns="http://www.w3.org/2000/svg" role="img">
<title>CHILD queries an asymmetric band just above the Otsu split</title>
<desc>A stacked histogram of a toy stream of 400 base OOD scores, orange for OOD samples clustered near 0.3 and blue for ID samples near 0.7. A dashed vertical line marks the Otsu threshold at 0.50, the split that maximises between-group variance. A shaded band starts at the threshold and extends only to the right, toward the ID side, by the width Delta equal to the 5th percentile minus the minimum of the history; only samples in this band are sent to a physician. Below, a score axis shows the retrieval correction: an OOD sample that scored just inside the band is pulled left because it is closer to the OOD cache, and an ID sample just below the threshold is pushed right because it is closer to the ID cache, each by beta times the soft similarity difference plus the gated hard vote.</desc>
