  .l2{fill:none;stroke:#c8702f;stroke-width:2}
  .lg{fill:none;stroke:#8a8880;stroke-width:1.5}
  .d1{fill:none;stroke:#2f6fb5;stroke-width:1.3;stroke-dasharray:4 3}
