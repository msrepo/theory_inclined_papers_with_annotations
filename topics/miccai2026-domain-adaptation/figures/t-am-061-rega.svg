<svg viewBox="0 0 700 372" xmlns="http://www.w3.org/2000/svg" role="img">
<title>ReGA reliability score and EMA memory</title>
<desc>Two panels. Left: the reliability score SICE = λ(λ1 S_v + λ2 exp(−S_b/α)) plotted against the 95th-percentile boundary discrepancy S_b between the prediction and its dropout copies, with toy weights λ1 = λ2 = 0.5 and α = 4. Blue curves have high soft-Dice agreement S_v = 0.95, orange curves S_v = 0.75; solid curves have low predictive entropy (calibration factor λ = 0.95), dashed curves higher entropy (λ = 0.70). The score falls as boundaries disagree, towards a floor set by the region term, and the entropy factor scales the whole curve down. Right: what happens when SICE is used directly as the teacher's EMA step. The weight the teacher puts on the student iterate from k steps ago, a(1 − a) to the power k, is plotted on a log axis for a = 0.6 and a = 0.3 (illustrative SICE values) and for the usual a = 0.001 (momentum 0.999). The half-life is 0.8 and 1.9 steps for the SICE rates versus about 693 steps for the standard mean teacher.</desc>
