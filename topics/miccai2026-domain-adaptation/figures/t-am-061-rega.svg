<text class="hd" x="26.0" y="26.0">One reliability score gates the update; used as the EMA rate, the teacher forgets within a few steps</text>
<text class="sub" x="26.0" y="44.0">SICE = λ·(λ₁S_v + λ₂e^(−S_b/α)),  λ = 1 − H(P̄)/log C;   teacher φ ← (1 − SICE)·φ + SICE·θ</text>
