<line x1="358.3" y1="186.5" x2="395.0" y2="186.5" class="arr"/>
<line x1="395.0" y1="186.5" x2="390.5" y2="184.3" class="arr"/>
<line x1="395.0" y1="186.5" x2="390.5" y2="188.7" class="arr"/>
