<line x1="429.8" y1="207.5" x2="422.1" y2="207.5" class="arr"/>
<line x1="422.1" y1="207.5" x2="426.6" y2="209.7" class="arr"/>
<line x1="422.1" y1="207.5" x2="426.6" y2="205.3" class="arr"/>
<circle cx="429.8" cy="207.5" r="4.0" class="m1"/>
<circle cx="416.1" cy="207.5" r="4.0" class="m2"/>
<text class="lab" x="108.0" y="232.5" text-anchor="end">E7  y = 21.2</text>
<line x1="449.3" y1="228.5" x2="376.7" y2="228.5" class="arr"/>
<line x1="376.7" y1="228.5" x2="381.2" y2="230.7" class="arr"/>
