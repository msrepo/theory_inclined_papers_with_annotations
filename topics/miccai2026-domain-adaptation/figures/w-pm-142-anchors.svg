<circle cx="423.9" cy="102.5" r="4.0" class="m2"/>
<text class="lab" x="295.8" y="97.5" text-anchor="middle">Δ̂ = +11.8</text>
<text class="lab" x="108.0" y="127.5" text-anchor="end">E2  y = 11.0</text>
