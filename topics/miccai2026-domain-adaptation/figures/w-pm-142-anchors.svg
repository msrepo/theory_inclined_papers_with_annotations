<text class="lab" x="640.0" y="325.0" text-anchor="middle">30</text>
<line x1="120.0" y1="310.0" x2="640.0" y2="310.0" class="ax"/>
<text class="lab" x="380.0" y="341.0" text-anchor="middle">OSATS total score (6 components × 1–5)</text>
<line x1="401.7" y1="74.0" x2="401.7" y2="310.0" class="op"/>
<text class="lab" x="401.7" y="70.0" text-anchor="middle">true y_T = 19</text>
