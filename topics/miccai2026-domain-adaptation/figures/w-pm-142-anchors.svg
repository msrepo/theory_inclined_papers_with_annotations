<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Anchoring a target score on exemplars</title>
<desc>A score axis for a 6-component OSATS total from 6 to 30, with one row per exemplar for M = 10 labelled source exemplars sorted by score. In each row a blue dot marks the exemplar's true label and an arrow of length equal to the relative head's predicted difference between target and exemplar ends at an orange dot, that exemplar's reconstruction of the target score. Exemplars below the target point right and those above point left, and all ten arrows land near the true target score of 19. Their average, an orange vertical line, is 18.3, close to the truth, while the absolute head applied to the shifted target video reads 24.6, shown as a grey dashed line. A note explains that during training the target consistency loss pulls the reconstructions towards the stop-gradient absolute prediction, so the anchoring helps only if the relative head is less shifted than the absolute head.</desc>
<style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
  .lab{font-size:11px;fill:#57564f} .hd{font-size:13px;font-weight:500;fill:#1a1a19}
  .sub{font-size:11.5px;fill:#57564f} .big{font-size:12.5px;font-weight:500;fill:#1a1a19}
  .c1{fill:#2f6fb5;stroke:none} .c2{fill:#c8702f;stroke:none} .c3{fill:#c3c2b7;stroke:none}
  .m1{fill:#2f6fb5;stroke:#fbfaf6;stroke-width:1.5} .m2{fill:#c8702f;stroke:#fbfaf6;stroke-width:1.5}
  .arr{stroke:#8a8880;stroke-width:1;fill:none;opacity:0.75}
  .box{fill:none;stroke:#e2e1da;stroke-width:1}
  .ax{stroke:#c3c2b7;stroke-width:0.8;fill:none}
  .gd{stroke:#e2e1da;stroke-width:0.6;fill:none;stroke-dasharray:3 3}
  .l1{fill:none;stroke:#2f6fb5;stroke-width:2}
  .l2{fill:none;stroke:#c8702f;stroke-width:2}
  .l3{fill:none;stroke:#8a8880;stroke-width:1.4;stroke-dasharray:4 3}
  .op{stroke:#1a1a19;stroke-width:1.2;stroke-dasharray:4 3;fill:none}
  .vec{stroke:#1a1a19;stroke-width:1.6;fill:none}
  .pt{fill:#1a1a19;stroke:#fbfaf6;stroke-width:1.2}
  @media (prefers-color-scheme: dark){
    .lab{fill:#b6b4ab} .hd{fill:#eceae3} .sub{fill:#b6b4ab} .big{fill:#eceae3}
    .box{stroke:#33312e} .ax{stroke:#4a4844} .gd{stroke:#33312e}
    .c1{fill:#7fb2e8} .c2{fill:#e09a5f} .c3{fill:#85837b}
    .m1{fill:#7fb2e8;stroke:#1c1b19} .m2{fill:#e09a5f;stroke:#1c1b19}
    .arr{stroke:#85837b} .l1{stroke:#7fb2e8} .l2{stroke:#e09a5f} .l3{stroke:#85837b} .op{stroke:#eceae3}
    .vec{stroke:#eceae3} .pt{fill:#eceae3;stroke:#1c1b19}
  }
</style>
<text class="hd" x="20.0" y="26.0">Target score = exemplar label + predicted difference, averaged over anchors; the scale comes from source labels</text>
<text class="sub" x="20.0" y="44.0">ŷ_T,m = Δ̂(T − E_m) + y_E,m  and  ȳ_T = mean over m of ŷ_T,m, so only the relative head's error enters, averaged over M = 10</text>
<line x1="120.0" y1="80.0" x2="120.0" y2="310.0" class="gd"/>
<text class="lab" x="120.0" y="325.0" text-anchor="middle">6</text>
<line x1="206.7" y1="80.0" x2="206.7" y2="310.0" class="gd"/>
<text class="lab" x="206.7" y="325.0" text-anchor="middle">10</text>
<line x1="293.3" y1="80.0" x2="293.3" y2="310.0" class="gd"/>
<text class="lab" x="293.3" y="325.0" text-anchor="middle">14</text>
<line x1="380.0" y1="80.0" x2="380.0" y2="310.0" class="gd"/>
<text class="lab" x="380.0" y="325.0" text-anchor="middle">18</text>
