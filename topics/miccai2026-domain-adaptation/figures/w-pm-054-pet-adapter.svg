<svg viewBox="0 0 700 392" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Why PET-Adapter can warm-start diffusion from OSEM</title>
<desc>Left: for a toy one-dimensional Poisson deblurring problem, the error power of the MLEM reconstruction divided by the signal power in each spatial-frequency band, after 2, 10 and 200 iterations, on a log frequency axis. After only 2 iterations the low-frequency bands already have near-zero error while the high bands sit at 1, meaning nothing has been recovered there; more iterations push the recovered range slightly higher, and by 200 iterations noise is amplified to several times the signal power in the mid-high bands. A dashed curve shows the squared singular values of the blur operator, and a shaded band marks frequencies where they fall below 0.01, effectively the null space the measurement loss cannot see. Right: two diffusion time lines. Standard sampling starts from pure noise at t = 1 and takes 50 steps; PET-Adapter inverts the OSEM image to t = 0.4 and takes only 2 steps.</desc>
