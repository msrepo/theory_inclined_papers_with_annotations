<text class="lab" x="470.0" y="170.0">PET-Adapter: DDIM-invert OSEM</text>
<text class="lab" x="470.0" y="184.0">to t_r = 0.4, then T = 2 steps</text>
<line x1="470.0" y1="196.0" x2="676.0" y2="196.0" class="ax"/>
<line x1="593.6" y1="196.0" x2="676.0" y2="196.0" class="l1"/>
<line x1="593.6" y1="192.0" x2="593.6" y2="200.0" class="l1"/>
<line x1="634.8" y1="192.0" x2="634.8" y2="200.0" class="l1"/>
<line x1="676.0" y1="192.0" x2="676.0" y2="200.0" class="l1"/>
<text class="lab" x="470.0" y="214.0" text-anchor="middle">t = 1</text>
<text class="lab" x="593.6" y="214.0" text-anchor="middle">t = 0.4</text>
<text class="lab" x="676.0" y="214.0" text-anchor="middle">t = 0</text>
<line x1="593.6" y1="120.0" x2="593.6" y2="162.0" class="gd"/>
<text class="lab" x="470.0" y="240.0">The inverted OSEM image keeps its</text>
<text class="lab" x="470.0" y="254.0">reliable low frequencies; the prior</text>
<text class="lab" x="470.0" y="268.0">only has to add the high ones.</text>
<line x1="452.0" y1="52.0" x2="452.0" y2="286.0" class="box"/>
<text class="hd" x="26.0" y="24.0">PET-Adapter warm-starts diffusion from OSEM, because EM recovers large-singular-value components first</text>
<text class="lab" x="26.0" y="318.0">Toy 1-D Poisson problem y ~ Poisson(Ax + b) with a Gaussian blur A. Curves at 1 mean a band is not recovered at all; above 1,</text>
<text class="lab" x="26.0" y="334.0">noise is being amplified (200 iterations), which is why OSEM is stopped early. The adaptation loss, Poisson NLL on y,</text>
<text class="lab" x="26.0" y="350.0">cannot see the shaded band, which is large for limited-angle PET; detail there comes from the prior and the MR-weighted TV.</text>
<text class="lab" x="26.0" y="366.0">LoRA adapters, FiLM-conditioned on MR features, are the only parameters trained on the clinical data.</text>
</svg>
