<text class="hd" x="26.0" y="26.0">The shape prior is a Fourier descriptor that ignores pose, size and where the boundary starts</text>
<text class="sub" x="26.0" y="44.0">z_m = x_m + i·y_m → DFT Z_u;  v_spec(i) = |Zᵢ₊₁| / |Z₁|: drop Z₀ (translation), ÷|Z₁| (scale), |·| (rotation, start point)</text>
