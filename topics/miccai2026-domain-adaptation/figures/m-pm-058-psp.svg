<svg viewBox="0 0 700 386" xmlns="http://www.w3.org/2000/svg" role="img">
<title>PSP Fourier shape descriptor invariance</title>
<desc>Top: three closed contours. The first is an organ-like outline; the second is the same outline rotated by 70 degrees, shrunk to 62 percent, shifted and with its boundary sampling started at a different point (start points marked with a dot); the third is a different, four-lobed outline. Bottom: the Fourier shape descriptor v_spec(i) = |Z_(i+1)| / |Z_1| for i = 0 to 14 on a log scale (v_spec(0) is 1 by construction). The original and the transformed copy give identical descriptors (blue bars and black ticks coincide to machine precision), while the different shape gives a clearly different profile (orange dots), peaking at other harmonics. Translation is removed by dropping Z_0, scale by dividing by |Z_1|, rotation and start point by taking magnitudes.</desc>
