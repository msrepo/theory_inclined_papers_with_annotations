<svg viewBox="0 0 700 322" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Uncertainty then diversity query score</title>
<desc>Three linked panels for a toy pool of unlabelled target volumes. Panel 1 plots each sample's quantile-normalised aleatoric term (mean entropy over test-time augmentations) against its normalised epistemic term (variance of free energy over augmentations), with dashed lines of constant sum CDU; the six lowest-CDU samples are blue source-like prototypes L and the six highest-CDU samples are orange candidates H. Panel 2 places the same samples on a unit circle by encoder-embedding direction: the prototypes cluster together, while the candidates lie far away, three of them in a tight clump. Panel 3 shows stacked bars of the prototype discrepancy for each candidate: an orange cross-domain part (mean cosine distance to the prototypes) plus a grey self-domain part (mean cosine distance to the other candidates). The three highest totals are queried for annotation, these are two isolated candidates and only one member of the clump, because the clumped candidates have a small self-domain part.</desc>
