<text x="62.0" y="312.0" text-anchor="start" class="lab">Why C loses most: M has 1s on its diagonal, so every low-confidence class adds (ŷ² − 1)² ≈ 1 to the distance,</text>
<text x="62.0" y="326.0" text-anchor="start" class="lab">which mixes confidence into what is meant to be a label-structure check.</text>
