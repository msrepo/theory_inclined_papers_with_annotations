<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Co-occurrence consistency weight</title>
<desc>Left: a five-by-five heatmap of the label co-occurrence matrix M estimated online from the model's own binarised predictions, for effusion, cardiomegaly, edema, pneumothorax and nodule. Effusion, cardiomegaly and edema co-occur strongly (off-diagonal values around 0.5 to 0.6), while pneumothorax and nodule are nearly independent of everything (values near 0.1). Right: stacked bars of the Frobenius distance between each sample's soft outer product and M, split into a grey diagonal part and a coloured off-diagonal part. Sample A predicts the common pair effusion plus cardiomegaly and gets a small off-diagonal part and the highest weight. Sample B has the same two confidences but on the rare pair effusion plus pneumothorax, so its off-diagonal part is larger and its weight lower. Sample C predicts no finding; its off-diagonal part is moderate but its diagonal part is the largest because every diagonal entry of M equals one, so it gets the lowest weight of all.</desc>
