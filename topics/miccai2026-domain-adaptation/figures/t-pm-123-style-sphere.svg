<svg viewBox="0 0 700 362" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Contrastive style vectors and SLERP</title>
<desc>Two unit circles standing for the style hypersphere. Left: a query style vector v from one crop and a positive v-plus from another crop of the same image sit a few degrees apart, while five negatives made by intensity perturbations of the positive (contrast change, smoothing, noise, bias field, and a mix) are spread around the circle. With temperature 0.01 the softmax puts almost all weight on the positive even though the contrast negative is only 30 degrees away, so the encoder must separate style changes that keep anatomy fixed. Right: grey dots are target-image styles in three clusters; two cluster references v0 and v1, 120 degrees apart, are joined by a blue geodesic arc (SLERP) whose intermediate points stay on the circle, and by an orange straight chord whose midpoint has norm cos(60 degrees) = 0.50, falling well inside the sphere.</desc>
<style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
  .lab{font-size:11px;fill:#57564f} .hd{font-size:13px;font-weight:500;fill:#1a1a19}
  .sub{font-size:11.5px;fill:#57564f} .big{font-size:12.5px;font-weight:500;fill:#1a1a19}
  .c1{fill:#2f6fb5;stroke:none} .c2{fill:#c8702f;stroke:none} .c3{fill:#8a8880;stroke:none}
  .m1{fill:#2f6fb5;stroke:#fbfaf6;stroke-width:1.4} .m2{fill:#c8702f;stroke:#fbfaf6;stroke-width:1.4}
  .sep{stroke:#1a1a19;stroke-width:1.6;fill:none}
  .ell{fill:none;stroke:#8a8880;stroke-width:1.2}
  .eucl{fill:none;stroke:#8a8880;stroke-width:1.2;stroke-dasharray:4 3}
  .maha{fill:none;stroke:#2f6fb5;stroke-width:1.3;stroke-dasharray:4 3}
  .vec{stroke:#1a1a19;stroke-width:1.6;fill:none}
  .pt{fill:#1a1a19;stroke:#fbfaf6;stroke-width:1.2}
  .arr{stroke:#8a8880;stroke-width:1;fill:none;opacity:0.75}
  .box{fill:none;stroke:#e2e1da;stroke-width:1}
  .ax{stroke:#c3c2b7;stroke-width:0.8;fill:none}
  .gd{stroke:#e2e1da;stroke-width:0.6;fill:none;stroke-dasharray:3 3}
  .l1{fill:none;stroke:#2f6fb5;stroke-width:2}
  .l2{fill:none;stroke:#c8702f;stroke-width:2}
  .op{stroke:#1a1a19;stroke-width:1.2;stroke-dasharray:4 3;fill:none}
  @media (prefers-color-scheme: dark){
    .lab{fill:#b6b4ab} .hd{fill:#eceae3} .sub{fill:#b6b4ab} .big{fill:#eceae3}
