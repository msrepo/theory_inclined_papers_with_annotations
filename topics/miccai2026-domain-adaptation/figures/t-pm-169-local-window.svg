<svg viewBox="0 0 700 366" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Local correlation window reach</title>
<desc>Left: a toy left-ventricular wall drawn as an arch with the apex at the top and nine tracked points along it. Each point's true trajectory over one cardiac cycle is a small blue loop that grows from almost nothing at the apex to the largest excursion at the base. Around the apical point and one basal point, a dashed grey square shows a 7-by-7 correlation window and a dashed blue square a 9-by-9 window, both centred on the query position at end-diastole. Near end-systole the basal trajectories leave the 7-by-7 window (orange segments) but stay inside the 9-by-9 one. Right: the basal point's distance from its query position over 36 frames rises to about 15 pixels at end-systole and returns to zero. A grey dashed line at 12 pixels marks the reach of a 7-by-7 window at stride 4 and a blue dashed line at 16 pixels the reach of a 9-by-9 window, so only the larger window covers the peak.</desc>
