<text class="hd" x="20.0" y="26.0">Pooling cannot see organ size, so JANUS feeds size back through a gate that can only switch evidence off</text>
<text class="sub" x="20.0" y="44.0">z_v = Σ wᵢuᵢ with Σ wᵢ = 1 over ROI tokens;   g = σ(W_g s + b_g) ∈ [0, 1]ᵈ;   ŷ = wᵀ(z_v ⊙ g) + b</text>
