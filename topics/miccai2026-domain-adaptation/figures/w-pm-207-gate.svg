<svg viewBox="0 0 700 356" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Size-driven gate on pooled evidence</title>
<desc>Two panels. Left: two tri-slice token grids for the same label. In the first the organ's ROI covers 8 tokens, in the second an enlarged organ covers 22 tokens, all with the same appearance. Attention pooling over the ROI normalises its weights to sum to one, so both give exactly the same pooled embedding z_v, and a purely visual classifier gives the same probability for both. Only the segmentation-derived measurement differs: a z-scored volume s of 0.1 versus 2.4. Right: predicted probability against s for a toy two-dimensional JANUS head. The visual-only probability is flat at 0.83, and the gate at initialisation, sigma(2) = 0.88, gives a flat 0.76. The trained gate sigma(W s + b) closes the size-sensitive channel for normal volumes, so the normal-sized, visually suspicious case drops to 0.46, below the 0.5 decision line (a veto), while the enlarged case keeps 0.81. Because every gate value lies between 0 and 1 and this toy's evidence terms are positive, the curve can never exceed the visual-only ceiling.</desc>
