<text class="hd" x="26.0" y="26.0">Distillation keeps the cross-domain cosine matrix, so rotations are free but relative drift is penalised</text>
<text class="sub" x="26.0" y="44.0">R(i,j) = N(F_i) N(F_j)ᵀ ∈ ℝ^(P×P);   L_rel = mean ‖Rᵗ(i,j) − Rᵗ⁻¹(i,j)‖₁ over old-domain pairs and layers</text>
