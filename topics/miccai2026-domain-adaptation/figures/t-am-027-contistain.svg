<svg viewBox="0 0 700 386" xmlns="http://www.w3.org/2000/svg" role="img">
<title>ContiStain cross-domain relation distillation</title>
<desc>Three columns, each a toy with six normalised tokens per domain drawn on the unit circle: blue tokens are the rendering of old biomarker i, orange tokens the rendering of old biomarker j, from the same H&amp;E input and the same patch positions. Under each circle is the 6 by 6 cross-domain relation matrix R(i,j), entry (p,q) the cosine between token p of domain i and token q of domain j, blue for positive and orange for negative. Column 1 is the frozen teacher. Column 2 is a student whose whole feature space is rotated by 55 degrees: every token moved, but R is unchanged and the relational loss is 0.00. Column 3 is a student in which the domain-j tokens drifted relative to domain i: R changes visibly and the loss is 0.51. The distillation term therefore penalises changes in cross-domain geometry, not absolute feature positions.</desc>
