<svg viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The two uniformity objectives share a minimiser and differ by a Jensen gap</title>
<desc>Left: the log-outside form and the log-between form of the uniformity objective, plotted against von Mises-Fisher concentration, which interpolates from uniform at zero to highly concentrated. Both are minimised at zero concentration. Right: the gap between them, which is zero only at zero concentration, that is only at uniformity, and strictly positive elsewhere.</desc>
