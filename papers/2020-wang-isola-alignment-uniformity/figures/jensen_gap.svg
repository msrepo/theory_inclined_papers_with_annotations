  .sm{font-size:10px;fill:#8a8880}
  .ax{stroke:#c3c2b7;stroke-width:0.5;fill:none}
  .gd{stroke:#e2e1da;stroke-width:0.5;fill:none;stroke-dasharray:4 4}
  .ring{fill:none;stroke:#c3c2b7;stroke-width:0.5}
  .pt{fill:#2f6fb5}
  .barA{fill:#8a8880} .barB{fill:#2f6fb5}
  .a{fill:none;stroke:#2f6fb5;stroke-width:2}
  .b{fill:none;stroke:#c2642a;stroke-width:1.6;stroke-dasharray:6 3}
  .c{fill:none;stroke:#8a8880;stroke-width:1.2;stroke-dasharray:2 3}
  @media (prefers-color-scheme: dark){
    .lab{fill:#b6b4ab} .hd{fill:#eceae3} .sm{fill:#85837b}
    .ax{stroke:#4a4844} .gd{stroke:#33312e} .ring{stroke:#4a4844}
