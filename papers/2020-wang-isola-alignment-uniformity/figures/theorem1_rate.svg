<svg viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Theorem 1 converges faster than the stated bound</title>
<desc>Left: the absolute deviation of the normalised contrastive loss from its infinite-negative limit, against the number of negatives, on log axes, with reference slopes for M to the minus one half and M to the minus one. The measured curve tracks M to the minus one. Right: the deviation multiplied by M, which is roughly flat near two across three orders of magnitude, confirming the true rate is of order one over M.</desc>
<style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
  .lab{font-size:11px;fill:#57564f} .hd{font-size:13px;font-weight:500;fill:#1a1a19}
  .sm{font-size:10px;fill:#8a8880}
  .ax{stroke:#c3c2b7;stroke-width:0.5;fill:none}
  .gd{stroke:#e2e1da;stroke-width:0.5;fill:none;stroke-dasharray:4 4}
  .ring{fill:none;stroke:#c3c2b7;stroke-width:0.5}
  .pt{fill:#2f6fb5}
  .barA{fill:#8a8880} .barB{fill:#2f6fb5}
  .a{fill:none;stroke:#2f6fb5;stroke-width:2}
  .b{fill:none;stroke:#c2642a;stroke-width:1.6;stroke-dasharray:6 3}
  .c{fill:none;stroke:#8a8880;stroke-width:1.2;stroke-dasharray:2 3}
  @media (prefers-color-scheme: dark){
    .lab{fill:#b6b4ab} .hd{fill:#eceae3} .sm{fill:#85837b}
    .ax{stroke:#4a4844} .gd{stroke:#33312e} .ring{stroke:#4a4844}
    .pt{fill:#7fb2e8} .barA{fill:#85837b} .barB{fill:#7fb2e8}
    .a{stroke:#7fb2e8} .b{stroke:#e0955c} .c{stroke:#85837b}
  }
</style>
<line x1="76" y1="180.1" x2="376" y2="180.1" class="gd"/><text class="lab" x="69" y="184.1" text-anchor="end">0.01</text><line x1="76" y1="114.6" x2="376" y2="114.6" class="gd"/><text class="lab" x="69" y="118.6" text-anchor="end">0.1</text><line x1="76" y1="49.2" x2="376" y2="49.2" class="gd"/><text class="lab" x="69" y="53.2" text-anchor="end">1</text><text class="lab" x="86.0" y="250" text-anchor="middle">2</text><text class="lab" x="148.1" y="250" text-anchor="middle">8</text><text class="lab" x="241.2" y="250" text-anchor="middle">64</text><text class="lab" x="334.3" y="250" text-anchor="middle">512</text><polyline points="86.0,70.0 117.0,79.9 148.1,89.7 179.1,99.6 210.1,109.4 241.2,119.3 272.2,129.1 303.2,139.0 334.3,148.9 365.3,158.7" class="c"/><polyline points="86.0,50.3 117.0,70.0 148.1,89.7 179.1,109.4 210.1,129.1 241.2,148.9 272.2,168.6 303.2,188.3 334.3,208.0 365.3,227.7" class="b"/><polyline points="86.0,56.2 117.0,71.9 148.1,89.5 179.1,108.5 210.1,128.0 241.2,147.5 272.2,166.4 303.2,186.6 334.3,212.3 365.3,222.5" class="a"/><circle cx="86.0" cy="56.2" r="3" class="pt"/><circle cx="117.0" cy="71.9" r="3" class="pt"/><circle cx="148.1" cy="89.5" r="3" class="pt"/><circle cx="179.1" cy="108.5" r="3" class="pt"/><circle cx="210.1" cy="128.0" r="3" class="pt"/><circle cx="241.2" cy="147.5" r="3" class="pt"/><circle cx="272.2" cy="166.4" r="3" class="pt"/><circle cx="303.2" cy="186.6" r="3" class="pt"/><circle cx="334.3" cy="212.3" r="3" class="pt"/><circle cx="365.3" cy="222.5" r="3" class="pt"/><line x1="76" y1="234" x2="376" y2="234" class="ax"/><line x1="76" y1="44" x2="76" y2="234" class="ax"/><text class="hd" x="68" y="22">Deviation from the Theorem 1 limit</text><text class="lab" x="226" y="268" text-anchor="middle">number of negatives M (log scale)</text><text class="lab" x="292" y="123">M<tspan font-size="9" dy="-4">&#8722;1/2</tspan><tspan dy="4"> bound</tspan></text><text class="lab" x="204" y="197">M<tspan font-size="9" dy="-4">&#8722;1</tspan></text><text class="lab" x="98" y="119">measured</text><line x1="470" y1="174.6" x2="770" y2="174.6" class="gd"/><text class="lab" x="463" y="178.6" text-anchor="end">1</text><line x1="470" y1="115.2" x2="770" y2="115.2" class="gd"/><text class="lab" x="463" y="119.2" text-anchor="end">2</text><line x1="470" y1="55.9" x2="770" y2="55.9" class="gd"/><text class="lab" x="463" y="59.9" text-anchor="end">3</text><polyline points="480.0,141.4 511.0,127.3 542.1,119.2 573.1,116.0 604.1,115.3 635.2,114.3 666.2,111.2 697.2,113.3 728.3,136.3 759.3,97.3" class="a"/><circle cx="480.0" cy="141.4" r="3" class="pt"/><circle cx="511.0" cy="127.3" r="3" class="pt"/><circle cx="542.1" cy="119.2" r="3" class="pt"/><circle cx="573.1" cy="116.0" r="3" class="pt"/><circle cx="604.1" cy="115.3" r="3" class="pt"/><circle cx="635.2" cy="114.3" r="3" class="pt"/><circle cx="666.2" cy="111.2" r="3" class="pt"/><circle cx="697.2" cy="113.3" r="3" class="pt"/><circle cx="728.3" cy="136.3" r="3" class="pt"/><circle cx="759.3" cy="97.3" r="3" class="pt"/><line x1="470" y1="234" x2="770" y2="234" class="ax"/><line x1="470" y1="44" x2="470" y2="234" class="ax"/><text class="lab" x="480.0" y="250" text-anchor="middle">2</text><text class="lab" x="542.1" y="250" text-anchor="middle">8</text><text class="lab" x="635.2" y="250" text-anchor="middle">64</text><text class="lab" x="728.3" y="250" text-anchor="middle">512</text><text class="hd" x="462" y="22">deviation &#215; M, flat means rate = 1/M</text><text class="lab" x="620" y="268" text-anchor="middle">number of negatives M (log scale)</text>
</svg>
