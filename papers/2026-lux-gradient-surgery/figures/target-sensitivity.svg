<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Hitting a target sensitivity by lowering the threshold</title>
<desc>Schematic of voxel sensitivity against probability threshold. A dashed line marks a 95 percent target. The overconfident Dice model gives a flat curve near 86 percent across almost all thresholds and only jumps to 99 percent at a threshold near zero, so the target cannot be dialled in. The calibrated model gives a smooth, gradually falling curve that crosses 95 percent at a moderate threshold, which can be chosen on validation data and transferred to test data.</desc>
