<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Push on one pixel logit versus predicted probability</title>
<desc>Three panels plot the size of the gradient push on a single pixel logit against its predicted probability p, orange for a foreground pixel and blue for a background pixel. A, cross-entropy: two straight lines, 1 minus p and p, crossing at 0.5, so a confident wrong pixel gets the biggest push. B, Dice: two hump-shaped curves of different heights that are largest at 0.5 and vanish at 0 and 1; they meet only at the ends, so there is no balance point in between and confident errors get no push. C, Dice with surgery: two straight lines scaled by the region weights, crossing near 0.5.</desc>
