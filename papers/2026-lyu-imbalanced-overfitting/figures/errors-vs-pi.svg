<svg viewBox="0 0 700 345" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Test errors against imbalance</title>
<desc>Line chart of test error against pi from 0 to 0.5. At tau = 1 the minority error rises from 0.18 at pi = 0.5 to 1 as pi goes to 0, the majority error falls to 0, and the balanced error rises to 0.5. With tau = tau_opt all three errors equal Phi(-rho* ||mu||), which rises only from 0.18 to 0.41. A grey band marks pi below 0.027, where tau_opt is negative.</desc>
