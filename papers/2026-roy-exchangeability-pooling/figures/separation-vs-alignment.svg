<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Separation versus class-conditional exchangeability</title>
<desc>Three panels of feature space. Orange marks are foreground features, blue marks are background features; filled circles come from site A and hollow circles from site B. Panel A, pooled data without the loss: four clusters, and site B's background cluster overlaps site A's foreground cluster, a crossover. Panel B, the paper's cross-dataset loss: the crossover is removed, but site A and site B foreground still form two separate clusters, so the site can be read from the features. Panel C, class-conditional exchangeability: foreground from both sites forms one mixed cluster and background from both sites forms another, so the site cannot be read from the features.</desc>
<style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
  .lab{font-size:12px;fill:#57564f} .hd{font-size:13px;font-weight:500;fill:#1a1a19}
  .sm{font-size:11px;fill:#57564f}
  .fgA{fill:#c2571a} .fgB{fill:none;stroke:#c2571a;stroke-width:1.4}
  .bgA{fill:#2f6fb5} .bgB{fill:none;stroke:#2f6fb5;stroke-width:1.4}
  .ring{fill:none;stroke:#57564f;stroke-width:1;stroke-dasharray:4 3}
  .warn{fill:none;stroke:#c2571a;stroke-width:1.4}
  .ok{fill:#0f7a5a} .bad{fill:#c2571a}
  .box{fill:#f4f3ee;stroke:#c3c2b7;stroke-width:0.8}
  @media (prefers-color-scheme: dark){
    .lab,.sm{fill:#b6b4ab} .hd{fill:#eceae3}
    .fgA{fill:#f0a070} .fgB{stroke:#f0a070} .bgA{fill:#7fb2e8} .bgB{stroke:#7fb2e8}
    .ring{stroke:#b6b4ab} .warn{stroke:#f0a070} .ok{fill:#4cc79a} .bad{fill:#f0a070}
    .box{fill:#23262b;stroke:#4a4844}
  }
</style>
<defs>
  <g id="cl"><circle cx="0" cy="0" r="3.5"/><circle cx="9" cy="-5" r="3.5"/><circle cx="-8" cy="6" r="3.5"/><circle cx="5" cy="9" r="3.5"/><circle cx="-9" cy="-6" r="3.5"/><circle cx="12" cy="5" r="3.5"/><circle cx="-2" cy="-11" r="3.5"/></g>
</defs>

<rect class="box" x="8" y="10" width="228" height="280" rx="8"/>
<text class="hd" x="20" y="32">A. Pooled, no loss</text>
<g class="fgA"><use href="#cl" x="80" y="90"/></g>
<g class="fgB"><use href="#cl" x="170" y="90"/></g>
<g class="bgA"><use href="#cl" x="80" y="190"/></g>
<g class="bgB"><use href="#cl" x="102" y="104"/></g>
<circle class="warn" cx="92" cy="97" r="32"/>
<text class="bad lab" x="20" y="250">B's background lands on</text>
<text class="bad lab" x="20" y="266">A's foreground: crossover</text>

<rect class="box" x="246" y="10" width="228" height="280" rx="8"/>
<text class="hd" x="258" y="32">B. Paper's cross-dataset loss</text>
<g class="fgA"><use href="#cl" x="300" y="80"/></g>
<g class="fgB"><use href="#cl" x="420" y="80"/></g>
<g class="bgA"><use href="#cl" x="300" y="190"/></g>
<g class="bgB"><use href="#cl" x="420" y="190"/></g>
<text class="ok lab" x="258" y="250">no crossover</text>
<text class="bad lab" x="258" y="266">but site still readable</text>

<rect class="box" x="484" y="10" width="228" height="280" rx="8"/>
<text class="hd" x="496" y="32">C. Class-conditional</text>
<text class="hd" x="496" y="48">exchangeability</text>
<g class="fgA"><use href="#cl" x="590" y="88"/></g>
<g class="fgB"><use href="#cl" x="604" y="94"/></g>
<circle class="ring" cx="597" cy="90" r="30"/>
<g class="bgA"><use href="#cl" x="590" y="188"/></g>
<g class="bgB"><use href="#cl" x="604" y="194"/></g>
<circle class="ring" cx="597" cy="190" r="30"/>
<text class="ok lab" x="496" y="250">fg mixed, bg mixed:</text>
<text class="ok lab" x="496" y="266">site cannot be read off</text>

<g transform="translate(20,283)"></g>
</svg>
