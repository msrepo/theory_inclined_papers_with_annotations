<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The probability simplex and its CLR image</title>
<desc>Left: the triangle of all probability vectors for three classes. Two families of lines of constant ratio fan out from the corners: blue lines keep the ratio of class 1 to class 2 fixed and all pass through the class 3 corner; purple lines keep the ratio of class 2 to class 3 fixed and pass through the class 1 corner. The lines crowd together near the corners. A green curve joins two points as the shortest path in Aitchison geometry, bending away from the dashed straight segment. Smoothed one-hot labels for class 3 with epsilon 0.01, 0.001 and 0.0001 all sit practically on the class 3 corner. Right: the same objects after the centred log-ratio map. The triangle becomes an entire flat plane centred on the uniform vector; both families of constant-ratio lines become evenly spaced parallel straight lines; the green path becomes a straight segment; and the three smoothed labels separate into three points along the class 3 direction, further out the smaller epsilon is, running off to infinity as epsilon goes to zero.</desc>
