  .g2{stroke:#7a5ab5;stroke-width:0.9;fill:none;opacity:.55}
  .geo{stroke:#0f7a5a;stroke-width:2;fill:none} .geot{fill:#0f7a5a}
  .euc{stroke:#a9a79d;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
  .pt{fill:#1a1a19} .lbl{fill:#c2571a} .lblt{fill:#c2571a}
  .arr{stroke:#1a1a19;stroke-width:1.4;fill:none} .arf{fill:#1a1a19}
  .box{fill:#f4f3ee;stroke:#c3c2b7;stroke-width:0.8}
