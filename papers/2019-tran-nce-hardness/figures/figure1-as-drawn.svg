<svg viewBox="0 0 760 274" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Figure 1 of Tran et al. counted as drawn</title>
<desc>Five toy panels. Counted H(Y|Z) is 0.693 in panels a, b, d, e and 0 in c; the text gives a and b as 4 log 2.</desc>
<style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
  .lab{font-size:11px;fill:#57564f} .hd{font-size:13px;font-weight:500;fill:#1a1a19}
  .sm{font-size:10.5px;fill:#57564f} .v{font-size:10.5px;fill:#1a1a19}
  .ax{stroke:#8a8880;stroke-width:0.9;fill:none} .box{fill:none;stroke:#c9c7bf;stroke-width:1}
  .gd{stroke:#e2e1da;stroke-width:0.6;fill:none}
  .s1{stroke:#2a78d6} .s2{stroke:#eb6834} .s3{stroke:#1baf7a} .s4{stroke:#eda100} .s5{stroke:#8a8880}
  .f1{fill:#2a78d6} .f2{fill:#eb6834} .f3{fill:#1baf7a} .f4{fill:#eda100}
  .ln{stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .seg{stroke-width:4;stroke-linecap:round;fill:none}
  .dash{stroke-width:1.3;fill:none;stroke-dasharray:5 3}
  .win{fill:#2a78d6;opacity:.13} .gap{fill:#eb6834;opacity:.18}
  .ring{stroke:#fdfdfc;stroke-width:1.2} .arr{fill:#6f6d66}
  @media (prefers-color-scheme: dark){
    .lab,.sm{fill:#b6b4ab} .hd,.v{fill:#eceae3} .ax{stroke:#85837b} .box{stroke:#4a4844} .gd{stroke:#33312e}
    .s1{stroke:#3987e5} .s2{stroke:#d95926} .s3{stroke:#199e70} .s4{stroke:#c98500} .s5{stroke:#85837b}
    .f1{fill:#3987e5} .f2{fill:#d95926} .f3{fill:#199e70} .f4{fill:#c98500}
    .win{fill:#3987e5;opacity:.18} .gap{fill:#d95926;opacity:.24} .ring{stroke:#161615} .arr{fill:#a3a19a}
  }
</style>
<text x="14" y="20" class="hd">The paper's Figure 1, counted as drawn: eight examples per panel, equal runs</text>
<text x="14" y="70" class="sm">Y</text><text x="14" y="140" class="sm">Z</text>
<path d="M 36.0,92 H 96.0" class="seg s1"/>
<path d="M 100.0,77 H 160.0" class="seg s1"/>
<path d="M 36.0,152 H 160.0" class="seg s2"/>
<path d="M 34,176 H 156" class="ax"/><path d="M 156,172 L 164,176 L 156,180 Z" class="arr"/>
<text x="98" y="196" class="hd" text-anchor="middle">(a)</text>
<text x="98" y="216" class="v" text-anchor="middle">counted 0.693</text>
<text x="98" y="234" class="sm" text-anchor="middle" style="fill:#eb6834">text says 4 log 2 = 2.773</text>
<path d="M 176.0,92 H 204.0" class="seg s1"/>
<path d="M 208.0,77 H 236.0" class="seg s1"/>
<path d="M 240.0,92 H 268.0" class="seg s1"/>
<path d="M 272.0,77 H 300.0" class="seg s1"/>
<path d="M 176.0,152 H 300.0" class="seg s2"/>
<path d="M 174,176 H 296" class="ax"/><path d="M 296,172 L 304,176 L 296,180 Z" class="arr"/>
<text x="238" y="196" class="hd" text-anchor="middle">(b)</text>
<text x="238" y="216" class="v" text-anchor="middle">counted 0.693</text>
<text x="238" y="234" class="sm" text-anchor="middle" style="fill:#eb6834">text says 4 log 2 = 2.773</text>
<path d="M 316.0,92 H 376.0" class="seg s1"/>
<path d="M 380.0,77 H 440.0" class="seg s1"/>
<path d="M 316.0,137 H 376.0" class="seg s2"/>
<path d="M 380.0,152 H 440.0" class="seg s2"/>
<path d="M 314,176 H 436" class="ax"/><path d="M 436,172 L 444,176 L 436,180 Z" class="arr"/>
<text x="378" y="196" class="hd" text-anchor="middle">(c)</text>
<text x="378" y="216" class="v" text-anchor="middle">counted 0.000</text>
<text x="378" y="234" class="sm" text-anchor="middle">text says 0</text>
<path d="M 456.0,92 H 484.0" class="seg s1"/>
<path d="M 488.0,77 H 516.0" class="seg s1"/>
<path d="M 520.0,92 H 548.0" class="seg s1"/>
<path d="M 552.0,77 H 580.0" class="seg s1"/>
<path d="M 456.0,137 H 516.0" class="seg s2"/>
<path d="M 520.0,152 H 580.0" class="seg s2"/>
<path d="M 454,176 H 576" class="ax"/><path d="M 576,172 L 584,176 L 576,180 Z" class="arr"/>
<text x="518" y="196" class="hd" text-anchor="middle">(d)</text>
<text x="518" y="216" class="v" text-anchor="middle">counted 0.693</text>
<text x="518" y="234" class="sm" text-anchor="middle">text says log 2</text>
<path d="M 596.0,92 H 624.0" class="seg s1"/>
<path d="M 628.0,77 H 656.0" class="seg s1"/>
<path d="M 660.0,62 H 688.0" class="seg s1"/>
<path d="M 692.0,47 H 720.0" class="seg s1"/>
<path d="M 596.0,152 H 656.0" class="seg s2"/>
<path d="M 660.0,137 H 720.0" class="seg s2"/>
<path d="M 594,176 H 716" class="ax"/><path d="M 716,172 L 724,176 L 716,180 Z" class="arr"/>
<text x="658" y="196" class="hd" text-anchor="middle">(e)</text>
<text x="658" y="216" class="v" text-anchor="middle">counted 0.693</text>
<text x="658" y="234" class="sm" text-anchor="middle">text says log 2</text>
<text x="14" y="262" class="sm">Blue is Y, orange is Z; height is the label. A binary Y has H(Y) at most log 2 = 0.693, so a constant Z cannot give 4 log 2.</text>
</svg>
