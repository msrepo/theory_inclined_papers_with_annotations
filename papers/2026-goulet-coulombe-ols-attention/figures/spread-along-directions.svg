<svg viewBox="0 0 900 580" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The quantity u'Su is the total squared spread of the points along u</title>
<desc>Top row: the same three training points (1,2), (2,1), (3,3) are projected onto three directions. Each point drops a dashed perpendicular onto the line; the foot is the projection, whose signed length along the line is x_i dot u. For u2 = (1,-1)/sqrt2 the three coordinates are -0.71, 0.71 and 0, squared and added they give 1. For u = (1,0) they are 1, 2, 3, giving 14. For u1 = (1,1)/sqrt2 they are 2.12, 2.12, 4.24, giving 27. Bottom: u'Su plotted against the angle of u equals 14 + 13 sin(2 theta); it is smallest, 1, at u2, and largest, 27, at u1, and the three directions above are marked on it.</desc>
<style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
  .lab{font-size:11px;fill:#57564f} .hd{font-size:13px;font-weight:500;fill:#1a1a19}
  .ax{stroke:#8a8880;stroke-width:0.9;fill:none} .gd{stroke:#e2e1da;stroke-width:0.6;fill:none}
  .s1{stroke:#2a78d6} .s2{stroke:#eb6834} .s3{stroke:#1baf7a} .s4{stroke:#eda100}
  .f1{fill:#2a78d6} .f2{fill:#eb6834} .f3{fill:#1baf7a}
  .ln{stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .dash{stroke-width:1.3;fill:none;stroke-dasharray:5 3}
  @media (prefers-color-scheme: dark){
    .lab{fill:#b6b4ab} .hd{fill:#eceae3} .ax{stroke:#85837b} .gd{stroke:#33312e}
    .s1{stroke:#3987e5} .s2{stroke:#d95926} .s3{stroke:#199e70} .s4{stroke:#c98500}
    .f1{fill:#3987e5} .f2{fill:#d95926} .f3{fill:#199e70}
  }
</style>
<style>.foot{fill:#57564f}.proj{stroke-width:1.2;stroke-dasharray:3 3;fill:none}.big{font-size:12.5px;fill:#1a1a19;font-weight:500}@media (prefers-color-scheme: dark){.foot{fill:#b6b4ab}.big{fill:#eceae3}}</style>
