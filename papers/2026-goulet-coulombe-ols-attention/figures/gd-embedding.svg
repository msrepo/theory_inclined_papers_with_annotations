<text class="lab" x="54.0" y="187.8" text-anchor="end">-2</text>
<path class="gd" d="M60.0 132.7H840.0"/>
<text class="lab" x="54.0" y="136.7" text-anchor="end">-1</text>
<path class="gd" d="M60.0 81.6H840.0"/>
<text class="lab" x="54.0" y="85.6" text-anchor="end">0</text>
