<text class="lab" x="15" y="300">Eigenvectors U = [u1 u2] of XᵀX are the</text>
<text class="lab" x="15" y="314">tilted axes the cloud is stretched along;</text>
<text class="lab" x="15" y="328">λ₁, λ₂ say how stretched (λ ∝ spread²).</text>
<text class="lab" x="315" y="300">Uᵀ only re-expresses each point in those</text>
<text class="lab" x="315" y="314">axes. Nothing is stretched yet; xᵢ·xⱼ is</text>
<text class="lab" x="315" y="328">unchanged by a rotation.</text>
<text class="lab" x="615" y="300">Λ^(-1/2) shrinks the long axis and grows the</text>
<text class="lab" x="615" y="314">short one until both have the same spread.</text>
<text class="lab" x="615" y="328">Now the plain dot product is a fair similarity.</text>
<text class="hd" x="20" y="366">xⱼᵀ (XᵀX)⁻¹ xᵢ  =  xⱼᵀ U Λ⁻¹ Uᵀ xᵢ  =  (Λ^(-1/2) Uᵀ xⱼ) · (Λ^(-1/2) Uᵀ xᵢ)  =  dot product in panel 3</text>
