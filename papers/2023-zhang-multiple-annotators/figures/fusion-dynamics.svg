<title>Dice and trace during training for four trace weights</title>
<desc>Two line charts over 8000 training steps for four trace weights, each started with the paper's warm-up. lambda 0.0: best Dice 0.79 at step 100, final Dice 0.79; lambda 0.3: best Dice 0.79 at step 100, final Dice 0.79; lambda 0.55: best Dice 0.96 at step 2300, final Dice 0.00; lambda 0.7: best Dice 0.96 at step 1400, final Dice 0.00. Reference lines: majority vote 0.786, weighted vote with the true confusion matrices 0.974. The right panel shows the summed trace, which falls to 0 when the labels swap.</desc>
