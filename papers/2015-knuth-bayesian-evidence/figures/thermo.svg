<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Thermodynamic integration</title>
<desc>A rising curve of the tempered average of the log-likelihood against inverse temperature beta from 0 to 1, with the area between the curve and zero shaded and approximated by eight rectangles.</desc>
<style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
