<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Spectrum and sparsest m-partition of a near-disconnected augmentation graph</title>
<desc>Left: the twelve largest eigenvalues of the normalised adjacency matrix of a graph with three nearly disconnected classes, each split into two weakly connected sub-graphs. Three eigenvalues sit at essentially one, three more at 0.84, and the rest drop to a bulk near 0.21. Right: the conductance of the natural m-way partition on a logarithmic scale, which stays at 0.005 up to m equals three, jumps to 0.083 once a class must be split, and jumps again to 0.43 once a sub-graph itself must be broken.</desc>
<style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
  .lab{font-size:12px;fill:#57564f} .hd{font-size:13px;font-weight:500;fill:#1a1a19}
  .ax{stroke:#c3c2b7;stroke-width:0.5;fill:none}
  .gd{stroke:#e2e1da;stroke-width:0.5;fill:none;stroke-dasharray:4 4}
  .mk{fill:#2f6fb5;stroke:#2f6fb5}
  .ln{fill:none;stroke:#2f6fb5;stroke-width:1.8}
  .mk2{fill:none;stroke:#8a8880;stroke-width:1.2}
  @media (prefers-color-scheme: dark){
    .lab{fill:#b6b4ab} .hd{fill:#eceae3}
    .ax{stroke:#4a4844} .gd{stroke:#33312e}
    .mk{fill:#7fb2e8;stroke:#7fb2e8} .mk2{stroke:#85837b} .ln{stroke:#7fb2e8}
  }
</style>
<line x1="62" y1="230" x2="402" y2="230" class="ax"/>
<line x1="62" y1="46" x2="62" y2="230" class="ax"/>
<line x1="62" y1="46.0" x2="402" y2="46.0" class="gd"/>
