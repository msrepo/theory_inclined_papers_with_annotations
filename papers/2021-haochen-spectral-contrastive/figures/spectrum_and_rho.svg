<text class="lab" x="528" y="247" text-anchor="middle">2</text>
<text class="lab" x="741" y="247" text-anchor="middle">6</text>
<text class="lab" x="848" y="247" text-anchor="middle">8</text>
<text class="hd" x="522" y="22">Sparsest m-partition grows in steps</text>
<text class="lab" x="531" y="199">cut between classes</text>
<text class="lab" x="640" y="109">split a class</text>
