<text class="lab" x="54" y="50" text-anchor="end">1.0</text>
<text class="lab" x="54" y="80" text-anchor="end">0.84</text>
<text class="lab" x="54" y="195" text-anchor="end">0.21</text>
<text class="lab" x="62" y="247" text-anchor="middle">1</text>
<text class="lab" x="217" y="247" text-anchor="middle">6</text>
