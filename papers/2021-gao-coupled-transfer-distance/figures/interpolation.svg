  .dash{stroke-dasharray:5 3} .dot{stroke-dasharray:1.5 3}
  .shade{fill:#8a8880;opacity:.16} .shader{fill:#b42318;opacity:.12}
  .cell{stroke:#ffffff;stroke-width:1}
