<svg viewBox="0 0 620 330" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Max versus EMD: finite for every size cap, growing with it</title>
<desc>Chart of the worst ratio of the change in the max to the EMD, for multisets of size at most M, M from 1 to 6, in d = 2. Search results (green dots) and the paper's witness (yellow squares) both sit on the line ratio = M, below the proved upper bound sqrt(d) times M. The ratio is finite for every M and grows linearly with M, so the max is Lipschitz with respect to EMD for bounded sizes, but not uniformly in M.</desc>
