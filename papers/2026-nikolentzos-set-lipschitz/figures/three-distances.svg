<svg viewBox="0 0 920 330" xmlns="http://www.w3.org/2000/svg" role="img">
<title>One pair of multisets, three distances</title>
<desc>Three panels comparing X = {0, 2} (blue, top line) with Y = {0, 2, 2} (orange, bottom line). EMD: X has mass 1/2 at 0 and 2, Y has mass 1/3 at 0 and 2/3 at 2; the cheapest plan moves 1/6 of mass from 0 to 2 at distance 2, costing 1/3. Hausdorff: every point in either set has a copy in the other, so it is 0. Matching: X is padded with a phantom zero; two pairs match at cost 0 and the spare 2 in Y is matched to the phantom zero at cost 2. Below: the mean moves from 1 to 4/3, by exactly the EMD; the sum from 2 to 4, by exactly the matching distance; the max stays at 2, matching the Hausdorff distance of 0.</desc>
<style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
  .lab{font-size:11px;fill:#57564f} .hd{font-size:13px;font-weight:500;fill:#1a1a19}
  .sm{font-size:10.5px;fill:#57564f} .v{font-size:11px;fill:#1a1a19}
  .ax{stroke:#8a8880;stroke-width:0.9;fill:none} .gd{stroke:#e2e1da;stroke-width:0.6;fill:none}
  .box{fill:none;stroke:#c9c7bf;stroke-width:1}
  .s1{stroke:#2a78d6} .s2{stroke:#eb6834} .s3{stroke:#1baf7a} .s4{stroke:#eda100}
  .f1{fill:#2a78d6} .f2{fill:#eb6834} .f3{fill:#1baf7a} .f4{fill:#eda100}
  .ln{stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .dash{stroke-width:1.3;fill:none;stroke-dasharray:5 3}
  .arr{stroke-width:1.6;fill:none}
  .ring{stroke:#fdfdfc;stroke-width:1.5}
  .ph{fill:none;stroke:#8a8880;stroke-width:1.2;stroke-dasharray:2 2}
  @media (prefers-color-scheme: dark){
    .lab,.sm{fill:#b6b4ab} .hd,.v{fill:#eceae3} .ax{stroke:#85837b} .gd{stroke:#33312e} .box{stroke:#4a4844}
    .s1{stroke:#3987e5} .s2{stroke:#d95926} .s3{stroke:#199e70} .s4{stroke:#c98500}
    .f1{fill:#3987e5} .f2{fill:#d95926} .f3{fill:#199e70} .f4{fill:#c98500}
    .ring{stroke:#161615} .ph{stroke:#85837b}
  }
</style>
<text class="hd" x="20.0" y="26">EMD = 1/3</text>
<text class="sm" x="20.0" y="44">move 1/6 of mass from 0 to 2, over distance 2</text>
<line class="ax" x1="35.0" y1="120" x2="295.0" y2="120"/>
<line class="ax" x1="35.0" y1="205" x2="295.0" y2="205"/>
<text class="lab" x="16.0" y="124">X</text>
<text class="lab" x="16.0" y="209">Y</text>
<text class="sm" x="57.0" y="243">0</text>
<line class="gd" x1="60.0" y1="90" x2="60.0" y2="229"/>
<text class="sm" x="157.0" y="243">1</text>
<line class="gd" x1="160.0" y1="90" x2="160.0" y2="229"/>
<text class="sm" x="257.0" y="243">2</text>
<line class="gd" x1="260.0" y1="90" x2="260.0" y2="229"/>
<rect class="f1" x="51.0" y="90" width="18" height="30" opacity=".85"/>
<rect class="f1" x="251.0" y="90" width="18" height="30" opacity=".85"/>
<rect class="f2" x="51.0" y="185" width="18" height="20" opacity=".85"/>
<rect class="f2" x="251.0" y="165" width="18" height="40" opacity=".85"/>
<text class="sm" x="72.0" y="102">1/2</text>
<text class="sm" x="272.0" y="102">1/2</text>
<text class="sm" x="72.0" y="199">1/3</text>
<text class="sm" x="272.0" y="199">2/3</text>
<line class="arr s3" x1="60.0" y1="124" x2="60.0" y2="181"/>
<text class="sm" x="26.0" y="156.5">1/3</text>
<line class="arr s3" x1="260.0" y1="124" x2="260.0" y2="161"/>
<text class="sm" x="266.0" y="156.5">1/2</text>
<path class="arr s4" d="M66.0,126 C140.0,160 220.0,135 254.0,161"/>
<text class="sm" x="150.0" y="156">1/6 × 2</text>
<text class="hd" x="326.6666666666667" y="26">Hausdorff = 0</text>
<text class="sm" x="326.6666666666667" y="44">every point has a twin at distance 0</text>
<line class="ax" x1="341.6666666666667" y1="120" x2="601.6666666666667" y2="120"/>
<line class="ax" x1="341.6666666666667" y1="205" x2="601.6666666666667" y2="205"/>
<text class="lab" x="322.6666666666667" y="124">X</text>
<text class="lab" x="322.6666666666667" y="209">Y</text>
<text class="sm" x="363.6666666666667" y="243">0</text>
<line class="gd" x1="366.6666666666667" y1="90" x2="366.6666666666667" y2="229"/>
<text class="sm" x="463.6666666666667" y="243">1</text>
<line class="gd" x1="466.6666666666667" y1="90" x2="466.6666666666667" y2="229"/>
<text class="sm" x="563.6666666666667" y="243">2</text>
<line class="gd" x1="566.6666666666667" y1="90" x2="566.6666666666667" y2="229"/>
<circle class="f1 ring" cx="366.6666666666667" cy="112" r="6"/>
<circle class="f1 ring" cx="566.6666666666667" cy="112" r="6"/>
<circle class="f2 ring" cx="366.6666666666667" cy="197" r="6"/>
<circle class="f2 ring" cx="559.6666666666667" cy="197" r="6"/>
<circle class="f2 ring" cx="573.6666666666667" cy="197" r="6"/>
<line class="arr s3" x1="366.6666666666667" y1="120" x2="366.6666666666667" y2="189"/>
<line class="arr s3" x1="566.6666666666667" y1="120" x2="559.6666666666667" y2="189"/>
<line class="arr s3" x1="566.6666666666667" y1="120" x2="573.6666666666667" y2="189"/>
<text class="hd" x="633.3333333333334" y="26">matching = 2</text>
<text class="sm" x="633.3333333333334" y="44">pad X with a phantom 0; the spare 2 pays |2 − 0|</text>
<line class="ax" x1="648.3333333333334" y1="120" x2="908.3333333333334" y2="120"/>
<line class="ax" x1="648.3333333333334" y1="205" x2="908.3333333333334" y2="205"/>
<text class="lab" x="629.3333333333334" y="124">X</text>
<text class="lab" x="629.3333333333334" y="209">Y</text>
<text class="sm" x="670.3333333333334" y="243">0</text>
<line class="gd" x1="673.3333333333334" y1="90" x2="673.3333333333334" y2="229"/>
<text class="sm" x="770.3333333333334" y="243">1</text>
<line class="gd" x1="773.3333333333334" y1="90" x2="773.3333333333334" y2="229"/>
<text class="sm" x="870.3333333333334" y="243">2</text>
<line class="gd" x1="873.3333333333334" y1="90" x2="873.3333333333334" y2="229"/>
<circle class="f1 ring" cx="673.3333333333334" cy="112" r="6"/>
<circle class="f1 ring" cx="873.3333333333334" cy="112" r="6"/>
<circle class="f2 ring" cx="673.3333333333334" cy="197" r="6"/>
<circle class="f2 ring" cx="866.3333333333334" cy="197" r="6"/>
<circle class="f2 ring" cx="880.3333333333334" cy="197" r="6"/>
<circle class="ph" cx="687.3333333333334" cy="112" r="6"/>
<text class="sm" x="681.3333333333334" y="98">phantom 0</text>
<line class="arr s3" x1="673.3333333333334" y1="120" x2="673.3333333333334" y2="189"/>
<line class="arr s3" x1="873.3333333333334" y1="120" x2="866.3333333333334" y2="189"/>
<line class="arr s4" x1="687.3333333333334" y1="120" x2="880.3333333333334" y2="189"/>
<text class="sm" x="783.3333333333334" y="166.5">cost 2</text>
<text class="v" x="20.0" y="300"><tspan font-weight="500">mean</tspan>: 1 → 4/3</text>
<text class="sm" x="20.0" y="316">moves 1/3 = EMD</text>
<text class="v" x="326.6666666666667" y="300"><tspan font-weight="500">sum</tspan>: 2 → 4</text>
<text class="sm" x="326.6666666666667" y="316">moves 2 = matching</text>
<text class="v" x="633.3333333333334" y="300"><tspan font-weight="500">max</tspan>: 2 → 2</text>
<text class="sm" x="633.3333333333334" y="316">moves 0 = Hausdorff</text>
</svg>
