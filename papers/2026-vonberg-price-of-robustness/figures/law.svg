<svg viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The law of robustness for classification</title>
<desc>Left: the Corollary 6 ceiling on the class stability of any classifier that fits below the noise level, against parameters per nd on log axes, with K = 1, eps = 0.1, c = 1. The ceiling rises as the square root of p/(nd) above a floor that depends on d. Markers show p = n for MNIST and CIFAR-10, and bars show the range of the paper's MLPs: the CIFAR-10 models stay below 0.24 nd; only the widest MNIST model passes nd. Right: the toy experiment of rf_margin_toy.py. Mean distance to the boundary of an interpolating random-features classifier against p/n, for d = 5, 20, 50: the minimum is at p = n and it recovers as p grows.</desc>
