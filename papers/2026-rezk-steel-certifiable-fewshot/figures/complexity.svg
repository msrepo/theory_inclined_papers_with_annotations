<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Why a finite hypothesis class certifies where a continuous one cannot</title>
<desc>Complexity term against support set size on log axes. The continuous-parameter bound with one thousand parameters stays above one until about five hundred examples, so it is vacuous throughout the few-shot regime. The finite-class bound over twenty thousand sampled adapters is below one at ten examples and about 0.28 at eighty examples.</desc>
