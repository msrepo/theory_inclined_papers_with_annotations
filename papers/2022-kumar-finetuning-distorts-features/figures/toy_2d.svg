<svg viewBox="0 0 780 330" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Two-dimensional toy: fine-tuning rotates the feature direction only along the training axis</title>
<desc>The training data lies on the horizontal axis. The pretrained feature direction B0 is tilted from the true direction. Linear probing rescales B0 so the horizontal coordinate is right and keeps the vertical coordinate of B0. Fine-tuning instead slides the feature direction horizontally, so the vertical coordinate of its predictor is further from the truth.</desc>
<style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
  .lab{font-size:12px;fill:#57564f} .hd{font-size:13px;font-weight:500;fill:#1a1a19}
  .ax{stroke:#c3c2b7;stroke-width:0.6;fill:none}
  .gd{stroke:#e2e1da;stroke-width:0.5;fill:none;stroke-dasharray:4 4}
  .a{fill:none;stroke:#2f6fb5;stroke-width:2} .b{fill:none;stroke:#c2642a;stroke-width:2}
  .g{fill:none;stroke:#2a8a5c;stroke-width:2} .k{fill:none;stroke:#1a1a19;stroke-width:1.4;stroke-dasharray:5 3}
  .ia{fill:#2f6fb5} .ib{fill:#c2642a} .ig{fill:#2a8a5c} .ik{fill:#1a1a19}
  .vec{stroke-width:2.2;fill:none}
  @media (prefers-color-scheme: dark){
    .lab{fill:#b6b4ab} .hd{fill:#eceae3} .ax{stroke:#4a4844} .gd{stroke:#33312e}
    .a{stroke:#7fb2e8} .b{stroke:#e0955c} .g{stroke:#5fcf96} .k{stroke:#eceae3}
    .ia{fill:#7fb2e8} .ib{fill:#e0955c} .ig{fill:#5fcf96} .ik{fill:#eceae3}
  }
</style>
<text class="hd" x="30.0" y="30">(a) linear probing</text>
<line x1="50.0" y1="250.0" x2="340.0" y2="250.0" class="ax"/>
<line x1="90.0" y1="270.0" x2="90.0" y2="40.0" class="ax"/>
<line x1="90.0" y1="250.0" x2="320.0" y2="250.0" stroke-width="5" class="ax" style="stroke:#2a8a5c;opacity:.5"/>
<text class="lab" x="240.0" y="268.0">training data (x-axis)</text>
<line x1="90.0" y1="250.0" x2="167.1" y2="158.1" class="vec k"/><circle cx="167.1" cy="158.1" r="3.5" class="ik"/><text class="lab" x="173.1" y="154.1">B0</text>
<line x1="90.0" y1="250.0" x2="259.7" y2="80.3" class="vec g"/><circle cx="259.7" cy="80.3" r="3.5" class="ig"/><text class="lab" x="265.7" y="96.3">w*</text>
<line x1="90.0" y1="250.0" x2="259.7" y2="47.8" class="vec a"/><circle cx="259.7" cy="47.8" r="3.5" class="ia"/><text class="lab" x="219.7" y="41.8">w_lp</text>
<line x1="259.7" y1="250.0" x2="259.7" y2="41.8" class="gd"/>
<line x1="273.7" y1="80.3" x2="273.7" y2="47.8" stroke="#b03030" stroke-width="2"/>
<text class="lab" x="279.7" y="68.0">error 0.27</text>
<text class="hd" x="390.0" y="30">(b) fine-tuning</text>
<line x1="410.0" y1="250.0" x2="700.0" y2="250.0" class="ax"/>
<line x1="450.0" y1="270.0" x2="450.0" y2="40.0" class="ax"/>
<line x1="450.0" y1="250.0" x2="680.0" y2="250.0" stroke-width="5" class="ax" style="stroke:#2a8a5c;opacity:.5"/>
<text class="lab" x="600.0" y="268.0">training data (x-axis)</text>
<line x1="450.0" y1="250.0" x2="527.1" y2="158.1" class="k"/><text class="lab" x="533.1" y="154.1">B0</text>
<line x1="450.0" y1="250.0" x2="551.7" y2="186.3" class="vec b"/><circle cx="551.7" cy="186.3" r="3.5" class="ib"/><text class="lab" x="557.7" y="182.3">B_ft (rotated)</text>
<line x1="450.0" y1="250.0" x2="619.7" y2="80.3" class="vec g"/><circle cx="619.7" cy="80.3" r="3.5" class="ig"/><text class="lab" x="625.7" y="74.3">w*</text>
<line x1="450.0" y1="250.0" x2="619.7" y2="143.8" class="vec b"/><circle cx="619.7" cy="143.8" r="3.5" class="ib"/><text class="lab" x="625.7" y="159.8">w_ft</text>
<line x1="619.7" y1="250.0" x2="619.7" y2="74.3" class="gd"/>
<line x1="633.7" y1="80.3" x2="633.7" y2="143.8" stroke="#b03030" stroke-width="2"/>
<text class="lab" x="639.7" y="116.0">error 0.53</text>
</svg>