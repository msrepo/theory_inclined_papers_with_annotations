<svg viewBox="0 0 780 330" xmlns="http://www.w3.org/2000/svg" role="img">
<title>OOD error of linear probing and the best fine-tuning iterate against feature quality</title>
<desc>Median over twenty random problems, log-log. As the pretrained features approach the truth the linear-probing error falls like the square of the distance, while the best fine-tuning error over the whole path falls much more slowly or stalls.</desc>
<style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
  .lab{font-size:12px;fill:#57564f} .hd{font-size:13px;font-weight:500;fill:#1a1a19}
  .ax{stroke:#c3c2b7;stroke-width:0.6;fill:none}
  .gd{stroke:#e2e1da;stroke-width:0.5;fill:none;stroke-dasharray:4 4}
  .a{fill:none;stroke:#2f6fb5;stroke-width:2} .b{fill:none;stroke:#c2642a;stroke-width:2}
  .g{fill:none;stroke:#2a8a5c;stroke-width:2} .k{fill:none;stroke:#1a1a19;stroke-width:1.4;stroke-dasharray:5 3}
  .ia{fill:#2f6fb5} .ib{fill:#c2642a} .ig{fill:#2a8a5c} .ik{fill:#1a1a19}
  .vec{stroke-width:2.2;fill:none}
  @media (prefers-color-scheme: dark){
    .lab{fill:#b6b4ab} .hd{fill:#eceae3} .ax{stroke:#4a4844} .gd{stroke:#33312e}
    .a{stroke:#7fb2e8} .b{stroke:#e0955c} .g{stroke:#5fcf96} .k{stroke:#eceae3}
    .ia{fill:#7fb2e8} .ib{fill:#e0955c} .ig{fill:#5fcf96} .ik{fill:#eceae3}
  }
</style>
<text class="hd" x="70" y="24">Median OOD error vs. pretrained-feature error eps (median of 10 random problems)</text>
<line x1="70" y1="280.0" x2="760" y2="280.0" class="gd"/>
<text class="lab" x="62" y="284.0" text-anchor="end">1e-6</text>
<line x1="70" y1="240.0" x2="760" y2="240.0" class="gd"/>
<text class="lab" x="62" y="244.0" text-anchor="end">1e-5</text>
<line x1="70" y1="200.0" x2="760" y2="200.0" class="gd"/>
<text class="lab" x="62" y="204.0" text-anchor="end">1e-4</text>
<line x1="70" y1="160.0" x2="760" y2="160.0" class="gd"/>
<text class="lab" x="62" y="164.0" text-anchor="end">1e-3</text>
<line x1="70" y1="120.0" x2="760" y2="120.0" class="gd"/>
<text class="lab" x="62" y="124.0" text-anchor="end">1e-2</text>
<line x1="70" y1="80.0" x2="760" y2="80.0" class="gd"/>
<text class="lab" x="62" y="84.0" text-anchor="end">1e-1</text>
<line x1="70" y1="40.0" x2="760" y2="40.0" class="gd"/>
<text class="lab" x="62" y="44.0" text-anchor="end">1e0</text>
<line x1="70" y1="280" x2="760" y2="280" class="ax"/>
<text class="lab" x="714.0" y="298" text-anchor="middle">0.4</text>
<text class="lab" x="575.7" y="298" text-anchor="middle">0.2</text>
<text class="lab" x="437.3" y="298" text-anchor="middle">0.1</text>
<text class="lab" x="298.9" y="298" text-anchor="middle">0.05</text>
<text class="lab" x="116.0" y="298" text-anchor="middle">0.02</text>
<text class="lab" x="415.0" y="322" text-anchor="middle">eps = ||B0 - B*||  (smaller = better features)</text>
<polyline class="a" points="714.0,74.1 575.7,96.6 437.3,120.1 298.9,143.8 116.0,175.2"/>
<circle cx="714.0" cy="74.1" r="3.5" class="ia"/>
<circle cx="575.7" cy="96.6" r="3.5" class="ia"/>
<circle cx="437.3" cy="120.1" r="3.5" class="ia"/>
<circle cx="298.9" cy="143.8" r="3.5" class="ia"/>
<circle cx="116.0" cy="175.2" r="3.5" class="ia"/>
<polyline class="b" points="714.0,54.3 575.7,56.2 437.3,56.9 298.9,57.1 116.0,57.2"/>
<circle cx="714.0" cy="54.3" r="3.5" class="ib"/>
<circle cx="575.7" cy="56.2" r="3.5" class="ib"/>
<circle cx="437.3" cy="56.9" r="3.5" class="ib"/>
<circle cx="298.9" cy="57.1" r="3.5" class="ib"/>
<circle cx="116.0" cy="57.2" r="3.5" class="ib"/>
<polyline class="g" points="714.0,83.1 575.7,106.3 437.3,129.7 298.9,153.1 116.0,184.6"/>
<circle cx="714.0" cy="83.1" r="3.5" class="ig"/>
<circle cx="575.7" cy="106.3" r="3.5" class="ig"/>
<circle cx="437.3" cy="129.7" r="3.5" class="ig"/>
<circle cx="298.9" cy="153.1" r="3.5" class="ig"/>
<circle cx="116.0" cy="184.6" r="3.5" class="ig"/>
<line x1="100" y1="210" x2="125" y2="210" class="a"/><text class="lab" x="132" y="214">linear probing</text>
<line x1="100" y1="228" x2="125" y2="228" class="b"/><text class="lab" x="132" y="232">fine-tuning, best over the path</text>
<line x1="100" y1="246" x2="125" y2="246" class="g"/><text class="lab" x="132" y="250">LP-FT</text>
</svg>