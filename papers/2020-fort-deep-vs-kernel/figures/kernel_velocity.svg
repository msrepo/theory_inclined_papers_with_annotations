<svg viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The neural tangent kernel moves fast early, then settles to a slow constant drift</title>
<desc>Left: kernel velocity per epoch on a logarithmic scale for three learning rates at width
256. All three start high, fall by one to two orders of magnitude within the first few epochs,
then flatten to a small non-zero value. Right: cumulative kernel distance from initialisation as
a share of the final distance, for three widths at learning rate 0.02; between forty and ninety
five percent of the total motion has already happened by epoch three, shaded.</desc>
<style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
  .lab{font-size:12px;fill:var(--text-secondary)} .hd{font-size:13px;font-weight:500;fill:var(--text-primary)}
  .ax{stroke:var(--text-muted);stroke-width:0.5;fill:none}
  .gd{stroke:var(--border);stroke-width:0.5;fill:none;stroke-dasharray:4 4}
  .s0{fill:none;stroke:#2f6fb5;stroke-width:2}
  .s1{fill:none;stroke:#c2642a;stroke-width:1.8;stroke-dasharray:7 3}
  .s2{fill:none;stroke:#3f8f6d;stroke-width:1.8;stroke-dasharray:2 2.5}
  .band{fill:var(--text-muted);opacity:0.10}
</style>
