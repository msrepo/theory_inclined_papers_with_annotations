0</text><text class="lab" x="378.0" y="252" text-anchor="middle">30</text><text class="hd" x="68" y="22">Kernel velocity collapses, then plateaus</text><text class="lab" x="228" y="270" text-anchor="middle">epoch  (width 256)</text><text class="lab" x="105" y="60">first 3 epochs</text><line x1="255" y1="64" x2="281" y2="64" class="s0"/><text class="lab" x="287" y="68">lr = 0.08</text><line x1="255" y1="82" x2="281" y2="82" class="s1"/><text class="lab" x="287" y="86">lr = 0.02</text><line x1="255" y1="100" x2="281" y2="100" class="s2"/><text class="lab" x="287" y="104">lr = 0.002</text><rect x="470" y="46" width="20.7" height="190" class="band"/><line x1="470" y1="188.5" x2="770" y2="188.5" class="gd"/><text class="lab" x="463" y="192.5" text-anchor="end">25%</text><line x1="470" y1="141.0" x2="770" y2="141.0" class="gd"/><text class="lab" x="463" y="145.0" text-anchor="end">50%</text><line x1="470" y1="93.5" x2="770" y2="93.5" class="gd"/><text class="lab" x="463" y="97.5" text-anchor="end">75%</text><line x1="470" y1="46.0" x2="770" y2="46.0" class="gd"/><text class="lab" x="463" y="50.0" text-anchor="end">100%</text><polyline points="470.0,48.1 480.3,50.5 490.7,54.5 501.0,53.7 511.4,55.7 521.7,56.3 532.1,57.4 542.4,55.9 552.8,56.2 563.1,56.1 573.4,55.3 583.8,57.7 594.1,56.2 604.5,56.3 614.8,56.6 625.2,56.0 635.5,54.0 645.9,54.8 656.2,54.0 666.6,53.5 676.9,53.0 687.2,51.9 697.6,51.1 707.9,50.4 718.3,50.1 728.6,49.0 739.0,47.4 749.3,46.4 759.7,46.6 770.0,46.0" class="s0"/><polyline points="470.0,175.7 480.3,156.1 490.7,157.1 501.0,147.7 511.4,139.2 521.7,134.8 532.1,138.0 542.4,137.1 552.8,126.2 563.1,120.2 573.4,111.4 583.8,111.3 594.1,94.0 604.5,83.3 614.8,77.7 625.2,96.8 635.5,71.9 645.9,63.9 656.2,81.2 666.6,81.5 676.9,79.5 687.2,57.3 697.6,70.7 707.9,60.8 718.3,62.5 728.6,58.1 739.0,53.4 749.3,52.7 759.7,54.4 770.0,46.0" class="s1"/><polyline points="470.0,177.3 480.3,171.1 490.7,151.2 501.0,149.3 511.4,139.3 521.7,125.9 532.1,112.3 542.4,102.0 552.8,94.3 563.