<svg viewBox="0 0 920 340" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Figure 2 re-read</title>
<desc>Scatter plots of the 48 converged off-diagonal fine-tuning pairs printed in Figure 2 (the MNIST-target row, whose epochs are below 1, is left out as in the paper's own scatter). Left: log2 epochs against the static distance, r = 0.64. Right: both centred within each target row, r = 0.61, so the distance predicts which source is faster for a fixed target, not only which targets are hard. Colours group the targets into CIFAR (cifar10, cifar100, natural, artificial), Fashion-MNIST (fashion, ifashion) and Letters.</desc>
