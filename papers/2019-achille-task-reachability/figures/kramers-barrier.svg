<svg viewBox="0 0 920 330" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Escape time follows the barrier</title>
<desc>Left: three one-dimensional potentials with the same barrier of height 1 above the starting well at w = −1 but end wells at ΔU = +0.4, −0.5 and −1.5. Right: the exact mean first-passage time τ from −1 to +1, plotted as D ln τ against ΔU for D = 0.05 and 0.1. The dots lie on nearly flat lines near the barrier height, while eq. (16), which puts the end-to-end difference in the exponent, predicts a line of slope 1.</desc>
