<svg viewBox="0 0 920 320" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Batch size and a noise floor</title>
<desc>The exact mean time for a 100-dimensional Ornstein–Uhlenbeck process (SGD on a quadratic loss with D = 2/B) to bring the loss from 50 down to 1.5, against batch size. The time falls steeply as B grows past the point where the stationary loss k D / 2 equals the threshold, then levels off at the gradient-flow time 1.75: the shape of Figure 1 (centre), produced by a noise floor rather than a barrier.</desc>
<style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
  .lab{font-size:11px;fill:#57564f} .hd{font-size:13px;font-weight:500;fill:#1a1a19}
  .sm{font-size:10.5px;fill:#57564f} .v{font-size:11px;fill:#1a1a19}
  .ax{stroke:#8a8880;stroke-width:0.9;fill:none} .gd{stroke:#e2e1da;stroke-width:0.6;fill:none}
  .s1{stroke:#2a78d6} .s2{stroke:#eb6834} .s3{stroke:#1baf7a} .s4{stroke:#eda100} .s0{stroke:#8a8880}
  .f1{fill:#2a78d6} .f2{fill:#eb6834} .f3{fill:#1baf7a} .f4{fill:#eda100} .f0{fill:#8a8880}
  .ln{stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .dash{stroke-width:1.4;fill:none;stroke-dasharray:5 3}
  .ring{stroke:#fdfdfc;stroke-width:1.5}
  @media (prefers-color-scheme: dark){
    .lab,.sm{fill:#b6b4ab} .hd,.v{fill:#eceae3} .ax{stroke:#85837b} .gd{stroke:#33312e}
    .s1{stroke:#3987e5} .s2{stroke:#d95926} .s3{stroke:#199e70} .s4{stroke:#c98500} .s0{stroke:#85837b}
    .f1{fill:#3987e5} .f2{fill:#d95926} .f3{fill:#199e70} .f4{fill:#c98500} .f0{fill:#85837b}
    .ring{stroke:#161615}
  }
</style>
<line class="gd" x1="90" y1="255.0" x2="870" y2="255.0"/>
<text class="sm" x="84" y="258.5" text-anchor="end">0</text>
<line class="gd" x1="90" y1="202.5" x2="870" y2="202.5"/>
<text class="sm" x="84" y="206.0" text-anchor="end">1</text>
<line class="gd" x1="90" y1="150.0" x2="870" y2="150.0"/>
<text class="sm" x="84" y="153.5" text-anchor="end">2</text>
<line class="gd" x1="90" y1="97.5" x2="870" y2="97.5"/>
<text class="sm" x="84" y="101.0" text-anchor="end">3</text>
<line class="gd" x1="90" y1="45.0" x2="870" y2="45.0"/>
<text class="sm" x="84" y="48.5" text-anchor="end">4</text>
<text class="sm" x="90.0" y="270" text-anchor="middle">60</text>
<text class="sm" x="231.6" y="270" text-anchor="middle">100</text>
<text class="sm" x="423.8" y="270" text-anchor="middle">200</text>
<text class="sm" x="616.0" y="270" text-anchor="middle">400</text>
<text class="sm" x="870.0" y="270" text-anchor="middle">1000</text>
<line class="ax" x1="90" y1="255" x2="870" y2="255"/>
<line class="ax" x1="90" y1="45" x2="90" y2="255"/>
<text class="lab" x="480.0" y="287" text-anchor="middle">batch size B (log scale), D = 2/B</text>
<text class="lab" transform="translate(50,150.0) rotate(-90)" text-anchor="middle">mean time to loss ≤ 1.5</text>
<text class="hd" x="90" y="33">Quadratic loss in 100 dimensions: time to a fixed loss threshold</text>
<polyline class="ln s1" points="124.7,102.4 137.3,109.6 150.0,115.4 162.6,120.2 175.2,124.3 187.9,127.7 200.5,130.7 213.1,133.2 225.8,135.5 238.4,137.6 251.0,139.4 263.7,141.0 276.3,142.5 288.9,143.8 301.6,145.0 314.2,146.1 326.8,147.2 339.4,148.1 352.1,149.0 364.7,149.8 377.3,150.5 390.0,151.2 402.6,151.9 415.2,152.5 427.9,153.1 440.5,153.6 453.1,154.1 465.8,154.6 478.4,155.0 491.0,155.4 503.7,155.8 516.3,156.2 528.9,156.5 541.6,156.8 554.2,157.1 566.8,157.4 579.5,157.7 592.1,158.0 604.7,158.2 617.4,158.4 630.0,158.7 642.6,158.9 655.3,159.1 667.9,159.2 680.5,159.4 693.1,159.6 705.8,159.8 718.4,159.9 731.0,160.0 743.7,160.2 756.3,160.3 768.9,160.4 781.6,160.6 794.2,160.7 806.8,160.8 819.5,160.9 832.1,161.0 844.7,161.1 857.4,161.2 870.0,161.2"/>
<circle class="f1 ring" cx="132.7" cy="107.2" r="4"/>
<circle class="f1 ring" cx="169.8" cy="122.6" r="4"/>
<circle class="f1 ring" cx="231.6" cy="136.5" r="4"/>
<circle class="f1 ring" cx="344.0" cy="148.4" r="4"/>
<circle class="f1 ring" cx="423.8" cy="152.9" r="4"/>
<circle class="f1 ring" cx="536.2" cy="156.7" r="4"/>
<circle class="f1 ring" cx="616.0" cy="158.4" r="4"/>
<circle class="f1 ring" cx="870.0" cy="161.2" r="4"/>
<polyline class="dash s0" points="90.0,163.0 870.0,163.0"/>
<text class="sm" x="870.0" y="157.0" text-anchor="end">gradient flow, 1.75</text>
<line class="dash s2" x1="119.2" y1="45" x2="119.2" y2="255"/>
<text class="sm" x="125.2" y="57.0" text-anchor="start">noise floor k·D/2 = threshold</text>
</svg>
