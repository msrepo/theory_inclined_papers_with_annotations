<svg viewBox="0 0 760 462" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Two models with the same best fit but different evidence</title>
<desc>Two panels in the plane of two labels. Model A, with one weight, predicts labels along a narrow ellipse stretched along the line y2 equals 2 y1. Model B, with two weights, predicts labels in a round blob. Point P on A's line has the same best log-likelihood under both models, -1.84, but log evidence -3.15 under A against -3.78 under B. Point Q off the line has best log-likelihood -3.44 under A and -1.84 under B, and log evidence -4.48 under A against -3.78 under B.</desc>
