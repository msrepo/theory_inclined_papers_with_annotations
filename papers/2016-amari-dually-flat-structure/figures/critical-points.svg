<svg viewBox="0 0 780 430" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Orthogonality is necessary, not sufficient</title>
<desc>Left: a unit circle S in the plane with P = (0.5, 0); the closest point (1, 0) and the farthest point (-1, 0) both have the segment to P orthogonal to the circle. Right: half the squared distance along the circle has a minimum 0.125 and a maximum 1.125, two critical points.</desc>
