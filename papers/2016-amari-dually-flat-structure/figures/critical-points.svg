<text class="sm" x="60" y="400">Both marked points satisfy the projection condition (the segment to P is orthogonal to S there). One is the closest point, the other the farthest:</text>
<text class="sm" x="60" y="418">the orthogonality condition of Theorem 1.4 is necessary for a minimum, not sufficient. Theorem 1.5 adds flatness of S to repair this.</text>
