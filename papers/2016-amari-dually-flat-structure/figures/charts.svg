<svg viewBox="0 0 780 450" xmlns="http://www.w3.org/2000/svg" role="img">
<title>One pair of distributions, two straight lines</title>
<desc>Two charts of the same three-outcome probability simplex with P = (0.7, 0.2, 0.1) and Q = (0.1, 0.3, 0.6). In the logit chart the e-geodesic is a straight blue line and the m-geodesic an orange curve; in the probability triangle the roles swap. The t = 0.5 midpoints differ: p0 is 0.351 on the e-geodesic and 0.400 on the m-geodesic.</desc>
