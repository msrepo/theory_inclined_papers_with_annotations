<svg viewBox="0 0 780 460" xmlns="http://www.w3.org/2000/svg" role="img">
<title>A right triangle in a dually flat manifold</title>
<desc>P, Q, R in the three-outcome simplex drawn in the logit chart and in the probability triangle. The m-geodesic from P to Q and the e-geodesic from Q to R meet at a right angle in the Fisher metric. D(Q:P) = 1.1019, D(R:Q) = 0.1441, their sum 1.2459 equals D(R:P) = 1.2459.</desc>
