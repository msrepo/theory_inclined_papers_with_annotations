<svg viewBox="0 0 720 372" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Same visible edge, different hidden spread</title>
<desc>Tumour-cell density against distance from the seed for two simulated tumours in one dimension. A dashed horizontal line marks the visibility threshold. Both curves cross it at the same distance, so both tumours look the same size on a scan. The compact tumour (high proliferation, low diffusion) drops steeply to zero just past the visible edge. The diffuse tumour (low proliferation, high diffusion) has a long, gently falling tail that reaches much further. A bracket marks the extra hidden reach of the diffuse tumour.</desc>
<style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
  .lab{font-size:12px;fill:#57564f} .hd{font-size:13px;font-weight:500;fill:#1a1a19} .sm{font-size:11px;fill:#57564f}
  .ax{stroke:#c3c2b7;stroke-width:0.9;fill:none}
  .dif{stroke:#c2571a;stroke-width:2.2;fill:none} .dift{fill:#c2571a}
  .cmp{stroke:#2f6fb5;stroke-width:2.2;fill:none} .cmpt{fill:#2f6fb5}
  .thr{stroke:#57564f;stroke-width:1.1;stroke-dasharray:5 4}
  .br{stroke:#c2571a;stroke-width:1.2;fill:none}
  .box{fill:#f4f3ee;stroke:#c3c2b7;stroke-width:0.8}
  @media (prefers-color-scheme: dark){
    .lab,.sm{fill:#b6b4ab} .hd{fill:#eceae3} .ax{stroke:#4a4844}
    .dif,.br{stroke:#f0a070} .dift{fill:#f0a070} .cmp{stroke:#7fb2e8} .cmpt{fill:#7fb2e8}
    .thr{stroke:#b6b4ab} .box{fill:#23262b;stroke:#4a4844}
  }
</style>
<rect class="box" x="8" y="10" width="704" height="352" rx="8"/>
<text class="hd" x="22" y="34">Two tumours that look the same size on a scan</text>
<path class="ax" d="M60,66 L60,286 L660,286"/>
