<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The neural tangent kernel at two widths, before and after training</title>
<desc>Two panels plot the neural tangent kernel between a fixed input and inputs around the unit circle for a depth-four network. At width fifty the kernel varies across initialisations and inflates after two hundred gradient steps. At width four thousand the spread is small and the kernel after training lies on top of both the kernel at initialisation and the infinite-width limit.</desc>
