<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Toy loss along the straight line between two optima and along the tunnel</title>
<desc>The straight line between two optima rises to a loss of about 0.29 near one end, while the tunnel stays at zero at its optimised points and below about 0.07 between them.</desc>
