<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Final toy loss against the dimension of a random hyperplane</title>
<desc>The final loss stays large for hyperplane dimensions below ten and falls to numerically zero by fifteen, with the edge at D minus n equal to ten.</desc>
<style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
  .lab{font-size:12px;fill:#57564f} .hd{font-size:13px;font-weight:500;fill:#1a1a19}
  .ax{stroke:#c3c2b7;stroke-width:0.6;fill:none}
  .gd{stroke:#e2e1da;stroke-width:0.5;fill:none;stroke-dasharray:4 4}
  .a{fill:none;stroke:#2f6fb5;stroke-width:2} .b{fill:none;stroke:#c2642a;stroke-width:2}
  .g{fill:none;stroke:#2a8a5c;stroke-width:2} .k{fill:none;stroke:#1a1a19;stroke-width:1.2;stroke-dasharray:5 3}
  .ia{fill:#2f6fb5} .ib{fill:#c2642a} .ig{fill:#2a8a5c}
  @media (prefers-color-scheme: dark){
    .lab{fill:#b6b4ab} .hd{fill:#eceae3} .ax{stroke:#4a4844} .gd{stroke:#33312e}
    .a{stroke:#7fb2e8} .b{stroke:#e0955c} .g{stroke:#5fcf96} .k{stroke:#eceae3}
    .ia{fill:#7fb2e8} .ib{fill:#e0955c} .ig{fill:#5fcf96}
  }
</style>
<text class="hd" x="70" y="24">Optimising in a random d-dimensional hyperplane (D - n = 10)</text>
<line x1="70" y1="250.0" x2="760" y2="250.0" class="gd"/><text class="lab" x="62" y="254.0" text-anchor="end">1e-12</text>
<line x1="70" y1="199.6" x2="760" y2="199.6" class="gd"/><text class="lab" x="62" y="203.6" text-anchor="end">1e-9</text>
<line x1="70" y1="149.2" x2="760" y2="149.2" class="gd"/><text class="lab" x="62" y="153.2" text-anchor="end">1e-6</text>
<line x1="70" y1="98.8" x2="760" y2="98.8" class="gd"/><text class="lab" x="62" y="102.8" text-anchor="end">1e-3</text>
<line x1="70" y1="48.4" x2="760" y2="48.4" class="gd"/><text class="lab" x="62" y="52.4" text-anchor="end">1e0</text>
<line x1="70" y1="250" x2="760" y2="250" class="ax"/>
<text class="lab" x="70.0" y="268" text-anchor="middle">2</text>
<text class="lab" x="303.5" y="268" text-anchor="middle">5</text>
<text class="lab" x="480.1" y="268" text-anchor="middle">10</text>
<text class="lab" x="583.4" y="268" text-anchor="middle">15</text>
<text class="lab" x="760.0" y="268" text-anchor="middle">30</text>
<text class="lab" x="415.0" y="292" text-anchor="middle">hyperplane dimension d</text>
<line x1="480.1" y1="40" x2="480.1" y2="250" class="k"/><text class="lab" x="486.1" y="54">d = D - n</text>
<polyline class="a" points="70.0,53.1 303.5,55.8 423.2,65.7 453.2,72.0 480.1,88.1 504.4,112.1 526.5,98.7 583.4,244.3 760.0,250.0"/>
<circle cx="70.0" cy="53.1" r="3.5" class="ia"/>
<circle cx="303.5" cy="55.8" r="3.5" class="ia"/>
<circle cx="423.2" cy="65.7" r="3.5" class="ia"/>
<circle cx="453.2" cy="72.0" r="3.5" class="ia"/>
<circle cx="480.1" cy="88.1" r="3.5" class="ia"/>
<circle cx="504.4" cy="112.1" r="3.5" class="ia"/>
<circle cx="526.5" cy="98.7" r="3.5" class="ia"/>
<circle cx="583.4" cy="244.3" r="3.5" class="ia"/>
<circle cx="760.0" cy="250.0" r="3.5" class="ia"/>
</svg>