<title>Which short directions each tunnel point shares with the two optima</title>
<desc>Along the tunnel, the zero coordinates shared with optimum A fall from ten to one, then the zero coordinates shared with optimum B rise from zero to ten, with a stretch in the middle that matches neither.</desc>
