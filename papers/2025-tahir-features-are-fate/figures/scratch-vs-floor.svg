<text class="lab" x="526" y="80">R_lt → sin²θ (n → ∞)</text>
<text class="sub" x="500" y="120">T is the vertical gap:</text>
<text class="sub" x="500" y="136">scratch above the floor, T &gt; 0;</text>
<text class="sub" x="500" y="152">scratch below it, T &lt; 0.</text>
<text class="sub" x="500" y="176">The floor does not move with n;</text>
<text class="sub" x="500" y="192">the blue curve does.</text>
<text class="sub" x="500" y="222">Beyond γ = 1 scratch falls like σ²/(γ−1);</text>
<text class="sub" x="500" y="238">it crosses each floor and T turns negative.</text>
