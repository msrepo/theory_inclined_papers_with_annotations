<text class="sub" x="390" y="80">distance from β_t to a guess:</text>
<text class="sub" x="390" y="100">scratch: ‖β_t − 0‖ = 1</text>
<text class="sub" x="390" y="118">fine-tune: ‖β_t − β_s‖ = 2 sin(θ/2)</text>
<text class="sub" x="390" y="148">equal at θ = 60°  (2 sin 30° = 1)</text>
<text class="sub" x="390" y="182">Both are then scaled by the (1 − γ) of</text>
<text class="sub" x="390" y="200">directions the data cannot see:</text>
<text class="ink" x="390" y="226" style="font-size:13px">T_ft = (1−γ)(1 − 4 sin²(θ/2))</text>
<text class="tiny" x="390" y="244">and 1 − 4 sin²(θ/2) = 2 cos θ − 1.</text>
