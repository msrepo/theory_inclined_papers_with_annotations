<text class="lab" x="20" y="344">Without the oracle, memorising is far off the line: spending t = 693 nats saves only 117. Searching random labelings</text>
<text class="lab" x="20" y="359">stays close to it (and reaches it as t grows); that, not memorisation, is what makes S(t) ≈ N log|Y| − t true.</text>
