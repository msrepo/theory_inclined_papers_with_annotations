<svg viewBox="0 0 700 358" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Loss against beta, miniature</title>
<desc>Per-sample expected loss against beta for real and random labels in a random-features logistic regression with a Laplace post-distribution.</desc>
<style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
  .lab{font-size:11px;fill:#57564f} .hd{font-size:13px;font-weight:500;fill:#1a1a19}
  .sub{font-size:11.5px;fill:#57564f} .tiny{font-size:10px;fill:#57564f} .ink{fill:#1a1a19}
  .ax{stroke:#c3c2b7;stroke-width:0.8;fill:none} .gd{stroke:#e2e1da;stroke-width:0.6;fill:none}
  .b{stroke:#2f6fb5;stroke-width:2;fill:none} .bf{fill:#2f6fb5} .bb{fill:#2f6fb5;opacity:.28}
  .o{stroke:#c2571a;stroke-width:2;fill:none} .of{fill:#c2571a} .ob{fill:#c2571a;opacity:.28}
  .g{stroke:#0f7a5a;stroke-width:2;fill:none} .gf{fill:#0f7a5a}
  .p{stroke:#7c3aed;stroke-width:2;fill:none} .pf{fill:#7c3aed}
  .r{stroke:#b42318;stroke-width:1.6;fill:none} .rf{fill:#b42318}
  .k{stroke:#1a1a19;stroke-width:1.1;fill:none;stroke-dasharray:4 3} .k0{stroke:#1a1a19;stroke-width:1.3;fill:none}
  .dash{stroke-dasharray:5 3} .dot{stroke-dasharray:1.5 3}
  .shade{fill:#8a8880;opacity:.16} .shader{fill:#b42318;opacity:.12}
  .cell{stroke:#ffffff;stroke-width:1}
  @media (prefers-color-scheme: dark){
    .lab,.sub,.tiny{fill:#b6b4ab} .hd,.ink{fill:#eceae3} .ax{stroke:#4a4844} .gd{stroke:#33312e}
    .b{stroke:#3d8ad8} .bf{fill:#3d8ad8} .bb{fill:#3d8ad8;opacity:.36}
    .o{stroke:#d8733a} .of{fill:#d8733a} .ob{fill:#d8733a;opacity:.36}
    .g{stroke:#4cc79a} .gf{fill:#4cc79a} .p{stroke:#b48cff} .pf{fill:#b48cff}
    .r{stroke:#ff7a6b} .rf{fill:#ff7a6b}
    .k,.k0{stroke:#eceae3} .shade{fill:#b6b4ab;opacity:.16} .shader{fill:#ff7a6b;opacity:.16}
    .cell{stroke:#131417}
  }
</style>
<text class="hd" x="20" y="22">Figure 2 in miniature: loss per sample against β</text>
<text class="sub" x="20" y="38">Random-features logistic regression, n = 200, D = 400, Laplace Q, λ = 3.</text>
<line class="gd" x1="62" x2="622" y1="286.0" y2="286.0"/>
<text class="tiny" x="57" y="289.0" text-anchor="end">0</text>
<line class="gd" x1="62" x2="622" y1="231.0" y2="231.0"/>
<text class="tiny" x="57" y="234.0" text-anchor="end">0.3</text>
<line class="gd" x1="62" x2="622" y1="176.0" y2="176.0"/>
<text class="tiny" x="57" y="179.0" text-anchor="end">0.6</text>
<line class="gd" x1="62" x2="622" y1="121.0" y2="121.0"/>
<text class="tiny" x="57" y="124.0" text-anchor="end">0.9</text>
<line class="gd" x1="62" x2="622" y1="66.0" y2="66.0"/>
<text class="tiny" x="57" y="69.0" text-anchor="end">1.2</text>
<text class="tiny" x="62.0" y="299" text-anchor="middle">0.001</text>
<text class="tiny" x="174.0" y="299" text-anchor="middle">0.01</text>
<text class="tiny" x="286.0" y="299" text-anchor="middle">0.1</text>
<text class="tiny" x="398.0" y="299" text-anchor="middle">1</text>
<text class="tiny" x="510.0" y="299" text-anchor="middle">10</text>
<text class="tiny" x="622.0" y="299" text-anchor="middle">100</text>
<line class="ax" x1="62" x2="622" y1="286" y2="286"/>
<line class="ax" x1="62" x2="62" y1="66" y2="286"/>
<text class="lab" x="342.0" y="314" text-anchor="middle">β (log scale)</text>
<text class="lab" x="62" y="58">E_Q L / n (nats)</text>
<line class="k" x1="62" x2="622" y1="158.9" y2="158.9"/>
<text class="tiny" x="70.9" y="153.9" text-anchor="start">ln 2: predict ½ everywhere</text>
<polyline class="b" points="622.0,64.7 606.0,86.1 590.0,95.6 574.0,117.8 558.0,131.7 542.0,148.6 526.0,157.5 510.0,172.8 494.0,182.4 478.0,192.4 462.0,202.2 446.0,207.6 430.0,213.1 414.0,218.2 398.0,222.8 382.0,226.5 366.0,229.5 350.0,232.9 334.0,235.8 318.0,238.8 302.0,241.9 286.0,244.8 270.0,248.1 254.0,251.3 238.0,254.4 222.0,257.6 206.0,260.6 190.0,263.5 174.0,266.3 158.0,268.9 142.0,271.3 126.0,273.6 110.0,275.7 94.0,277.5 78.0,279.1 62.0,280.5"/>
<polyline class="o dash" points="622.0,38.3 606.0,56.2 590.0,68.5 574.0,82.7 558.0,95.1 542.0,109.0 526.0,116.2 510.0,125.8 494.0,135.7 478.0,144.6 462.0,151.1 446.0,156.6 430.0,163.3 414.0,167.4 398.0,172.2 382.0,176.8 366.0,181.6 350.0,185.9 334.0,190.5 318.0,195.5 302.0,200.2 286.0,205.6 270.0,210.8 254.0,216.1 238.0,221.7 222.0,227.3 206.0,232.7 190.0,238.3 174.0,243.7 158.0,248.9 142.0,254.0 126.0,258.7 110.0,263.1 94.0,267.0 78.0,270.4 62.0,273.4"/>
<line class="b" x1="90" x2="110" y1="96" y2="96"/>
<text class="lab" x="116" y="100">real labels (5% flipped)</text>
<line class="o dash" x1="90" x2="110" y1="112" y2="112"/>
<text class="lab" x="116" y="116">random labels</text>
<text class="lab" x="20" y="330">Real labels keep a low loss up to a larger β, as in the paper, but nothing is sharp: this model is convex, so the optimum</text>
<text class="lab" x="20" y="345">moves continuously. At large β both curves pass ln 2: Q is close to the wide prior and noisy logits cost more than predicting ½.</text>
</svg>
