<svg viewBox="0 0 700 352" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Figure 1 antisymmetry</title>
<desc>Measured asymmetry of each task pair in the paper's Figure 1 against the difference of fitted complexities, and the fitted complexities themselves.</desc>
<style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
