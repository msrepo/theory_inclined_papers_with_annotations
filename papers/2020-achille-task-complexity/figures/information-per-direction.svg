<text class="lab" x="116" y="94">exact: ½ [log(1+s) − s/(1+s)]  → 0 for flat directions</text>
<line class="o dash" x1="90" x2="110" y1="106" y2="106"/>
<text class="lab" x="116" y="110">λ → ∞ form: ½ log s − ½  → −∞ for flat directions</text>
<text class="tiny" x="132.0" y="231.3" text-anchor="start">a flat direction (h = 0) costs nothing</text>
<text class="lab" x="20" y="340">Summing the blue curve over the eigenvalues of H gives the information in the weights, finite for any λ.</text>
<text class="lab" x="20" y="355">Summing the orange one gives ½ log|F| + ½ k log λ² + ½ k log(N/β) − k/2: the last two terms are the theorem’s “O(1)”.</text>
