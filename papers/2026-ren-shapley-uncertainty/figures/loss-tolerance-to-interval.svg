<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>From a loss tolerance to an explanation interval</title>
<desc>Left: each dot is a trained model, placed by its empirical loss (horizontal) and the Shapley value it gives one MRI contrast (vertical). The best model found is at the far left. A dashed vertical line marks the best loss plus two epsilon; models to its left form the shaded set of plausibly optimal models, which must contain the unknown optimal model, drawn as a green dot. Right: projecting the shaded set onto the Shapley axis gives an interval from its lowest to its highest Shapley value, and the optimal model's Shapley value lies inside it. A note says the search may not find the most extreme models, which makes the interval too narrow.</desc>
<style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
  .lab{font-size:12px;fill:#57564f} .hd{font-size:13px;font-weight:500;fill:#1a1a19}
  .sm{font-size:11px;fill:#57564f}
  .ax{stroke:#c3c2b7;stroke-width:0.9;fill:none}
  .m{fill:#a9a79d} .min{fill:#2f6fb5} .mint{fill:#2f6fb5}
  .best{fill:#1a1a19} .opt{fill:#0f7a5a} .optt{fill:#0f7a5a}
  .band{fill:#2f6fb5;opacity:.10}
  .thr{stroke:#c2571a;stroke-width:1.4;stroke-dasharray:5 4} .thrt{fill:#c2571a}
  .iv{stroke:#2f6fb5;stroke-width:3;fill:none}
  .lnk{stroke:#a9a79d;stroke-width:0.8;stroke-dasharray:2 3}
  .box{fill:#f4f3ee;stroke:#c3c2b7;stroke-width:0.8}
  @media (prefers-color-scheme: dark){
    .lab,.sm{fill:#b6b4ab} .hd{fill:#eceae3} .ax{stroke:#4a4844}
    .m{fill:#6d6b64} .min,.mint{fill:#7fb2e8} .best{fill:#eceae3} .opt,.optt{fill:#4cc79a}
    .band{fill:#7fb2e8;opacity:.14} .thr{stroke:#f0a070} .thrt{fill:#f0a070}
    .iv{stroke:#7fb2e8} .lnk{stroke:#6d6b64} .box{fill:#23262b;stroke:#4a4844}
  }
</style>
<rect class="box" x="8" y="10" width="704" height="380" rx="8"/>
<text class="hd" x="22" y="34">Every model within 2ε of the best is a candidate for the optimal one; report the range of their explanations</text>
<rect class="band" x="60.0" y="60" width="108.3" height="270"/>
<path class="ax" d="M60,60 L60,330 L360,330"/>
<text class="sm" x="130" y="348">empirical loss → (worse)</text>
<text class="sm" x="46" y="290" transform="rotate(-90 46 290)">Shapley value of T2-FLAIR →</text>
<line class="thr" x1="168.3" y1="56" x2="168.3" y2="330"/>
<text class="thrt sm" x="173.3" y="70">best + 2ε</text>
