  .ax{stroke:#c3c2b7;stroke-width:0.5;fill:none}
  .gd{stroke:#e2e1da;stroke-width:0.5;fill:none;stroke-dasharray:4 4}
  .a{fill:none;stroke:#2f6fb5;stroke-width:1.9}
  .b{fill:none;stroke:#c2642a;stroke-width:1.8;stroke-dasharray:6 3}
  .c{fill:none;stroke:#1a1a19;stroke-width:1;stroke-dasharray:2 3}
  .band{fill:#2f6fb5;opacity:0.16;stroke:none}
  .vac{fill:#8a8880;opacity:0.09;stroke:none}
  .dot{fill:#2f6fb5;stroke:none}
  @media (prefers-color-scheme: dark){
    .lab{fill:#b6b4ab} .hd{fill:#eceae3} .ax{stroke:#4a4844} .gd{stroke:#33312e}
    .a{stroke:#7fb2e8} .b{stroke:#e0955c} .c{stroke:#eceae3}
    .band{fill:#7fb2e8;opacity:0.20} .vac{fill:#b6b4ab;opacity:0.10} .dot{fill:#7fb2e8}
  }
</style>
