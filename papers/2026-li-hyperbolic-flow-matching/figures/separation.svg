<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The hyperbolic advantage decays along the transport path</title>
<desc>Left: absolute geodesic separation between two class trajectories against flow time, for sources at hyperbolic radius four and targets near the origin. The hyperbolic curve starts far above the Euclidean one and the two converge. Right: the ratio of the two, which falls from about three and a half at the source to about one at the target, showing the geometric advantage vanishes near the crowded origin.</desc>
