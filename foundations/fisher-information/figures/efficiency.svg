<svg viewBox="0 0 920 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Cramér–Rao and efficiency</title>
<desc>Histograms of 40000 sample means (blue) and sample medians (orange) of 101 standard normal draws. The mean's spread matches the Cramér–Rao curve 1/(N I) exactly; the median's is about π/2 times wider, an efficiency of 2/π.</desc>
