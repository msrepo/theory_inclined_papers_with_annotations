<svg viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Underdetermined system: null space and the implicit bias of gradient descent</title>
<desc>A grid in the x1-x2 plane. A dashed orange line through the origin is the null space of a=(1,2). A solid orange line parallel to it is the solution set of x1+2x2=4. A dashed blue line from the origin along (1,2) is the row space. Green gradient-descent paths run perpendicular to the solution line: from the origin to the minimum-norm solution (0.8,1.6), and from the start (3,3) to (2,1). A text panel explains that gradient steps only move along the row space, so the null-space coordinate of the start is preserved.</desc>
<style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
  .lab{font-size:12px;fill:#57564f} .hd{font-size:13px;font-weight:500;fill:#1a1a19}
  .sm{font-size:11px;fill:#57564f} .it{font-style:italic}
  .ax{stroke:#c3c2b7;stroke-width:0.75;fill:none}
  .gd{stroke:#e2e1da;stroke-width:0.5;fill:none;stroke-dasharray:4 4}
  .cs{stroke:#2f6fb5;stroke-width:1.8;fill:none} .csf{fill:#2f6fb5} .cst{fill:#2f6fb5}
  .csl{stroke:#2f6fb5;stroke-width:1.2;fill:none;stroke-dasharray:6 4}
  .ns{stroke:#c2571a;stroke-width:1.8;fill:none} .nsf{fill:#c2571a} .nst{fill:#c2571a}
  .nsl{stroke:#c2571a;stroke-width:1.2;fill:none;stroke-dasharray:6 4}
  .pr{stroke:#0f7a5a;stroke-width:1.8;fill:none} .prf{fill:#0f7a5a} .prt{fill:#0f7a5a}
  .bb{stroke:#1a1a19;stroke-width:1.8;fill:none} .bbf{fill:#1a1a19}
  .plane{fill:#2f6fb5;opacity:.10;stroke:#2f6fb5;stroke-opacity:.5;stroke-width:0.8}
  .band{fill:#c2571a;opacity:.08}
  .box{fill:#f4f3ee;stroke:#c3c2b7;stroke-width:0.8}
  .dot{fill:#1a1a19} .drop{stroke:#8a8880;stroke-width:0.8;stroke-dasharray:2 3;fill:none}
  .ra{stroke:#57564f;stroke-width:0.9;fill:none}
  .cloud{fill:#2f6fb5;opacity:.35}
  @media (prefers-color-scheme: dark){
    .lab,.sm{fill:#b6b4ab} .hd{fill:#eceae3} .ax{stroke:#4a4844} .gd{stroke:#33312e}
    .cs,.csl{stroke:#7fb2e8} .csf,.cst{fill:#7fb2e8}
    .ns,.nsl{stroke:#f0a070} .nsf,.nst{fill:#f0a070}
    .pr{stroke:#4cc79a} .prf,.prt{fill:#4cc79a}
    .bb{stroke:#eceae3} .bbf{fill:#eceae3}
    .plane{fill:#7fb2e8;opacity:.14;stroke:#7fb2e8}
    .band{fill:#f0a070;opacity:.10}
    .box{fill:#23262b;stroke:#4a4844}
    .dot{fill:#eceae3} .drop{stroke:#85837b} .ra{stroke:#b6b4ab}
    .cloud{fill:#7fb2e8;opacity:.40}
  }
</style>
<text x="20.0" y="24.0" class="hd" text-anchor="start">Solving x₁ + 2x₂ = 4: one equation, two unknowns</text>
<line x1="66.0" y1="325.6" x2="66.0" y2="39.4" class="gd"/>
<line x1="120.0" y1="325.6" x2="120.0" y2="39.4" class="gd"/>
<line x1="174.0" y1="325.6" x2="174.0" y2="39.4" class="gd"/>
<line x1="228.0" y1="325.6" x2="228.0" y2="39.4" class="gd"/>
<line x1="282.0" y1="325.6" x2="282.0" y2="39.4" class="gd"/>
<line x1="336.0" y1="325.6" x2="336.0" y2="39.4" class="gd"/>
<line x1="390.0" y1="325.6" x2="390.0" y2="39.4" class="gd"/>
<line x1="444.0" y1="325.6" x2="444.0" y2="39.4" class="gd"/>
<line x1="55.2" y1="250.0" x2="476.4" y2="250.0" class="gd"/>
<line x1="55.2" y1="196.0" x2="476.4" y2="196.0" class="gd"/>
<line x1="55.2" y1="142.0" x2="476.4" y2="142.0" class="gd"/>
<line x1="55.2" y1="88.0" x2="476.4" y2="88.0" class="gd"/>
<line x1="55.2" y1="250.0" x2="476.4" y2="250.0" class="ax"/>
<line x1="120.0" y1="325.6" x2="120.0" y2="39.4" class="ax"/>
<line x1="55.2" y1="217.6" x2="271.2" y2="325.6" class="nsl"/>
<text x="277.2" y="329.6" class="sm nst" text-anchor="start">null space: x₁ + 2x₂ = 0</text>
<line x1="66.0" y1="115.0" x2="465.6" y2="314.8" class="ns"/>
<text x="459.6" y="304.8" class="sm nst" text-anchor="end">all solutions:</text>
<text x="459.6" y="318.8" class="sm nst" text-anchor="end">x_min + (null space)</text>
<line x1="120.0" y1="250.0" x2="214.5" y2="61.0" class="csl"/>
<text x="218.5" y="63.0" class="sm cst" text-anchor="start">row space, span(1, 2)</text>
<line x1="120.0" y1="250.0" x2="159.8" y2="170.3" class="pr"/><polygon points="163.2,163.6 162.6,172.3 156.6,169.3" class="prf"/>
<line x1="282.0" y1="88.0" x2="231.4" y2="189.3" class="pr"/><polygon points="228.0,196.0 228.6,187.3 234.6,190.3" class="prf"/>
<polyline points="170.4,167.2 166.8,174.3 159.6,170.8" class="ra"/>
<circle cx="120.0" cy="250.0" r="3" class="dot"/>
<circle cx="282.0" cy="88.0" r="3.4" class="dot"/>
<circle cx="163.2" cy="163.6" r="4" class="csf"/>
<circle cx="228.0" cy="196.0" r="4" class="prf"/>
<text x="114.0" y="266.0" class="sm" text-anchor="end">start 0</text>
<text x="290.0" y="84.0" class="lab" text-anchor="start">start x₀ = (3, 3)</text>
<text x="149.2" y="145.6" class="lab cst" text-anchor="end">x_min = A⁺b = (0.8, 1.6)</text>
<text x="238.0" y="212.0" class="lab prt" text-anchor="start">lands at (2, 1)</text>
<text x="490.0" y="60.0" class="hd" text-anchor="start">Gradient descent on ½(x₁ + 2x₂ − 4)²</text>
<text x="490.0" y="82.0" class="sm" text-anchor="start">Every gradient is a multiple of aᵀ = (1, 2), so</text>
<text x="490.0" y="99.0" class="sm" text-anchor="start">each step moves only along the row space. The</text>
<text x="490.0" y="116.0" class="sm" text-anchor="start">null-space coordinate of the iterate never changes.</text>
<text x="490.0" y="133.0" class="sm" text-anchor="start"></text>
<text x="490.0" y="150.0" class="sm" text-anchor="start">• From 0 it stays in the row space and lands on the</text>
<text x="490.0" y="167.0" class="sm" text-anchor="start">  minimum-norm solution, the pseudo-inverse A⁺b.</text>
<text x="490.0" y="184.0" class="sm" text-anchor="start">• From x₀ it keeps x₀'s null-space part, 0.6·(2, −1),</text>
<text x="490.0" y="201.0" class="sm" text-anchor="start">  and lands at A⁺b + 0.6·(2, −1) = (2, 1).</text>
<text x="490.0" y="218.0" class="sm" text-anchor="start"></text>
<text x="490.0" y="235.0" class="sm" text-anchor="start">This is the NTK statement that the component</text>
<text x="490.0" y="252.0" class="sm" text-anchor="start">Δ⁰ in the kernel's null space never moves,</text>
<text x="490.0" y="269.0" class="sm" text-anchor="start">in two dimensions.</text>
</svg>
