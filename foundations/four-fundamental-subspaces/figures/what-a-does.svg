<svg viewBox="0 0 720 372" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The four subspaces of a 2 by 2 singular matrix</title>
<desc>Two coordinate planes side by side for the rank-one matrix A=[[1,2],[1/2,1]]. In the input plane, a dashed blue line is the row space, spanned by (1,2), and a perpendicular dashed orange line is the null space, spanned by (2,-1). A vector x=(2.2,0.4) is split into a blue row-space part and an orange null-space part. In the output plane, a dashed blue line is the column space, spanned by (1,1/2), and a perpendicular orange line is the left null space, spanned by (-1,2). Ax lands on the column line at (3,1.5). A target b=(1,2) off the line is projected to p=(1.6,0.8), with the orange miss b-p perpendicular to the column line.</desc>
<style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
  .lab{font-size:12px;fill:#57564f} .hd{font-size:13px;font-weight:500;fill:#1a1a19}
  .sm{font-size:11px;fill:#57564f} .it{font-style:italic}
  .ax{stroke:#c3c2b7;stroke-width:0.75;fill:none}
  .gd{stroke:#e2e1da;stroke-width:0.5;fill:none;stroke-dasharray:4 4}
  .cs{stroke:#2f6fb5;stroke-width:1.8;fill:none} .csf{fill:#2f6fb5} .cst{fill:#2f6fb5}
  .csl{stroke:#2f6fb5;stroke-width:1.2;fill:none;stroke-dasharray:6 4}
  .ns{stroke:#c2571a;stroke-width:1.8;fill:none} .nsf{fill:#c2571a} .nst{fill:#c2571a}
  .nsl{stroke:#c2571a;stroke-width:1.2;fill:none;stroke-dasharray:6 4}
  .pr{stroke:#0f7a5a;stroke-width:1.8;fill:none} .prf{fill:#0f7a5a} .prt{fill:#0f7a5a}
  .bb{stroke:#1a1a19;stroke-width:1.8;fill:none} .bbf{fill:#1a1a19}
  .plane{fill:#2f6fb5;opacity:.10;stroke:#2f6fb5;stroke-opacity:.5;stroke-width:0.8}
  .band{fill:#c2571a;opacity:.08}
  .box{fill:#f4f3ee;stroke:#c3c2b7;stroke-width:0.8}
  .dot{fill:#1a1a19} .drop{stroke:#8a8880;stroke-width:0.8;stroke-dasharray:2 3;fill:none}
  .ra{stroke:#57564f;stroke-width:0.9;fill:none}
  .cloud{fill:#2f6fb5;opacity:.35}
  @media (prefers-color-scheme: dark){
    .lab,.sm{fill:#b6b4ab} .hd{fill:#eceae3} .ax{stroke:#4a4844} .gd{stroke:#33312e}
    .cs,.csl{stroke:#7fb2e8} .csf,.cst{fill:#7fb2e8}
    .ns,.nsl{stroke:#f0a070} .nsf,.nst{fill:#f0a070}
    .pr{stroke:#4cc79a} .prf,.prt{fill:#4cc79a}
    .bb{stroke:#eceae3} .bbf{fill:#eceae3}
    .plane{fill:#7fb2e8;opacity:.14;stroke:#7fb2e8}
    .band{fill:#f0a070;opacity:.10}
    .box{fill:#23262b;stroke:#4a4844}
    .dot{fill:#eceae3} .drop{stroke:#85837b} .ra{stroke:#b6b4ab}
    .cloud{fill:#7fb2e8;opacity:.40}
  }
</style>
<text x="20.0" y="24.0" class="hd" text-anchor="start">Input space ℝ² (where x lives)</text>
<text x="380.0" y="24.0" class="hd" text-anchor="start">Output space ℝ² (where Ax lives)</text>
<line x1="19.2" y1="190.0" x2="320.8" y2="190.0" class="ax"/>
<line x1="170.0" y1="325.2" x2="170.0" y2="54.8" class="ax"/>
<line x1="392.4" y1="200.0" x2="647.6" y2="200.0" class="ax"/>
<line x1="520.0" y1="314.4" x2="520.0" y2="85.6" class="ax"/>
<line x1="139.8" y1="250.5" x2="232.8" y2="64.4" class="csl"/>
<line x1="49.1" y1="129.5" x2="290.9" y2="250.5" class="nsl"/>
<text x="236.8" y="66.4" class="sm cst" text-anchor="start">row space</text>
<text x="236.8" y="80.4" class="sm cst" text-anchor="start">span(1, 2)</text>
<text x="41.1" y="103.5" class="sm nst" text-anchor="start">null space N(A)</text>
<text x="41.1" y="117.5" class="sm nst" text-anchor="start">span(2, −1): sent to 0</text>
<line x1="170.0" y1="190.0" x2="277.0" y2="170.5" class="bb"/><polygon points="284.4,169.2 277.1,173.9 275.9,167.3" class="bbf"/>
<line x1="284.4" y1="169.2" x2="201.2" y2="127.6" class="drop"/>
<line x1="284.4" y1="169.2" x2="253.2" y2="231.6" class="drop"/>
<line x1="170.0" y1="190.0" x2="197.8" y2="134.3" class="cs"/><polygon points="201.2,127.6 200.6,136.3 194.6,133.3" class="csf"/>
<line x1="170.0" y1="190.0" x2="246.5" y2="228.2" class="ns"/><polygon points="253.2,231.6 244.5,231.0 247.5,225.0" class="nsf"/>
<text x="290.4" y="173.2" class="lab" text-anchor="start">x = (2.2, 0.4)</text>
<text x="195.2" y="123.6" class="sm cst" text-anchor="end">x_row</text>
<text x="245.2" y="245.6" class="sm nst" text-anchor="end">x_null</text>
<line x1="417.7" y1="251.2" x2="634.1" y2="142.9" class="csl"/>
<line x1="543.6" y1="247.2" x2="495.4" y2="150.8" class="nsl"/>
<text x="427.7" y="273.2" class="sm cst" text-anchor="start">column space span(1, ½)</text>
<text x="551.6" y="251.2" class="sm nst" text-anchor="start">left null space N(Aᵀ)</text>
<text x="551.6" y="265.2" class="sm nst" text-anchor="start">span(−1, 2): unreachable</text>
<line x1="520.0" y1="200.0" x2="645.3" y2="137.4" class="cs"/><polygon points="652.0,134.0 646.3,140.6 643.3,134.6" class="csf"/>
<text x="616.0" y="122.0" class="lab cst" text-anchor="start">Ax = (3, 1.5)</text>
<line x1="520.0" y1="200.0" x2="560.6" y2="118.7" class="bb"/><polygon points="564.0,112.0 563.4,120.7 557.4,117.7" class="bbf"/>
<line x1="590.4" y1="164.8" x2="567.4" y2="118.7" class="ns"/><polygon points="564.0,112.0 570.6,117.7 564.6,120.7" class="nsf"/>
<polyline points="596.7,161.7 593.5,155.4 587.3,158.5" class="ra"/>
<circle cx="590.4" cy="164.8" r="2.6" class="prf"/>
<text x="556.0" y="108.0" class="lab" text-anchor="end">b = (1, 2)</text>
<text x="606.4" y="180.8" class="sm prt" text-anchor="start">closest reachable</text>
<text x="606.4" y="194.8" class="sm prt" text-anchor="start">p = (1.6, 0.8)</text>
<path d="M 318 92 C 345 70, 375 70, 402 92" class="bb"/>
<polygon points="404,94 395,91 400,85" class="bbf"/>
<text x="360.0" y="64.0" class="sm" text-anchor="middle">A = [[1, 2], [½, 1]]</text>
<text x="20.0" y="348.0" class="sm" text-anchor="start">A throws away x_null and maps x_row one-to-one onto the column space. A target b off the column line</text>
<text x="20.0" y="362.0" class="sm" text-anchor="start">cannot be hit; the closest reachable point is its projection p, and the miss b − p = (−0.6, 1.2) lies in N(Aᵀ).</text>
</svg>
