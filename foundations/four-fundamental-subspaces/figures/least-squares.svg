<svg viewBox="0 0 700 345" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Least squares as orthogonal projection onto the column space</title>
<desc>Left: in three-dimensional output space, the two columns a1=(1,1,1) and a2=(0,1,2) span a shaded plane, the column space. The target b=(1,3,2) sits off the plane. Its orthogonal projection p=(3/2,2,5/2) lies in the plane, and the residual r=b-p=(-1/2,1,-1/2) drops perpendicularly from b to the plane. Right: the same numbers as a straight-line fit through the points (0,1), (1,3), (2,2); the fitted line is y=3/2+t/2 and the three vertical residual bars are -1/2, +1, -1/2, the coordinates of r.</desc>
<style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
  .lab{font-size:12px;fill:#57564f} .hd{font-size:13px;font-weight:500;fill:#1a1a19}
  .sm{font-size:11px;fill:#57564f} .it{font-style:italic}
  .ax{stroke:#c3c2b7;stroke-width:0.75;fill:none}
  .gd{stroke:#e2e1da;stroke-width:0.5;fill:none;stroke-dasharray:4 4}
  .cs{stroke:#2f6fb5;stroke-width:1.8;fill:none} .csf{fill:#2f6fb5} .cst{fill:#2f6fb5}
  .csl{stroke:#2f6fb5;stroke-width:1.2;fill:none;stroke-dasharray:6 4}
  .ns{stroke:#c2571a;stroke-width:1.8;fill:none} .nsf{fill:#c2571a} .nst{fill:#c2571a}
  .nsl{stroke:#c2571a;stroke-width:1.2;fill:none;stroke-dasharray:6 4}
  .pr{stroke:#0f7a5a;stroke-width:1.8;fill:none} .prf{fill:#0f7a5a} .prt{fill:#0f7a5a}
  .bb{stroke:#1a1a19;stroke-width:1.8;fill:none} .bbf{fill:#1a1a19}
  .plane{fill:#2f6fb5;opacity:.10;stroke:#2f6fb5;stroke-opacity:.5;stroke-width:0.8}
  .band{fill:#c2571a;opacity:.08}
  .box{fill:#f4f3ee;stroke:#c3c2b7;stroke-width:0.8}
  .dot{fill:#1a1a19} .drop{stroke:#8a8880;stroke-width:0.8;stroke-dasharray:2 3;fill:none}
  .ra{stroke:#57564f;stroke-width:0.9;fill:none}
  .cloud{fill:#2f6fb5;opacity:.35}
  @media (prefers-color-scheme: dark){
    .lab,.sm{fill:#b6b4ab} .hd{fill:#eceae3} .ax{stroke:#4a4844} .gd{stroke:#33312e}
    .cs,.csl{stroke:#7fb2e8} .csf,.cst{fill:#7fb2e8}
    .ns,.nsl{stroke:#f0a070} .nsf,.nst{fill:#f0a070}
    .pr{stroke:#4cc79a} .prf,.prt{fill:#4cc79a}
    .bb{stroke:#eceae3} .bbf{fill:#eceae3}
    .plane{fill:#7fb2e8;opacity:.14;stroke:#7fb2e8}
    .band{fill:#f0a070;opacity:.10}
    .box{fill:#23262b;stroke:#4a4844}
    .dot{fill:#eceae3} .drop{stroke:#85837b} .ra{stroke:#b6b4ab}
    .cloud{fill:#7fb2e8;opacity:.40}
  }
</style>
<text x="20.0" y="24.0" class="hd" text-anchor="start">Least squares in the output space ℝ³</text>
<polygon points="8.2,273.8 201.5,111.0 419.4,81.7 226.1,244.5" class="plane"/>
<text x="197.5" y="81.0" class="sm cst" text-anchor="end">column space col(A)</text>
<text x="197.5" y="95.0" class="sm" text-anchor="end">every output A can make</text>
<line x1="40.0" y1="262.0" x2="123.3" y2="191.8" class="cs"/><polygon points="129.1,186.9 125.1,194.7 120.8,189.5" class="csf"/>
<line x1="40.0" y1="262.0" x2="208.3" y2="239.4" class="cs"/><polygon points="215.7,238.4 208.3,242.8 207.4,236.1" class="csf"/>
<text x="123.1" y="180.9" class="sm cst" text-anchor="end">a₁ = (1,1,1)</text>
<text x="213.7" y="254.4" class="sm cst" text-anchor="middle">a₂ = (0,1,2)</text>
<line x1="40.0" y1="262.0" x2="254.9" y2="141.3" class="pr"/><polygon points="261.5,137.6 256.1,144.4 252.8,138.6" class="prf"/>
<line x1="40.0" y1="262.0" x2="255.8" y2="73.3" class="bb"/><polygon points="261.5,68.3 257.7,76.1 253.2,71.1" class="bbf"/>
<line x1="261.5" y1="137.6" x2="261.5" y2="75.8" class="ns"/><polygon points="261.5,68.3 264.8,76.3 258.1,76.3" class="nsf"/>
<polyline points="267.6,132.4 267.6,124.4 261.5,129.6" class="ra"/>
<circle cx="40.0" cy="262.0" r="2.4" class="dot"/>
<text x="34.0" y="276.0" class="sm" text-anchor="end">0</text>
<text x="253.5" y="62.3" class="lab" text-anchor="end">b = (1, 3, 2)</text>
<text x="271.5" y="155.6" class="lab prt" text-anchor="start">p = Ax̂ = (3/2, 2, 5/2)</text>
<text x="271.5" y="101.0" class="lab nst" text-anchor="start">r = b − p</text>
<text x="271.5" y="115.0" class="sm nst" text-anchor="start">= (−½, 1, −½)</text>
<text x="20.0" y="318.0" class="sm" text-anchor="start">r is perpendicular to both columns: Aᵀr = 0, so r lies in the</text>
<text x="20.0" y="332.0" class="sm" text-anchor="start">left null space N(Aᵀ) = span(1, −2, 1), the residual space.</text>
<text x="450.0" y="24.0" class="hd" text-anchor="start">The same numbers as a line fit</text>
<line x1="446.2" y1="270.0" x2="693.2" y2="270.0" class="ax"/>
<line x1="470.0" y1="275.5" x2="470.0" y2="55.5" class="ax"/>
<line x1="465.2" y1="215.0" x2="693.2" y2="215.0" class="gd"/>
<text x="462.4" y="219.0" class="sm" text-anchor="end">1</text>
<line x1="465.2" y1="160.0" x2="693.2" y2="160.0" class="gd"/>
<text x="462.4" y="164.0" class="sm" text-anchor="end">2</text>
<line x1="465.2" y1="105.0" x2="693.2" y2="105.0" class="gd"/>
<text x="462.4" y="109.0" class="sm" text-anchor="end">3</text>
<text x="470.0" y="285.0" class="sm" text-anchor="middle">t=0</text>
<text x="565.0" y="285.0" class="sm" text-anchor="middle">t=1</text>
<text x="660.0" y="285.0" class="sm" text-anchor="middle">t=2</text>
<line x1="451.0" y1="193.0" x2="688.5" y2="124.2" class="pr"/>
<text x="688.5" y="116.2" class="sm prt" text-anchor="end">y = 3/2 + t/2</text>
<line x1="470.0" y1="187.5" x2="470.0" y2="215.0" class="ns"/>
<circle cx="470.0" cy="215.0" r="3.6" class="dot"/>
<circle cx="470.0" cy="187.5" r="2.6" class="prf"/>
<text x="477.0" y="205.2" class="sm nst" text-anchor="start">−½</text>
<line x1="565.0" y1="160.0" x2="565.0" y2="105.0" class="ns"/>
<circle cx="565.0" cy="105.0" r="3.6" class="dot"/>
<circle cx="565.0" cy="160.0" r="2.6" class="prf"/>
<text x="572.0" y="136.5" class="sm nst" text-anchor="start">+1</text>
<line x1="660.0" y1="132.5" x2="660.0" y2="160.0" class="ns"/>
<circle cx="660.0" cy="160.0" r="3.6" class="dot"/>
<circle cx="660.0" cy="132.5" r="2.6" class="prf"/>
<text x="667.0" y="150.2" class="sm nst" text-anchor="start">−½</text>
<text x="450.0" y="318.0" class="sm" text-anchor="start">Each vertical bar is one coordinate of r. The</text>
<text x="450.0" y="332.0" class="sm" text-anchor="start">left panel is this fit seen as one point in ℝ³.</text>
</svg>
