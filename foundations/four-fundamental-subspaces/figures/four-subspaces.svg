<svg viewBox="0 0 700 346" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The four fundamental subspaces</title>
<desc>Schematic. On the left, input space R^n is split into a blue row space of dimension r and an orange null space of dimension n-r, meeting at a right angle. On the right, output space R^m is split into a blue column space of dimension r and an orange left null space of dimension m-r, also at a right angle. A blue arrow labelled A carries the row space one-to-one onto the column space; a return arrow labelled pseudo-inverse carries it back. Orange arrows send the null space to zero under A and the left null space to zero under A transpose. The left null space is labelled as where residuals live.</desc>
<style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
  .lab{font-size:12px;fill:#57564f} .hd{font-size:13px;font-weight:500;fill:#1a1a19}
  .sm{font-size:11px;fill:#57564f} .it{font-style:italic}
  .ax{stroke:#c3c2b7;stroke-width:0.75;fill:none}
  .gd{stroke:#e2e1da;stroke-width:0.5;fill:none;stroke-dasharray:4 4}
  .cs{stroke:#2f6fb5;stroke-width:1.8;fill:none} .csf{fill:#2f6fb5} .cst{fill:#2f6fb5}
  .csl{stroke:#2f6fb5;stroke-width:1.2;fill:none;stroke-dasharray:6 4}
  .ns{stroke:#c2571a;stroke-width:1.8;fill:none} .nsf{fill:#c2571a} .nst{fill:#c2571a}
  .nsl{stroke:#c2571a;stroke-width:1.2;fill:none;stroke-dasharray:6 4}
  .pr{stroke:#0f7a5a;stroke-width:1.8;fill:none} .prf{fill:#0f7a5a} .prt{fill:#0f7a5a}
  .bb{stroke:#1a1a19;stroke-width:1.8;fill:none} .bbf{fill:#1a1a19}
  .plane{fill:#2f6fb5;opacity:.10;stroke:#2f6fb5;stroke-opacity:.5;stroke-width:0.8}
  .band{fill:#c2571a;opacity:.08}
  .box{fill:#f4f3ee;stroke:#c3c2b7;stroke-width:0.8}
  .dot{fill:#1a1a19} .drop{stroke:#8a8880;stroke-width:0.8;stroke-dasharray:2 3;fill:none}
  .ra{stroke:#57564f;stroke-width:0.9;fill:none}
  .cloud{fill:#2f6fb5;opacity:.35}
  @media (prefers-color-scheme: dark){
    .lab,.sm{fill:#b6b4ab} .hd{fill:#eceae3} .ax{stroke:#4a4844} .gd{stroke:#33312e}
    .cs,.csl{stroke:#7fb2e8} .csf,.cst{fill:#7fb2e8}
    .ns,.nsl{stroke:#f0a070} .nsf,.nst{fill:#f0a070}
    .pr{stroke:#4cc79a} .prf,.prt{fill:#4cc79a}
    .bb{stroke:#eceae3} .bbf{fill:#eceae3}
    .plane{fill:#7fb2e8;opacity:.14;stroke:#7fb2e8}
    .band{fill:#f0a070;opacity:.10}
    .box{fill:#23262b;stroke:#4a4844}
    .dot{fill:#eceae3} .drop{stroke:#85837b} .ra{stroke:#b6b4ab}
    .cloud{fill:#7fb2e8;opacity:.40}
  }
</style>
<text x="20.0" y="24.0" class="hd" text-anchor="start">The four fundamental subspaces of an m × n matrix A of rank r</text>
<text x="175.0" y="52.0" class="lab" text-anchor="middle">input space ℝⁿ</text>
<text x="525.0" y="52.0" class="lab" text-anchor="middle">output space ℝᵐ</text>
<g>
<rect x="60" y="80" width="150" height="110" rx="4" class="plane" transform="rotate(-8 210 190)"/>
<rect x="105" y="200" width="120" height="90" rx="4" class="band" transform="rotate(-8 210 190)"/>
<rect x="105" y="200" width="120" height="90" rx="4" transform="rotate(-8 210 190)" fill="none" class="nsl"/>
</g>
<text x="122.0" y="122.0" class="hd cst" text-anchor="start">row space</text>
<text x="122.0" y="139.0" class="sm cst" text-anchor="start">col(Aᵀ), dim r</text>
<text x="122.0" y="158.0" class="sm" text-anchor="start">what A can see</text>
<text x="140.0" y="243.0" class="hd nst" text-anchor="start">null space</text>
<text x="140.0" y="260.0" class="sm nst" text-anchor="start">N(A), dim n − r</text>
<text x="140.0" y="277.0" class="sm" text-anchor="start">invisible to A</text>
<rect x="490" y="80" width="150" height="110" rx="4" class="plane" transform="rotate(8 490 190)"/>
<rect x="475" y="200" width="130" height="90" rx="4" class="band" transform="rotate(8 490 190)"/>
<rect x="475" y="200" width="130" height="90" rx="4" transform="rotate(8 490 190)" fill="none" class="nsl"/>
<text x="515.0" y="122.0" class="hd cst" text-anchor="start">column space</text>
<text x="515.0" y="139.0" class="sm cst" text-anchor="start">col(A), dim r</text>
<text x="515.0" y="158.0" class="sm" text-anchor="start">what A can produce</text>
<text x="490.0" y="243.0" class="hd nst" text-anchor="start">left null space</text>
<text x="490.0" y="260.0" class="sm nst" text-anchor="start">N(Aᵀ), dim m − r</text>
<text x="490.0" y="277.0" class="sm" text-anchor="start">residuals live here</text>
<line x1="215.0" y1="120.0" x2="474.5" y2="120.0" class="cs"/><polygon points="482.0,120.0 474.0,123.4 474.0,116.6" class="csf"/>
<text x="350.0" y="112.0" class="sm cst" text-anchor="middle">A: one-to-one, onto</text>
<line x1="482.0" y1="150.0" x2="222.5" y2="150.0" class="cs"/><polygon points="215.0,150.0 223.0,146.6 223.0,153.4" class="csf"/>
<text x="350.0" y="168.0" class="sm cst" text-anchor="middle">A⁺ (pseudo-inverse) maps back</text>
<line x1="230.0" y1="250.0" x2="337.9" y2="214.4" class="ns"/><polygon points="345.0,212.0 338.5,217.7 336.3,211.3" class="nsf"/>
<circle cx="350.0" cy="210.0" r="4" class="dot"/>
<text x="350.0" y="200.0" class="lab" text-anchor="middle">0</text>
<text x="300.0" y="250.0" class="sm nst" text-anchor="middle">A x = 0</text>
<line x1="470.0" y1="250.0" x2="362.1" y2="214.4" class="ns"/><polygon points="355.0,212.0 363.7,211.3 361.5,217.7" class="nsf"/>
<text x="408.0" y="252.0" class="sm nst" text-anchor="middle">Aᵀ y = 0</text>
<text x="20.0" y="318.0" class="sm" text-anchor="start">Perpendicular pairs: row space ⟂ null space inside ℝⁿ, column space ⟂ left null space inside ℝᵐ.</text>
<text x="20.0" y="334.0" class="sm" text-anchor="start">Dimensions add up: r + (n − r) = n and r + (m − r) = m (rank–nullity). One SVD gives orthonormal bases for all four.</text>
</svg>
