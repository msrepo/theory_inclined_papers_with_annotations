<svg viewBox="0 0 700 350" xmlns="http://www.w3.org/2000/svg" role="img"><title>The four subspaces of the 3×2 running example</title><desc>Left: input space R^2. The row space is the whole plane (dimension 2) and the null space is only the origin. Right: output space R^3. The column space is the plane spanned by a1=(1,1,1) and a2=(0,1,2), and the residual space is the line along (1,-2,1) through the origin, perpendicular to that plane. An arrow labelled A carries the input plane one to one onto the column space plane.</desc><style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
  .hd{font-size:13px;font-weight:500;fill:#1a1a19} .sm{font-size:11px;fill:#57564f} .lab{font-size:12px;fill:#57564f}
  .ax{stroke:#c3c2b7;stroke-width:0.8;fill:none} .axf{fill:#c3c2b7}
  .cs{stroke:#2f6fb5;stroke-width:1.8;fill:none} .csf{fill:#2f6fb5} .cst{fill:#2f6fb5}
  .ns{stroke:#c2571a;stroke-width:2.4;fill:none} .nsf{fill:#c2571a} .nst{fill:#c2571a}
  .plane{fill:#2f6fb5;opacity:.12;stroke:#2f6fb5;stroke-opacity:.55;stroke-width:0.9}
  .box{fill:#f4f3ee;stroke:#c3c2b7;stroke-width:0.8}
  .ra{stroke:#57564f;stroke-width:0.9;fill:none} .ar{stroke:#57564f;stroke-width:1.3;fill:none;stroke-dasharray:5 4}
  .arf{fill:#57564f}
  @media (prefers-color-scheme: dark){
    .hd{fill:#eceae3} .sm,.lab{fill:#b6b4ab} .ax{stroke:#4a4844} .axf{fill:#4a4844}
    .cs{stroke:#7fb2e8} .csf,.cst{fill:#7fb2e8} .ns{stroke:#f0a070} .nsf,.nst{fill:#f0a070}
    .plane{fill:#7fb2e8;opacity:.16;stroke:#7fb2e8} .box{fill:#23262b;stroke:#4a4844}
    .ra{stroke:#b6b4ab} .ar{stroke:#b6b4ab} .arf{fill:#b6b4ab}
  }
</style><text x="20.0" y="24.0" class="hd" text-anchor="start">Input space ℝ²: what you feed in</text><text x="380.0" y="24.0" class="hd" text-anchor="start">Output space ℝ³: what comes out</text><polygon points="42.1,239.2 199.4,239.2 275.4,190.8 118.0,190.8" class="plane"/><line x1="80.1" y1="215.0" x2="233.8" y2="215.0" class="ax"/><polygon points="241.8,215.0 233.8,211.6 233.8,218.4" class="axf"/><line x1="109.5" y1="240.8" x2="183.7" y2="193.5" class="ax"/><polygon points="190.5,189.2 181.9,190.7 185.5,196.4" class="axf"/><text x="247.8" y="219.0" class="sm" text-anchor="start">x₂</text><text x="105.5" y="252.8" class="sm" text-anchor="end">x₁</text><circle cx="150.0" cy="215.0" r="5.5" class="nsf"/><text x="20.0" y="52.0" class="sm cst" text-anchor="start">row space row(A) = the whole plane</text><text x="20.0" y="67.0" class="sm" text-anchor="start">every input direction is “seen” (dimension 2)</text><text x="164.0" y="249.0" class="sm nst" text-anchor="start">null space N(A) = {0}</text><text x="164.0" y="264.0" class="sm" text-anchor="start">only the origin: no recipe makes 0</text><polygon points="437.8,233.0 573.8,233.0 624.2,177.0 488.2,177.0" class="plane"/><line x1="490.0" y1="263.0" x2="490.0" y2="215.0" class="ns"/><line x1="490.0" y1="215.0" x2="550.3" y2="215.0" class="cs"/><polygon points="559.3,215.0 550.3,211.2 550.3,218.8" class="csf"/><line x1="490.0" y1="215.0" x2="576.1" y2="189.3" class="cs"/><polygon points="584.7,186.7 575.0,185.7 577.2,192.9" class="csf"/><line x1="490.0" y1="215.0" x2="490.0" y2="144.0" class="ns"/><polygon points="490.0,135.0 486.2,144.0 493.8,144.0" class="nsf"/><polyline points="501.2,215.0 501.2,203.8 490.0,203.8" class="ra"/><text x="565.3" y="229.0" class="sm cst" text-anchor="start">a₁ = (1,1,1)</text><text x="590.7" y="184.7" class="sm cst" text-anchor="start">a₂ = (0,1,2)</text><text x="498.0" y="139.0" class="sm nst" text-anchor="start">(1, −2, 1)</text><text x="380.0" y="52.0" class="sm cst" text-anchor="start">column space col(A) = the plane spanned by a₁, a₂</text><text x="380.0" y="67.0" class="sm" text-anchor="start">every output A can make (dimension 2)</text><text x="380.0" y="300.0" class="sm nst" text-anchor="start">residual space N(Aᵀ) = the line along (1, −2, 1)</text><text x="380.0" y="315.0" class="sm nst" text-anchor="start">through the origin, perpendicular to the plane (dim 1)</text><text x="380.0" y="338.0" class="sm" text-anchor="start">axes turned so the plane lies flat; angles are true</text><line x1="278.0" y1="160.0" x2="344.0" y2="160.0" class="ar"/><polygon points="352.0,160.0 344.0,156.6 344.0,163.4" class="arf"/><text x="315.0" y="150.0" class="hd" text-anchor="middle">A</text><text x="315.0" y="178.0" class="sm" text-anchor="middle">plane onto plane</text></svg>
