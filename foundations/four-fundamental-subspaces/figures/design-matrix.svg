<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" role="img"><title>Where the design matrix comes from</title><desc>Left: three measurements at t=0, 1, 2 and a straight line c0 + c1 t through them, with the line heights c0, c0+c1 and c0+2c1 marked as three coloured dots. Right: the same heights as the product of the matrix with rows (1,0), (1,1), (1,2) and the vector (c0, c1). Each row of the matrix is one measurement; the first column is all ones and the second column is the t values.</desc><style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
  .hd{font-size:13px;font-weight:500;fill:#1a1a19} .sm{font-size:11px;fill:#57564f} .lab{font-size:12px;fill:#1a1a19}
  .ax{stroke:#8a8880;stroke-width:1;fill:none} .gd{stroke:#c3c2b7;stroke-width:1;stroke-dasharray:4 4;fill:none}
  .ln{stroke:#57564f;stroke-width:2;fill:none} .st{stroke:#57564f;stroke-width:1.2;fill:none}
  .c1{fill:#2f6fb5} .c2{fill:#0f7a5a} .c3{fill:#8a4fb0}
  .t1{fill:#2f6fb5} .t2{fill:#0f7a5a} .t3{fill:#8a4fb0}
  .br{stroke:#57564f;stroke-width:1.4;fill:none}
  .box{fill:#f4f3ee}
  @media (prefers-color-scheme: dark){
    .hd,.lab{fill:#eceae3} .sm{fill:#b6b4ab} .ax{stroke:#85837b} .gd{stroke:#4a4844}
    .ln,.st,.br{stroke:#b6b4ab} .c1{fill:#7fb2e8} .c2{fill:#4cc79a} .c3{fill:#b79df0}
    .t1{fill:#7fb2e8} .t2{fill:#4cc79a} .t3{fill:#b79df0} .box{fill:#23262b}
  }
</style><rect class="box" x="10" y="10" width="330" height="300" rx="8"/><text x="25" y="32" class="hd" text-anchor="start">Three measurements, one straight line</text><line class="ax" x1="55" y1="255" x2="325" y2="255"/><line class="ax" x1="55" y1="255" x2="55" y2="55"/><text x="325" y="283" class="lab" text-anchor="end">t</text><text x="62" y="62" class="sm" text-anchor="start">height</text><line class="gd" x1="100" y1="255" x2="100" y2="190"/><text x="100" y="271" class="sm" text-anchor="middle">t = 0</text><line class="gd" x1="190" y1="255" x2="190" y2="150"/><text x="190" y="271" class="sm" text-anchor="middle">t = 1</text><line class="gd" x1="280" y1="255" x2="280" y2="110"/><text x="280" y="271" class="sm" text-anchor="middle">t = 2</text><line class="ln" x1="55" y1="212.5" x2="320" y2="83.0"/><line class="st" x1="82" y1="255" x2="82" y2="190"/><text x="76" y="226.5" class="lab" text-anchor="end">c₀</text><polyline class="st" points="100,190 190,190 190,150"/><text x="196" y="174.0" class="lab" text-anchor="start">c₁</text><text x="145.0" y="204" class="sm" text-anchor="middle">one step in t</text><circle class="c1" cx="100" cy="190" r="6"/><circle class="c2" cx="190" cy="150" r="6"/><circle class="c3" cx="280" cy="110" r="6"/><text x="104" y="178" class="sm t1" text-anchor="start">c₀</text><text x="194" y="138" class="sm t2" text-anchor="start">c₀ + c₁</text><text x="276" y="98" class="sm t3" text-anchor="end">c₀ + 2c₁</text><text x="25" y="298" class="sm" text-anchor="start">line: height = c₀ + c₁ · t. c₀ is the start, c₁ the rise per step.</text><rect class="box" x="350" y="10" width="340" height="300" rx="8"/><text x="365" y="32" class="hd" text-anchor="start">The same three heights as one product A x</text><rect class="c1" x="368" y="77" width="5" height="26" rx="2"/><text x="405" y="95" class="lab" text-anchor="middle">1</text><text x="445" y="95" class="lab" text-anchor="middle">0</text><rect class="c2" x="368" y="117" width="5" height="26" rx="2"/><text x="405" y="135" class="lab" text-anchor="middle">1</text><text x="445" y="135" class="lab" text-anchor="middle">1</text><rect class="c3" x="368" y="157" width="5" height="26" rx="2"/><text x="405" y="175" class="lab" text-anchor="middle">1</text><text x="445" y="175" class="lab" text-anchor="middle">2</text><polyline class="br" points="391,73 385,73 385,191 391,191"/><polyline class="br" points="459,73 465,73 465,191 459,191"/><text x="405" y="213" class="sm" text-anchor="middle">1s</text><text x="445" y="213" class="sm" text-anchor="middle">t</text><text x="485" y="135" class="lab" text-anchor="middle">×</text><text x="520" y="107" class="lab" text-anchor="middle">c₀</text><text x="520" y="147" class="lab" text-anchor="middle">c₁</text><polyline class="br" points="506,89 500,89 500,157 506,157"/><polyline class="br" points="534,89 540,89 540,157 534,157"/><text x="560" y="135" class="lab" text-anchor="middle">=</text><text x="580" y="95" class="lab t1" text-anchor="start">c₀</text><text x="580" y="135" class="lab t2" text-anchor="start">c₀ + c₁</text><text x="580" y="175" class="lab t3" text-anchor="start">c₀ + 2c₁</text><text x="365" y="238" class="sm" text-anchor="start">One row per measurement: row i is (1, tᵢ).</text><text x="365" y="256" class="sm" text-anchor="start">Column a₁ = (1,1,1): the 1s, the intercept's share.</text><text x="365" y="274" class="sm" text-anchor="start">Column a₂ = (0,1,2): the t values, the slope's share.</text><text x="365" y="296" class="sm" text-anchor="start">Colours match the three dots on the left.</text></svg>
