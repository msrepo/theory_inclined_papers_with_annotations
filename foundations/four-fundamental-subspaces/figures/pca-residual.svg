  .plane{fill:#2f6fb5;opacity:.10;stroke:#2f6fb5;stroke-opacity:.5;stroke-width:0.8}
  .band{fill:#c2571a;opacity:.08}
  .box{fill:#f4f3ee;stroke:#c3c2b7;stroke-width:0.8}
  .dot{fill:#1a1a19} .drop{stroke:#8a8880;stroke-width:0.8;stroke-dasharray:2 3;fill:none}
  .ra{stroke:#57564f;stroke-width:0.9;fill:none}
  .cloud{fill:#2f6fb5;opacity:.35}
  @media (prefers-color-scheme: dark){
    .lab,.sm{fill:#b6b4ab} .hd{fill:#eceae3} .ax{stroke:#4a4844} .gd{stroke:#33312e}
