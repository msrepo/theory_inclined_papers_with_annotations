<text x="500.0" y="96.0" class="sm" text-anchor="start">A and B sit on the same circle, so a plain</text>
<text x="500.0" y="113.0" class="sm" text-anchor="start">distance-to-mean score cannot tell them apart.</text>
<text x="500.0" y="130.0" class="sm" text-anchor="start"></text>
<text x="500.0" y="147.0" class="sm" text-anchor="start">A lies along the data: its residual (orange bar)</text>
<text x="500.0" y="164.0" class="sm" text-anchor="start">is essentially zero. B points where the training</text>
<text x="500.0" y="181.0" class="sm" text-anchor="start">data never varies: its residual is almost its</text>
<text x="500.0" y="198.0" class="sm" text-anchor="start">whole length.</text>
<text x="500.0" y="215.0" class="sm" text-anchor="start"></text>
<text x="500.0" y="232.0" class="sm" text-anchor="start">PCA-residual OOD detectors score ‖(I − VₖVₖᵀ)(x − μ)‖.</text>
<text x="500.0" y="249.0" class="sm" text-anchor="start">MaRS keeps the residual but reweights its</text>
<text x="500.0" y="266.0" class="sm" text-anchor="start">directions by inverse variance (Mahalanobis).</text>
</svg>
