<svg viewBox="0 0 800 345" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Principal and residual subspaces for out-of-distribution scoring</title>
<desc>A cloud of 2-D training points stretched along a dashed blue line at about 28 degrees, the principal subspace. A perpendicular dashed orange line is the residual subspace. Two test points A and B lie on the same dashed circle around the mean. A lies along the data, and its orange residual bar to the principal line is almost zero. B lies nearly perpendicular to the data, and its residual bar is almost its whole distance from the mean. A text panel explains PCA-residual and Mahalanobis-residual (MaRS) scores.</desc>
