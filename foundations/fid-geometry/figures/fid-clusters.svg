<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>One Gaussian versus two clusters under FID</title>
<desc>Three panels. Panel A, real features: two separate blue clusters left and right with an empty gap between them; a dashed grey ellipse around both is the Gaussian FID fits, long along the line joining the clusters. Panel B, generated features from a single orange Gaussian blob whose mass sits mostly in the gap; its fitted dashed ellipse is the same as in panel A, so FID is zero although the samples are in the wrong place. Panel C, mode collapse: generated orange points cover only the left cluster; the fitted ellipse is small and shifted left, so FID is large and the failure is caught.</desc>
<style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
  .lab{font-size:12px;fill:#57564f} .hd{font-size:13px;font-weight:500;fill:#1a1a19}
  .sm{font-size:11px;fill:#57564f}
  .r{fill:#2f6fb5;fill-opacity:.55} .g{fill:#c2571a;fill-opacity:.55}
  .fit{fill:none;stroke:#57564f;stroke-width:1.3;stroke-dasharray:6 4}
  .ok{fill:#0f7a5a} .bad{fill:#c2571a}
  .box{fill:#f4f3ee;stroke:#c3c2b7;stroke-width:0.8}
  @media (prefers-color-scheme: dark){
    .lab,.sm{fill:#b6b4ab} .hd{fill:#eceae3}
    .r{fill:#7fb2e8} .g{fill:#f0a070} .fit{stroke:#b6b4ab}
    .ok{fill:#4cc79a} .bad{fill:#f0a070}
    .box{fill:#23262b;stroke:#4a4844}
  }
</style>
<defs>
  <g id="clL"><circle cx="0" cy="0" r="3"/><circle cx="9" cy="-6" r="3"/><circle cx="-8" cy="5" r="3"/><circle cx="4" cy="10" r="3"/><circle cx="-11" cy="-7" r="3"/><circle cx="14" cy="4" r="3"/><circle cx="-3" cy="-12" r="3"/><circle cx="-15" cy="2" r="3"/><circle cx="7" cy="-15" r="3"/><circle cx="-6" cy="15" r="3"/><circle cx="16" cy="-9" r="3"/><circle cx="2" cy="-3" r="3"/></g>
</defs>

<rect class="box" x="8" y="10" width="228" height="280" rx="8"/>
<text class="hd" x="20" y="32">A. Real: two clusters</text>
<g class="r"><use href="#clL" x="72" y="140"/><use href="#clL" x="172" y="140"/></g>
<ellipse class="fit" cx="122" cy="140" rx="92" ry="34"/>
<text class="sm" x="20" y="212">dashed: the Gaussian FID fits,</text>
<text class="sm" x="20" y="227">stretched along the gap</text>

<rect class="box" x="246" y="10" width="228" height="280" rx="8"/>
<text class="hd" x="258" y="32">B. Generated: one blob</text>
<g class="g">
  <use href="#clL" x="360" y="140"/>
  <circle cx="330" cy="135" r="3"/><circle cx="392" cy="146" r="3"/><circle cx="318" cy="150" r="3"/><circle cx="402" cy="128" r="3"/>
  <circle cx="300" cy="140" r="3"/><circle cx="420" cy="138" r="3"/><circle cx="345" cy="118" r="3"/><circle cx="378" cy="162" r="3"/>
</g>
<ellipse class="fit" cx="360" cy="140" rx="92" ry="34"/>
<text class="bad lab" x="258" y="212">same fitted Gaussian → FID ≈ 0</text>
<text class="sm" x="258" y="228">but most samples sit in the gap,</text>
<text class="sm" x="258" y="243">where no real image lives</text>

<rect class="box" x="484" y="10" width="228" height="280" rx="8"/>
<text class="hd" x="496" y="32">C. Generated: one mode only</text>
<g class="g"><use href="#clL" x="548" y="140"/></g>
<ellipse class="fit" cx="548" cy="140" rx="32" ry="28"/>
<ellipse class="fit" cx="598" cy="140" rx="92" ry="34" opacity=".35"/>
<text class="ok lab" x="496" y="212">mean shifts, spread shrinks</text>
<text class="ok lab" x="496" y="228">→ FID large, failure caught</text>
<text class="sm" x="496" y="250">faint ellipse: the real fit, for comparison</text>
</svg>
