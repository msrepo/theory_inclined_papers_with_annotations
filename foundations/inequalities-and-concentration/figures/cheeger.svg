<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Cheeger's inequality verified on 33 small graphs</title>
<desc>A log-log scatter of exact conductance against the spectral gap for thirty-three graphs
with ten to twelve vertices. Every point falls inside the band between the lower bound, half
the gap, and the upper bound, the square root of twice the gap. The points hug the lower
bound closely and sit far below the upper bound, showing the lower bound is nearly tight while
the square-root side is loose.</desc>
