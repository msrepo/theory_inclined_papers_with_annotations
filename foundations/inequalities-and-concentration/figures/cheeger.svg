  .ax{stroke:#c3c2b7;stroke-width:0.5;fill:none}
  .gd{stroke:#e2e1da;stroke-width:0.5;fill:none;stroke-dasharray:4 4}
  .mk{fill:#2f6fb5;stroke:none}
  .lo{fill:none;stroke:#2f6fb5;stroke-width:1.6}
  .hi{fill:none;stroke:#8a8880;stroke-width:1.6;stroke-dasharray:6 3}
  .band{fill:#2f6fb5;opacity:0.07;stroke:none}
  @media (prefers-color-scheme: dark){
    .lab{fill:#b6b4ab} .hd{fill:#eceae3} .ax{stroke:#4a4844} .gd{stroke:#33312e}
    .mk{fill:#7fb2e8} .lo{stroke:#7fb2e8} .hi{stroke:#85837b} .band{fill:#7fb2e8;opacity:0.10}
  }
</style>
