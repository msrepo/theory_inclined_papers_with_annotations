<svg viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" role="img"><title>A line touching a circle at the nearest point to the origin</title><desc>Circles around the origin are contours of squared distance. The constraint line touches one circle at the nearest point, where the two gradient arrows point along the same direction.</desc><style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
  .t{font-size:13px;fill:#1a1a19} .sm{font-size:12px;fill:#57564f}
  .bg{fill:#f1efe8} .ct{fill:none;stroke:#b4b2a9;stroke-width:1} .trail{fill:none;stroke:#534ab7;stroke-width:2.5}
  .hot{fill:none;stroke:#eb6834;stroke-width:2} .gf{stroke:#eb6834;stroke-width:2.2} .gt{stroke:#534ab7;stroke-width:2.2}
  .ax{stroke:#8a8880;stroke-width:1} .dot{fill:#1a1a19}
  @media (prefers-color-scheme: dark){
    .t{fill:#eceae3} .sm{fill:#b6b4ab} .bg{fill:#2a2926} .ct{stroke:#5a5953} .trail{stroke:#8f88e6}
    .hot{stroke:#f0997b} .gf{stroke:#f0997b} .gt{stroke:#8f88e6} .ax{stroke:#85837b} .dot{fill:#eceae3}
  }
</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect class="bg" x="0" y="0" width="680" height="330" rx="8"/><circle class="ct" cx="150" cy="300" r="60.0"/><circle class="ct" cx="150" cy="300" r="120.0"/><circle class="ct" cx="150" cy="300" r="180.0"/><circle class="ct" cx="150" cy="300" r="240.0"/><circle class="ct" cx="150" cy="300" r="300.0"/><line class="ax" x1="20" y1="300" x2="660" y2="300"/><line class="ax" x1="150" y1="15" x2="150" y2="320"/><line class="trail" x1="78.0" y1="108.0" x2="342.0" y2="372.0"/><circle class="hot" cx="150" cy="300" r="84.9"/><line class="gf" x1="210.0" y1="240.0" x2="266.6" y2="183.4" marker-end="url(#a)"/><line class="gt" x1="210.0" y1="240.0" x2="266.5" y2="183.5" marker-end="url(#a)"/><circle class="dot" cx="210.0" cy="240.0" r="6"/><text class="t" x="330" y="60">Minimize the squared distance, staying on the line</text><text class="sm" x="330" y="82">Circles are contours of F; the purple line is the rule G = c.</text><text class="sm" x="330" y="104">At the best point the line only touches a circle,</text><text class="sm" x="330" y="124">so the two gradients lie on one line: grad F = λ grad G.</text></svg>
