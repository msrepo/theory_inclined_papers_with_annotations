<svg viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img"><title>Fenced field by a river and its area curve</title><desc>A rectangle beside a river with the best shape drawn, and the curve of area against the side along the river with its peak and the even split marked.</desc><style>
