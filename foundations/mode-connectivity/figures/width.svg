<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Straight-line barrier height against hidden width, before and after aligning units</title>
<desc>The raw barrier is not monotone: it grows from 0.4 at width two to about 1.7 at width six and falls to about 0.6 at width twenty. After aligning the hidden units it is near zero at every width from three up, and 0.17 at width two.</desc>
<style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
  .lab{font-size:12px;fill:#57564f} .hd{font-size:13px;font-weight:500;fill:#1a1a19}
  .ax{stroke:#c3c2b7;stroke-width:0.6;fill:none}
  .gd{stroke:#e2e1da;stroke-width:0.5;fill:none;stroke-dasharray:4 4}
  .a{fill:none;stroke:#2f6fb5;stroke-width:2} .b{fill:none;stroke:#c2642a;stroke-width:2}
  .g{fill:none;stroke:#2a8a5c;stroke-width:2}
  .ia{fill:#2f6fb5} .ib{fill:#c2642a} .ig{fill:#2a8a5c}
  @media (prefers-color-scheme: dark){
    .lab{fill:#b6b4ab} .hd{fill:#eceae3} .ax{stroke:#4a4844} .gd{stroke:#33312e}
    .a{stroke:#7fb2e8} .b{stroke:#e0955c} .g{stroke:#5fcf96}
    .ia{fill:#7fb2e8} .ib{fill:#e0955c} .ig{fill:#5fcf96}
  }
</style>
<text class="hd" x="70" y="24">Straight-line barrier height vs hidden width (median of 7 pairs)</text>
<line x1="70" y1="250.0" x2="760" y2="250.0" class="gd"/><text class="lab" x="62" y="254.0" text-anchor="end">1e-4</text>
<line x1="70" y1="203.3" x2="760" y2="203.3" class="gd"/><text class="lab" x="62" y="207.3" text-anchor="end">1e-3</text>
<line x1="70" y1="156.7" x2="760" y2="156.7" class="gd"/><text class="lab" x="62" y="160.7" text-anchor="end">1e-2</text>
<line x1="70" y1="110.0" x2="760" y2="110.0" class="gd"/><text class="lab" x="62" y="114.0" text-anchor="end">1e-1</text>
<line x1="70" y1="63.3" x2="760" y2="63.3" class="gd"/><text class="lab" x="62" y="67.3" text-anchor="end">1e0</text>
<line x1="70" y1="250" x2="760" y2="250" class="ax"/>
<text class="lab" x="70.0" y="268" text-anchor="middle">2</text>
<text class="lab" x="191.5" y="268" text-anchor="middle">3</text>
<text class="lab" x="277.7" y="268" text-anchor="middle">4</text>
<text class="lab" x="399.2" y="268" text-anchor="middle">6</text>
<text class="lab" x="552.3" y="268" text-anchor="middle">10</text>
<text class="lab" x="760.0" y="268" text-anchor="middle">20</text>
<text class="lab" x="415.0" y="292" text-anchor="middle">hidden units</text>
<polyline class="b" points="70.0,80.8 191.5,56.8 277.7,53.1 399.2,52.2 552.3,66.4 760.0,72.7"/>
<circle cx="70.0" cy="80.8" r="3.5" class="ib"/>
<circle cx="191.5" cy="56.8" r="3.5" class="ib"/>
<circle cx="277.7" cy="53.1" r="3.5" class="ib"/>
<circle cx="399.2" cy="52.2" r="3.5" class="ib"/>
<circle cx="552.3" cy="66.4" r="3.5" class="ib"/>
<circle cx="760.0" cy="72.7" r="3.5" class="ib"/>
<polyline class="a" points="70.0,99.8 191.5,250.0 277.7,222.1 399.2,204.7 552.3,250.0 760.0,230.4"/>
<circle cx="70.0" cy="99.8" r="3.5" class="ia"/>
<circle cx="191.5" cy="250.0" r="3.5" class="ia"/>
<circle cx="277.7" cy="222.1" r="3.5" class="ia"/>
<circle cx="399.2" cy="204.7" r="3.5" class="ia"/>
<circle cx="552.3" cy="250.0" r="3.5" class="ia"/>
<circle cx="760.0" cy="230.4" r="3.5" class="ia"/>
<line x1="330" y1="120.4" x2="355" y2="120.4" class="b"/><text class="lab" x="362" y="124.4">raw straight line</text>
<line x1="330" y1="138.4" x2="355" y2="138.4" class="a"/><text class="lab" x="362" y="142.4">after aligning units</text>
</svg>