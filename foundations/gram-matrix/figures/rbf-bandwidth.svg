<text x="40" y="226" class="lab">K = exp(−‖xᵢ − xⱼ‖² / 2σ²) for the same three points. Too small a σ and no two points look alike;</text>
<text x="40" y="243" class="lab">too large and they all do. Either extreme throws the geometry away.</text>
</svg>