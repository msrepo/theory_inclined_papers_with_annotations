<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img">
<title>RBF kernel Gram matrix at three bandwidths</title>
<desc>Three 3 by 3 heatmaps of the RBF kernel Gram matrix K_ij = exp(-||xi - xj||^2 / (2 sigma^2)) for the running example. At sigma = 0.3 it is almost the identity (every point is only similar to itself). At sigma = 1 the entries are 0.61, 0.08 and 0.37 off the diagonal. At sigma = 5 every entry is above 0.9 and the matrix is almost all ones.</desc>
<style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif}
  .lab{font-size:12px;fill:#57564f} .hd{font-size:13px;font-weight:500;fill:#1a1a19}
  .v{font-size:13px;fill:#1a1a19}
  .cell{fill:#7c3aed} .frame{fill:none;stroke:#c3c2b7;stroke-width:0.8}
  @media (prefers-color-scheme: dark){
    .lab{fill:#b6b4ab} .hd,.v{fill:#eceae3} .cell{fill:#b48cff} .frame{stroke:#4a4844}
  }
</style>
<text x="40" y="30" class="hd">σ = 0.3: ≈ identity</text>
<rect x="40" y="50" width="48" height="48" class="cell" opacity="0.64"/>
<rect x="40" y="50" width="48" height="48" class="frame"/>
