<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Jensen's inequality: log of an average is at least the average of logs</title>
<desc>The curve log x with two points a and b joined by a straight chord that lies below the curve. Above their midpoint, an orange dot on the curve (log of the average) sits higher than a blue dot on the chord (average of the logs). Text beside it states log of a weighted sum is at least the weighted sum of logs, with equality when all terms are equal.</desc>
<style>
