<path d="M 79.4,149.3 L 344.7,34.1" class="a"/>
<circle cx="79.4" cy="149.3" r="3.5" class="dot"/>
<circle cx="344.7" cy="34.1" r="3.5" class="dot"/>
<circle cx="212.1" cy="91.7" r="4" class="af"/>
<circle cx="212.1" cy="63.0" r="4" class="bf"/>
<line x1="212.1" x2="212.1" y1="63.0" y2="220" class="drop"/>
<text x="204.1" y="55.0" class="lab" text-anchor="end">log(average)</text>
<text x="220.1" y="105.7" class="lab">average of logs</text>
<text x="79.4" y="236" class="lab" text-anchor="middle">a</text>
<text x="344.7" y="236" class="lab" text-anchor="middle">b</text>
<text x="212.1" y="236" class="lab" text-anchor="middle">(a+b)/2</text>
<text x="377.1" y="19.1" class="hd" text-anchor="end">log x</text>
<text x="430" y="40" class="hd" xml:space="preserve">Jensen's inequality for log</text>
<text x="430" y="58" class="lab" xml:space="preserve">log bends downward (it is concave), so the</text>
<text x="430" y="76" class="lab" xml:space="preserve">straight chord between two points on it</text>
<text x="430" y="94" class="lab" xml:space="preserve">lies below the curve. At the midpoint:</text>
<text x="430" y="112" class="lab" xml:space="preserve"></text>
<text x="430" y="130" class="lab" xml:space="preserve">  log( ½a + ½b )  ≥  ½ log a + ½ log b</text>
<text x="430" y="148" class="lab" xml:space="preserve"></text>
<text x="430" y="166" class="lab" xml:space="preserve">Same for any weights q₁…q_K summing to 1:</text>
<text x="430" y="184" class="lab" xml:space="preserve">  log Σ q_k r_k  ≥  Σ q_k log r_k</text>
<text x="430" y="202" class="lab" xml:space="preserve"></text>
<text x="430" y="220" class="lab" xml:space="preserve">EM uses this to pull the log inside the sum.</text>
<text x="430" y="238" class="lab" xml:space="preserve">Equality holds when all the r_k are equal.</text>
</svg>
