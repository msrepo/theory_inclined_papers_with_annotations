<svg viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" role="img"><title>Completeness: a sequence that closes in on a point</title><desc>Top: on the rational numbers a sequence closes in on a spot that is not in the space, a hole. Bottom: on the real numbers the same sequence has its limit inside the space.</desc><style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
  .hd{font-size:14px;font-weight:500;fill:#1a1a19} .t{font-size:13px;fill:#1a1a19}
  .sm{font-size:12px;fill:#57564f} .orn{font-size:13px;fill:#c2571a} .blt{font-size:13px;fill:#2f6fb5} .grt{font-size:13px;fill:#0f7a5a}
  .ax{stroke:#c3c2b7;stroke-width:1;fill:none} .axs{stroke:#8a8880;stroke-width:1;fill:none}
  .dot{fill:#1a1a19} .mut{stroke:#57564f;stroke-width:1.3;fill:none;stroke-dasharray:4 3} .mutf{fill:#57564f}
  .blue{stroke:#2f6fb5;stroke-width:2.4;fill:none} .bluef{fill:#2f6fb5}
  .org{stroke:#c2571a;stroke-width:2.4;fill:none} .orgf{fill:#c2571a}
  .grn{stroke:#0f7a5a;stroke-width:2.4;fill:none} .grnf{fill:#0f7a5a}
  .ballo{fill:#c2571a;fill-opacity:.13;stroke:#c2571a;stroke-width:2}
  .ball1{fill:#7f77dd;fill-opacity:.18;stroke:#534ab7;stroke-width:2.2}
  .ball2{fill:#1d9e75;fill-opacity:.18;stroke:#0f6e56;stroke-width:2.2}
  .ball3{fill:#d85a30;fill-opacity:.15;stroke:#993c1d;stroke-width:2.2}
  .plane{fill:#2f6fb5;fill-opacity:.13;stroke:#2f6fb5;stroke-opacity:.6;stroke-width:1}
  .ra{stroke:#57564f;stroke-width:1.2;fill:none}
  .pos{fill:#2f6fb5;fill-opacity:.35} .neg{fill:#c2571a;fill-opacity:.35}
  .curve{fill:none;stroke:#1a1a19;stroke-width:2.2} .bg{fill:#f4f3ee}
  @media (prefers-color-scheme: dark){
    .hd,.t{fill:#eceae3} .sm{fill:#b6b4ab} .orn{fill:#f0a070} .blt{fill:#7fb2e8} .grt{fill:#4cc79a}
    .ax{stroke:#4a4844} .axs{stroke:#85837b} .dot{fill:#eceae3} .mut{stroke:#b6b4ab} .mutf{fill:#b6b4ab}
    .blue{stroke:#7fb2e8} .bluef{fill:#7fb2e8} .org{stroke:#f0a070} .orgf{fill:#f0a070}
    .grn{stroke:#4cc79a} .grnf{fill:#4cc79a}
    .ballo{fill:#f0a070;stroke:#f0a070} .ball1{fill:#b79df0;stroke:#b79df0} .ball2{fill:#4cc79a;stroke:#4cc79a} .ball3{fill:#f0a070;stroke:#f0a070}
    .plane{fill:#7fb2e8;stroke:#7fb2e8} .ra{stroke:#b6b4ab} .pos{fill:#7fb2e8} .neg{fill:#f0a070}
    .curve{stroke:#eceae3} .bg{fill:#23262b}
  }
</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="30.0" y="28.0" class="hd" text-anchor="start">Not complete: the rational numbers (fractions)</text><line x1="40.0" y1="110.0" x2="640.0" y2="110.0" class="axs" /><circle cx="70.0" cy="110.0" r="5" class="dot"/><circle cx="300.0" cy="110.0" r="5" class="dot"/><circle cx="430.0" cy="110.0" r="5" class="dot"/><circle cx="490.0" cy="110.0" r="5" class="dot"/><circle cx="515.0" cy="110.0" r="5" class="dot"/><path d="M70 98 Q185.0 40 300 98" class="mut" marker-end="url(#a)" style="stroke-dasharray:none"/><path d="M300 98 Q365.0 66 430 98" class="mut" marker-end="url(#a)" style="stroke-dasharray:none"/><path d="M430 98 Q460.0 83 490 98" class="mut" marker-end="url(#a)" style="stroke-dasharray:none"/><path d="M490 98 Q502.5 92 515 98" class="mut" marker-end="url(#a)" style="stroke-dasharray:none"/><text x="70.0" y="136.0" class="sm" text-anchor="middle">1</text><text x="300.0" y="136.0" class="sm" text-anchor="middle">1.4</text><text x="430.0" y="136.0" class="sm" text-anchor="middle">1.41</text><text x="490.0" y="136.0" class="sm" text-anchor="middle">1.414</text><circle cx="528" cy="110" r="7" class="org" style="fill:none"/><text x="528.0" y="160.0" class="orn" text-anchor="middle">a hole: the point they close in on</text><text x="528.0" y="177.0" class="orn" text-anchor="middle">(√2) is not a fraction</text><text x="30.0" y="228.0" class="hd" text-anchor="start">Complete: the real numbers</text><line x1="40.0" y1="310.0" x2="640.0" y2="310.0" class="axs" /><circle cx="70.0" cy="310.0" r="5" class="dot"/><circle cx="300.0" cy="310.0" r="5" class="dot"/><circle cx="430.0" cy="310.0" r="5" class="dot"/><circle cx="490.0" cy="310.0" r="5" class="dot"/><circle cx="515.0" cy="310.0" r="5" class="dot"/><path d="M70 298 Q185.0 240 300 298" class="mut" marker-end="url(#a)" style="stroke-dasharray:none"/><path d="M300 298 Q365.0 266 430 298" class="mut" marker-end="url(#a)" style="stroke-dasharray:none"/><path d="M430 298 Q460.0 283 490 298" class="mut" marker-end="url(#a)" style="stroke-dasharray:none"/><path d="M490 298 Q502.5 292 515 298" class="mut" marker-end="url(#a)" style="stroke-dasharray:none"/><circle cx="528" cy="310" r="7" class="grnf"/><text x="528.0" y="348.0" class="grt" text-anchor="middle">the limit is here, inside the space</text><line x1="30.0" y1="200.0" x2="650.0" y2="200.0" class="ax" /><text x="30.0" y="352.0" class="sm" text-anchor="start">Spacing not to scale.</text></svg>
