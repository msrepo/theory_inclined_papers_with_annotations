<svg viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" role="img"><title>Projection onto a subspace</title><desc>A target vector b above a plane. Its projection p on the plane is the closest point, and the residual from p to b is at a right angle to the plane. Another point q in the plane is farther from b.</desc><style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
  .hd{font-size:14px;font-weight:500;fill:#1a1a19} .t{font-size:13px;fill:#1a1a19}
  .sm{font-size:12px;fill:#57564f} .orn{font-size:13px;fill:#c2571a} .blt{font-size:13px;fill:#2f6fb5} .grt{font-size:13px;fill:#0f7a5a}
  .ax{stroke:#c3c2b7;stroke-width:1;fill:none} .axs{stroke:#8a8880;stroke-width:1;fill:none}
  .dot{fill:#1a1a19} .mut{stroke:#57564f;stroke-width:1.3;fill:none;stroke-dasharray:4 3} .mutf{fill:#57564f}
  .blue{stroke:#2f6fb5;stroke-width:2.4;fill:none} .bluef{fill:#2f6fb5}
  .org{stroke:#c2571a;stroke-width:2.4;fill:none} .orgf{fill:#c2571a}
  .grn{stroke:#0f7a5a;stroke-width:2.4;fill:none} .grnf{fill:#0f7a5a}
  .ballo{fill:#c2571a;fill-opacity:.13;stroke:#c2571a;stroke-width:2}
  .ball1{fill:#7f77dd;fill-opacity:.18;stroke:#534ab7;stroke-width:2.2}
  .ball2{fill:#1d9e75;fill-opacity:.18;stroke:#0f6e56;stroke-width:2.2}
  .ball3{fill:#d85a30;fill-opacity:.15;stroke:#993c1d;stroke-width:2.2}
  .plane{fill:#2f6fb5;fill-opacity:.13;stroke:#2f6fb5;stroke-opacity:.6;stroke-width:1}
  .ra{stroke:#57564f;stroke-width:1.2;fill:none}
  .pos{fill:#2f6fb5;fill-opacity:.35} .neg{fill:#c2571a;fill-opacity:.35}
  .curve{fill:none;stroke:#1a1a19;stroke-width:2.2} .bg{fill:#f4f3ee}
  @media (prefers-color-scheme: dark){
    .hd,.t{fill:#eceae3} .sm{fill:#b6b4ab} .orn{fill:#f0a070} .blt{fill:#7fb2e8} .grt{fill:#4cc79a}
    .ax{stroke:#4a4844} .axs{stroke:#85837b} .dot{fill:#eceae3} .mut{stroke:#b6b4ab} .mutf{fill:#b6b4ab}
    .blue{stroke:#7fb2e8} .bluef{fill:#7fb2e8} .org{stroke:#f0a070} .orgf{fill:#f0a070}
    .grn{stroke:#4cc79a} .grnf{fill:#4cc79a}
    .ballo{fill:#f0a070;stroke:#f0a070} .ball1{fill:#b79df0;stroke:#b79df0} .ball2{fill:#4cc79a;stroke:#4cc79a} .ball3{fill:#f0a070;stroke:#f0a070}
    .plane{fill:#7fb2e8;stroke:#7fb2e8} .ra{stroke:#b6b4ab} .pos{fill:#7fb2e8} .neg{fill:#f0a070}
    .curve{stroke:#eceae3} .bg{fill:#23262b}
  }
</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><polygon points="68.5,279.6 350.5,279.6 418.0,231.6 136.0,231.6" class="plane"/><text x="90.0" y="300.0" class="sm" text-anchor="start">subspace: the vectors you are allowed to use</text><line x1="100.0" y1="270.0" x2="268.0" y2="132.7" class="ax" marker-end="url(#a)"/><line x1="100.0" y1="270.0" x2="268.0" y2="132.7" class="mut" style="stroke-dasharray:none;stroke:#8a8880"/><line x1="100.0" y1="270.0" x2="268.0" y2="252.7" class="blue" marker-end="url(#a)"/><line x1="268.0" y1="252.7" x2="268.0" y2="132.7" class="org" marker-end="url(#a)"/><polyline points="268,252.7 279,252.7 279,241.7 268,241.7" class="ra"/><line x1="268.0" y1="252.7" x2="321.0" y2="266.0" class="mut" /><line x1="268.0" y1="132.7" x2="321.0" y2="266.0" class="mut" /><circle cx="100.0" cy="270.0" r="4" class="dot"/><circle cx="268.0" cy="132.7" r="5" class="dot"/><circle cx="268.0" cy="252.7" r="5" class="bluef"/><circle cx="321.0" cy="266.0" r="5" class="mutf"/><text x="278.0" y="130.0" class="t" text-anchor="start">b  (the target)</text><text x="180.0" y="252.0" class="blt" text-anchor="start">p</text><text x="274.0" y="190.0" class="orn" text-anchor="start">r = b − p</text><text x="328.0" y="270.0" class="sm" text-anchor="start">q</text><text x="86.0" y="266.0" class="sm" text-anchor="end">0</text><text x="450.0" y="42.0" class="hd" text-anchor="start">What the picture says</text><text x="450.0" y="72.0" class="t" text-anchor="start">1. p is the closest point to b</text><text x="450.0" y="90.0" class="sm" text-anchor="start">inside the subspace.</text><text x="450.0" y="126.0" class="t" text-anchor="start">2. The miss r meets the subspace</text><text x="450.0" y="144.0" class="sm" text-anchor="start">at a right angle. That right angle</text><text x="450.0" y="162.0" class="sm" text-anchor="start">is what makes p the closest.</text><text x="450.0" y="198.0" class="t" text-anchor="start">3. Pythagoras: any other q in the</text><text x="450.0" y="216.0" class="sm" text-anchor="start">subspace is farther from b than p,</text><text x="450.0" y="234.0" class="sm" text-anchor="start">since b to q is the hypotenuse of a</text><text x="450.0" y="252.0" class="sm" text-anchor="start">right triangle with r as one side.</text></svg>
