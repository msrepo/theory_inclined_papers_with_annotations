<svg viewBox="0 0 680 545" xmlns="http://www.w3.org/2000/svg" role="img"><title>Closest point on a line under three different lengths</title><desc>A target point above a tilted line. Growing a ball around it until it first touches the line gives the closest point. The diamond, circle and square touch at three different points. A fourth panel shows a square resting flat on a horizontal line, which touches along a whole segment.</desc><style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
  .hd{font-size:14px;font-weight:500;fill:#1a1a19} .t{font-size:13px;fill:#1a1a19}
  .sm{font-size:12px;fill:#57564f} .orn{font-size:13px;fill:#c2571a} .blt{font-size:13px;fill:#2f6fb5} .grt{font-size:13px;fill:#0f7a5a}
  .ax{stroke:#c3c2b7;stroke-width:1;fill:none} .axs{stroke:#8a8880;stroke-width:1;fill:none}
  .dot{fill:#1a1a19} .mut{stroke:#57564f;stroke-width:1.3;fill:none;stroke-dasharray:4 3} .mutf{fill:#57564f}
  .blue{stroke:#2f6fb5;stroke-width:2.4;fill:none} .bluef{fill:#2f6fb5}
  .org{stroke:#c2571a;stroke-width:2.4;fill:none} .orgf{fill:#c2571a}
  .grn{stroke:#0f7a5a;stroke-width:2.4;fill:none} .grnf{fill:#0f7a5a}
  .ballo{fill:#c2571a;fill-opacity:.13;stroke:#c2571a;stroke-width:2}
  .ball1{fill:#7f77dd;fill-opacity:.18;stroke:#534ab7;stroke-width:2.2}
  .ball2{fill:#1d9e75;fill-opacity:.18;stroke:#0f6e56;stroke-width:2.2}
  .ball3{fill:#d85a30;fill-opacity:.15;stroke:#993c1d;stroke-width:2.2}
  .plane{fill:#2f6fb5;fill-opacity:.13;stroke:#2f6fb5;stroke-opacity:.6;stroke-width:1}
  .ra{stroke:#57564f;stroke-width:1.2;fill:none}
  .pos{fill:#2f6fb5;fill-opacity:.35} .neg{fill:#c2571a;fill-opacity:.35}
  .curve{fill:none;stroke:#1a1a19;stroke-width:2.2} .bg{fill:#f4f3ee}
  @media (prefers-color-scheme: dark){
    .hd,.t{fill:#eceae3} .sm{fill:#b6b4ab} .orn{fill:#f0a070} .blt{fill:#7fb2e8} .grt{fill:#4cc79a}
    .ax{stroke:#4a4844} .axs{stroke:#85837b} .dot{fill:#eceae3} .mut{stroke:#b6b4ab} .mutf{fill:#b6b4ab}
    .blue{stroke:#7fb2e8} .bluef{fill:#7fb2e8} .org{stroke:#f0a070} .orgf{fill:#f0a070}
    .grn{stroke:#4cc79a} .grnf{fill:#4cc79a}
    .ballo{fill:#f0a070;stroke:#f0a070} .ball1{fill:#b79df0;stroke:#b79df0} .ball2{fill:#4cc79a;stroke:#4cc79a} .ball3{fill:#f0a070;stroke:#f0a070}
    .plane{fill:#7fb2e8;stroke:#7fb2e8} .ra{stroke:#b6b4ab} .pos{fill:#7fb2e8} .neg{fill:#f0a070}
    .curve{stroke:#eceae3} .bg{fill:#23262b}
  }
</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><line x1="15.0" y1="205.0" x2="210.0" y2="205.0" class="ax" /><line x1="45.0" y1="225.0" x2="45.0" y2="25.0" class="ax" /><line x1="15.0" y1="220.0" x2="210.0" y2="122.5" class="blue" /><polygon points="170.0,105.0 95.0,30.0 20.0,105.0 95.0,180.0" class="ballo"/><line x1="95.0" y1="105.0" x2="95.0" y2="180.0" class="mut" /><circle cx="95.0" cy="105.0" r="5" class="dot"/><circle cx="95.0" cy="180.0" r="6" class="bluef"/><text x="103.0" y="97.0" class="sm" text-anchor="start">b</text><line x1="235.0" y1="205.0" x2="430.0" y2="205.0" class="ax" /><line x1="265.0" y1="225.0" x2="265.0" y2="25.0" class="ax" /><line x1="235.0" y1="220.0" x2="430.0" y2="122.5" class="blue" /><circle cx="315.0" cy="105.0" r="67.08203932499369" class="ballo"/><line x1="315.0" y1="105.0" x2="345.0" y2="165.0" class="mut" /><circle cx="315.0" cy="105.0" r="5" class="dot"/><circle cx="345.0" cy="165.0" r="6" class="bluef"/><text x="323.0" y="97.0" class="sm" text-anchor="start">b</text><line x1="455.0" y1="205.0" x2="650.0" y2="205.0" class="ax" /><line x1="485.0" y1="225.0" x2="485.0" y2="25.0" class="ax" /><line x1="455.0" y1="220.0" x2="650.0" y2="122.5" class="blue" /><rect x="485.0" y="55.0" width="100" height="100" class="ballo"/><line x1="535.0" y1="105.0" x2="585.0" y2="155.0" class="mut" /><circle cx="535.0" cy="105.0" r="5" class="dot"/><circle cx="585.0" cy="155.0" r="6" class="bluef"/><text x="543.0" y="97.0" class="sm" text-anchor="start">b</text><text x="120.0" y="255.0" class="hd" text-anchor="middle">Diamond (sum of absolute values)</text><text x="120.0" y="273.0" class="sm" text-anchor="middle">touches the line at its corner</text><text x="340.0" y="255.0" class="hd" text-anchor="middle">Circle (ordinary length)</text><text x="340.0" y="273.0" class="sm" text-anchor="middle">touches at the perpendicular foot</text><text x="560.0" y="255.0" class="hd" text-anchor="middle">Square (largest coordinate)</text><text x="560.0" y="273.0" class="sm" text-anchor="middle">touches at its corner</text><text x="340.0" y="300.0" class="sm" text-anchor="middle">Same line, same target b. The ball grows until it first touches the line; that point is the closest.</text><line x1="30.0" y1="318.0" x2="650.0" y2="318.0" class="ax" /><line x1="70.0" y1="465.0" x2="295.0" y2="465.0" class="ax" /><rect x="105.0" y="365.0" width="100" height="100" class="ballo"/><line x1="105.0" y1="465.0" x2="205.0" y2="465.0" class="blue" style="stroke-width:5;stroke-linecap:round"/><circle cx="155.0" cy="415.0" r="5" class="dot"/><text x="163.0" y="407.0" class="sm" text-anchor="start">b</text><text x="155.0" y="503.0" class="hd" text-anchor="middle">Square on a flat line</text><text x="360.0" y="370.0" class="hd" text-anchor="start">When the ball is flat against the line</text><text x="360.0" y="395.0" class="sm" text-anchor="start">The square lies flat on the line, so it touches along a</text><text x="360.0" y="413.0" class="sm" text-anchor="start">whole stretch, not one point. Every point of that stretch</text><text x="360.0" y="431.0" class="sm" text-anchor="start">is equally close to b: the closest point is not unique.</text><text x="360.0" y="467.0" class="sm" text-anchor="start">A round ball always touches in exactly one place, the</text><text x="360.0" y="485.0" class="sm" text-anchor="start">foot of the perpendicular. That is why projection onto</text><text x="360.0" y="503.0" class="sm" text-anchor="start">a subspace is well defined in a Hilbert space.</text></svg>
