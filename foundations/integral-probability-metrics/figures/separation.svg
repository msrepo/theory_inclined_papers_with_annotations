<svg viewBox="0 0 680 350" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Distance versus separation</title>
<desc>Left: total variation, Wasserstein-1, Dudley, KL and Gaussian-kernel MMD for N(0,1) against N(m,1) as the shift m grows. TV saturates at 1, Dudley at 2 (very slowly), MMD at about 1.07, W1 grows linearly and KL quadratically. Right: the same for two point masses a distance D apart on a log axis: TV is 1, Dudley is 2D/(D+2), MMD tends to sqrt 2, W1 equals D and KL is infinite.</desc>
