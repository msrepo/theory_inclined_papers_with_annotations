<svg viewBox="0 0 680 350" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Dudley by two routes, and what a ramp cannot see</title>
<desc>Left: for each sup-norm budget a, the best gap over bounded-Lipschitz judges on n = 60 samples of N(0,1) and N(1,1), computed two independent ways: a search over ramp judges, and the exact optimal-transport cost with truncated ground cost min(|x - y|, 2a/(1-a)) times 1 - a, solved by the Hungarian algorithm. On the random samples the exact maximum is 0.3399 and the best ramp reaches 0.3315; on smooth quantile grids the two curves nearly coincide. Right: P = N(0,1) against a two-humped Q with the same mean. At a = 0.45 the best ramp earns 0.176, the best judge of any shape earns 0.351: it goes up at P's centre and down at each hump of Q.</desc>
