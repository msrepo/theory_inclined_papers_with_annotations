<svg viewBox="0 0 680 344" xmlns="http://www.w3.org/2000/svg" role="img"><title>Sinkhorn divergence removes the entropic bias</title><desc>Two plots against the shift between two Gaussians. Left, plain entropic optimal transport lies above the exact curve and does not start at zero, more so for larger epsilon. Right, the Sinkhorn divergence starts at zero.</desc><style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
  .hd{font-size:14px;font-weight:500;fill:#1a1a19} .t{font-size:13px;fill:#1a1a19}
  .sm{font-size:12px;fill:#57564f} .orn{font-size:13px;fill:#c2571a} .blt{font-size:13px;fill:#2f6fb5} .grt{font-size:13px;fill:#0f7a5a}
  .ax{stroke:#c3c2b7;stroke-width:1;fill:none} .axs{stroke:#8a8880;stroke-width:1;fill:none}
  .mut{stroke:#57564f;stroke-width:1.3;fill:none;stroke-dasharray:4 3}
  .cb{fill:#2f6fb5} .tick{stroke:#1a1a19;stroke-width:2.2} .barr{fill:#c2571a;fill-opacity:.55} .barc{fill:#0f7a5a;fill-opacity:.55}
  .l1{stroke:#7f77dd;stroke-width:2.4;fill:none} .l2{stroke:#2f6fb5;stroke-width:2.4;fill:none}
  .l3{stroke:#0f7a5a;stroke-width:2.4;fill:none} .l4{stroke:#c2571a;stroke-width:2.4;fill:none}
  .ex{stroke:#1a1a19;stroke-width:1.6;fill:none;stroke-dasharray:5 3}
  @media (prefers-color-scheme: dark){
    .hd,.t{fill:#eceae3} .sm{fill:#b6b4ab} .orn{fill:#f0a070} .blt{fill:#7fb2e8} .grt{fill:#4cc79a}
    .ax{stroke:#4a4844} .axs{stroke:#85837b} .mut{stroke:#b6b4ab}
    .cb{fill:#7fb2e8} .tick{stroke:#eceae3} .barr{fill:#f0a070} .barc{fill:#4cc79a}
    .l1{stroke:#b79df0} .l2{stroke:#7fb2e8} .l3{stroke:#4cc79a} .l4{stroke:#f0a070} .ex{stroke:#eceae3}
  }
</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="30.0" y="26.0" class="hd" text-anchor="start">Plain entropic OT is biased; subtracting the two self-terms removes the bias</text><text x="195.0" y="54.0" class="t" text-anchor="middle">plain entropic OT</text><line x1="60.0" y1="260.0" x2="330.0" y2="260.0" class="axs" /><line x1="60.0" y1="70.0" x2="60.0" y2="260.0" class="axs" /><text x="195.0" y="284.0" class="sm" text-anchor="middle">shift between the two distributions</text><polyline points="60.0,260.0 87.0,258.2 114.0,252.7 141.0,243.6 168.0,230.8 195.0,214.3 222.0,194.2 249.0,170.5 276.0,143.1 303.0,112.0 330.0,77.3" class="ex"/><polyline points="60.0,255.5 87.0,253.7 114.0,248.2 141.0,239.1 168.0,226.3 195.0,209.9 222.0,189.8 249.0,166.0 276.0,138.6 303.0,107.5 330.0,72.8" class="l2"/><polyline points="60.0,248.1 87.0,246.3 114.0,240.8 141.0,231.7 168.0,218.9 195.0,202.4 222.0,182.3 249.0,158.6 276.0,131.2 303.0,100.1 330.0,65.4" class="l4"/><text x="515.0" y="54.0" class="t" text-anchor="middle">Sinkhorn divergence</text><line x1="380.0" y1="260.0" x2="650.0" y2="260.0" class="axs" /><line x1="380.0" y1="70.0" x2="380.0" y2="260.0" class="axs" /><text x="515.0" y="284.0" class="sm" text-anchor="middle">shift between the two distributions</text><polyline points="380.0,260.0 407.0,258.2 434.0,252.7 461.0,243.6 488.0,230.8 515.0,214.3 542.0,194.2 569.0,170.5 596.0,143.1 623.0,112.0 650.0,77.3" class="ex"/><polyline points="380.0,260.0 407.0,258.2 434.0,252.7 461.0,243.6 488.0,230.8 515.0,214.3 542.0,194.2 569.0,170.5 596.0,143.1 623.0,112.0 650.0,77.3" class="l2"/><polyline points="380.0,260.0 407.0,258.2 434.0,252.7 461.0,243.6 488.0,230.8 515.0,214.3 542.0,194.2 569.0,170.5 596.0,143.1 623.0,112.0 650.0,77.3" class="l4"/><text x="60.0" y="308.0" class="sm" text-anchor="start">Dashed: the exact squared Wasserstein distance (the squared shift).  Blue: small ε.  Orange: large ε.</text><text x="60.0" y="326.0" class="sm" text-anchor="start">Left: at zero shift the curves start above zero, and the offset grows with ε.  Right: both start at zero and lie on the dashed curve.</text></svg>
