<svg viewBox="0 0 680 310" xmlns="http://www.w3.org/2000/svg" role="img"><title>How epsilon spreads the mass from one source point</title><desc>Four curves showing where the mass at one source point is sent in the target distribution. The smallest epsilon concentrates it near one destination; larger epsilon spreads it over a wide range.</desc><style>
