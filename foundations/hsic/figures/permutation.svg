<svg viewBox="0 0 700 262" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The permutation test for HSIC</title>
<desc>Two histograms of HSIC under 999 random shuffles of y. For the parabola the observed value 0.0265 lies far to the right of every shuffle, p = 0.001. For the independent cloud the observed value 0.0006 sits inside the shuffled values, p = 0.592.</desc>
