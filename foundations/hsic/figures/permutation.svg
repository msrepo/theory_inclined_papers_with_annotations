  .pos{fill:#2f6fb5} .neg{fill:#c2571a} .bg{fill:#f4f3ee}
  .bar{fill:#8a8880;opacity:.55}
  .obs{stroke:#b42318;stroke-width:2} .obst{fill:#b42318;font-weight:500}
  @media (prefers-color-scheme: dark){
