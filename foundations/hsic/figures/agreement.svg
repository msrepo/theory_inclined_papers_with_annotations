<svg viewBox="0 0 720 292" xmlns="http://www.w3.org/2000/svg" role="img">
<title>HSIC as the agreement of two centred Gram matrices</title>
<desc>Three 5 by 5 heatmaps for x = (-2,-1,0,1,2) and y = x squared with Gaussian kernels at the median bandwidths. Left: the centred x Gram matrix. Middle: the centred y Gram matrix. Right: their elementwise product, which is mostly positive: pairs that are unusually close in x are also unusually close in y. The 25 products sum to 0.309, giving HSIC = 0.0123; the average over all 120 shuffles of y is 0.0177.</desc>
